<script id="data" type="application/json">{"title": "2026 전기산업기사 전기설비기술기준 3회 기출 핵심풀이", "videoId": "14zSahdpZaw", "questions": [{"no": 1, "question": "특고압 가공전선로의 지지물 중 전선로의 지지물 간 이격거리(경간)가 큰 곳에 사용하는 철탑은?", "choices": ["① 직선형", "② 보강형", "③ 내장형", "④ 잡아당김형"], "answerIndex": 2, "solution": "키워드는 **'지지물 간 이격거리(경간)가 큰 곳'** — 이는 **내장형** 철탑의 정의이다.\n직선형은 수평각도 3도 이하, 각도형은 3도 초과 개소에 사용하며, 잡아당김형(인류형)은 전가섭선을 잡아당기는(인류하는) 곳에 사용한다.", "timestampSec": 53, "theory": "**철탑의 종류(KEC 신용어 병기)**: 직선형(3도 이하) / 각도형(3도 초과) / 잡아당김형(=인류형, 전가섭선 인류 개소) / 내장형(경간 차가 큰 곳) / 보강형(전선로 보강)\n**함정 포인트**: KEC 용어 변경으로 '경간'→'지지물 간 이격거리', '인류형'→'잡아당김형'으로 출제될 수 있으니 신·구 용어를 모두 알아둘 것."}, {"no": 2, "question": "지중전선로에 사용하는 지중함의 시설기준으로 틀린 것은?", "choices": ["① 지중함은 견고하고 차량 기타 중량물의 압력에 견디는 구조일 것", "② 지중함은 그 안의 고인 물을 제거할 수 있는 구조로 되어 있을 것", "③ 폭발성 또는 연소성의 가스가 침입할 우려가 있는 곳에 시설하는 지중함으로서 그 크기가 1 $\\mathrm{m^3}$ 이상인 것에는 밀폐구조로 시설할 것", "④ 지중함의 뚜껑은 시설자 이외의 자가 쉽게 열 수 없도록 시설할 것"], "answerIndex": 2, "solution": "가스 침입 우려 장소의 지중함(크기 1$\\mathrm{m^3}$ 이상)은 밀폐가 아니라 **통풍장치 기타 가스를 방산시키기 위한 적당한 장치**를 시설해야 한다. 밀폐하면 가스가 고여 폭발 위험이 커진다.\n①·②·④는 모두 올바른 시설기준이다.", "timestampSec": 165, "theory": "**지중함 시설기준 4가지**: ① 견고하고 중량물 압력에 견딜 것 ② 고인 물 제거 가능한 구조 ③ 가스 침입 우려 + 1$\\mathrm{m^3}$ 이상 → **통풍장치**(밀폐 X) ④ 뚜껑은 시설자 이외의 자가 쉽게 열 수 없을 것\n**함정 포인트**: '세척장치'나 '조명장치'는 법에 규정이 없다 — 틀린 보기로 자주 등장."}, {"no": 3, "question": "'전차선로'에 포함되지 않는 것은?", "choices": ["① 신호선", "② 전차선", "③ 급전선", "④ 귀선"], "answerIndex": 0, "solution": "전차선로는 **전차선 + 급전선 + 귀선** 및 이들을 지지하는 공작물로 구성된다.\n전차선은 전차에 전기를 공급하는 접촉전선, 급전선은 변전소에서 전차선까지 이르는 전선, 귀선은 전류가 되돌아가는 레일 측 회로이다. **신호선은 전차선로에 포함되지 않는다.**", "timestampSec": 296, "theory": "**전차선로의 구성**: 전차선(전차 전원공급 접촉선) / 급전선(변전소→전차선) / 귀선(레일 또는 귀선용 레일로 전류 귀환)\n**함정 포인트**: 신호선·통신선은 전차선로 구성요소가 아니다."}, {"no": 4, "question": "주택의 옥내전로 시설기준으로 틀린 것은?", "choices": ["① 사용전압은 400[V] 이하여야 한다.", "② 대지전압은 300[V] 이하이어야 한다.", "③ 정격 소비 전력 3[kW] 이상의 전기기계기구에 전기를 공급하기 위한 전로에는 전용의 개폐기 및 과전류 차단기를 시설하고 그 전로의 옥내배선과 직접 접속하거나 전용콘센트를 시설하지 않는다.", "④ 전기기계기구 및 옥내의 전선은 사람이 쉽게 접촉할 우려가 없도록 시설하여야 한다."], "answerIndex": 2, "solution": "3[kW] 이상 대형 기기용 전로는 전용 개폐기·과전류 차단기를 시설하고 옥내배선과 직접 접속하거나 **전용콘센트를 시설하여야** 한다. '시설하지 않는다'가 틀렸다.\n주택은 안전장치를 강화하는 방향이 원칙 — 안전설비를 '하지 않는다'는 보기는 틀린 것으로 판단하면 된다.", "timestampSec": 396, "theory": "**주택 옥내전로 핵심 수치**: 사용전압 400[V] 이하, 대지전압 300[V] 이하\n**3[kW] 이상 기기**: 전용 개폐기 + 과전류 차단기 + 직접 접속 또는 전용콘센트\n**함정 포인트**: 주택은 안전장치를 강화해야 하므로 '~하지 않는다'류 보기가 오답(=정답 선택지)이 되기 쉽다."}, {"no": 5, "question": "시가지 등에서 특고압 가공전선로의 시설에서 사용전압이 170[kV] 이하인 전선로의 시설기준으로 틀린 것은?", "choices": ["① 2련 이상의 현수애자 또는 긴 애자를 사용하는 것", "② B종 지지물 사용 시 지지물 간 거리는 100[m] 이하인 것", "③ 지지물에는 철주, 철근콘크리트주 또는 철탑을 사용할 것", "④ 전선은 케이블을 사용할 것"], "answerIndex": 1, "solution": "시가지 특고압 가공전선로의 지지물 간 거리(경간)는 **A종 75[m], B종 150[m], 철탑 400[m](단주 300[m], 시가지 250[m] 적용례)**이다.\nB종은 150[m]인데 100[m]로 서술했으므로 ②가 틀렸다.", "timestampSec": 440, "theory": "**시가지 특고압(170kV 이하) 경간**: A종 75[m] / B종 150[m] / 철탑 400[m]\n**기타 조건**: 지지물은 철주·철근콘크리트주·철탑(목주 불가), 애자는 2련 이상 현수애자, 전선은 케이블 등 강화 조건 적용\n**함정 포인트**: 숫자만 바꿔 출제 — A종 75, B종 150을 정확히 암기."}, {"no": 6, "question": "라이팅 덕트 공사에 의한 저압 옥내배선에서 덕트의 지지점 간의 거리는 몇 [m] 이하인가?", "choices": ["① 2", "② 3", "③ 4", "④ 5"], "answerIndex": 0, "solution": "라이팅 덕트의 지지점 간 거리는 **2[m] 이하**로 하여야 한다.", "timestampSec": 588, "theory": "**라이팅 덕트 공사**: 지지점 간 거리 2[m] 이하, 끝부분은 막을 것, 개구부는 아래로 향하게 시설\n**함정 포인트**: 금속덕트·버스덕트의 지지점 간 거리 3[m](수직 6[m])와 혼동하지 말 것 — 라이팅 덕트는 2[m]."}, {"no": 7, "question": "전자 개폐기의 조작회로 또는 초인벨·경보벨 등에 접속하는 전로로서 최대 사용전압이 60[V] 이하의 소세력 회로에 전기를 공급하기 위한 절연변압기의 사용전압은 대지전압 몇 [V] 이하로 하여야 하는가?", "choices": ["① 100", "② 200", "③ 300", "④ 600"], "answerIndex": 2, "solution": "소세력 회로에 전기를 공급하는 절연변압기의 1차측 사용전압은 **대지전압 300[V] 이하**이어야 한다.", "timestampSec": 641, "theory": "**소세력 회로**: 최대 사용전압 60[V] 이하(전자 개폐기 조작회로, 초인벨·경보벨 등)\n**절연변압기 1차측**: 대지전압 300[V] 이하\n**함정 포인트**: 소세력 회로 자체 전압(60V)과 공급 변압기 대지전압(300V)을 구분해서 암기."}, {"no": 8, "question": "발전소에서 계측장치를 시설하지 않아도 되는 것은?", "choices": ["① 발전기의 회전수 및 주파수", "② 발전기의 고정자 및 베어링 온도", "③ 주요 변압기의 전압 및 전류 또는 전력", "④ 특고압용 변압기의 온도"], "answerIndex": 0, "solution": "발전소의 필수 계측장치는 ② 발전기 고정자·베어링의 온도, ③ 발전기·주요 변압기의 전압·전류·전력, ④ 특고압용 변압기의 온도이다.\n**회전수·주파수·역률계는 법정 필수 계측 대상이 아니다.** 주파수가 보이면 바로 정답으로 선택.", "timestampSec": 678, "theory": "**발전소 필수 계측장치**: 발전기·주변압기의 전압, 전류, 전력 / 발전기 고정자 및 베어링의 온도 / 특고압용 변압기의 온도\n**함정 포인트**: '고정자'가 '회전자'로 바뀌거나 '특고압용'이 '고압·저압용'으로 바뀌면 오답. 주파수계·역률계는 필수 아님."}, {"no": 9, "question": "특고압 가공전선로의 지지물에 시설하는 통신선 또는 이에 직접 접속하는 통신선이 도로·횡단보도교·철도의 레일·삭도·가공전선·다른 가공약전류 전선 등 또는 교류 전차선 등과 교차하는 경우 통신선과 삭도 또는 다른 가공약전류 전선 등 사이의 간격은 몇 [m] 이상이어야 하는가? (단, 통신선은 광섬유 케이블이다.)", "choices": ["① 0.3", "② 0.4", "③ 0.5", "④ 0.6"], "answerIndex": 1, "solution": "통신선과 삭도·가공약전류전선의 이격거리는 원칙 0.8[m]이지만, 통신선이 **케이블(광섬유 케이블 포함)이면 절반인 0.4[m]** 이상으로 완화된다.", "timestampSec": 756, "theory": "**통신선-삭도·약전류전선 교차 간격**: 일반 0.8[m] → 케이블·광섬유 케이블이면 0.4[m]\n**함정 포인트**: '케이블' 조건이 붙으면 반값으로 줄어드는 패턴을 기억할 것."}, {"no": 10, "question": "고압 가공전선으로 ACSR(강심 알루미늄 연선)을 사용할 때 안전율은 얼마 이상이 되는 처짐 정도(이도)로 시설하여야 하는가?", "choices": ["① 1.38", "② 2.1", "③ 2.5", "④ 4.01"], "answerIndex": 2, "solution": "가공전선의 안전율은 경동선·내열동합금선은 2.2 이상, **그 밖의 전선(ACSR 등)은 2.5 이상**이다. ACSR이므로 2.5.", "timestampSec": 872, "theory": "**안전율 정리(순서 암기)**: 1.33(이상 시 상정하중에 대한 철탑 기초) / 1.5(안테나, 케이블트레이) / 2.0(기초 안전율, 평상시) / 2.2(경동선·내열동합금선) / 2.5(ACSR 등 기타 전선, 지지선)\n**함정 포인트**: 경동선이면 2.2, ACSR이면 2.5 — 전선 재질 키워드로 구분."}, {"no": 11, "question": "충전부 전체를 대지로부터 절연시키거나, 한 점을 임피던스를 통해 대지에 접속시키는 계통접지 방식은?", "choices": ["① TN-C", "② TN-S", "③ TT", "④ IT"], "answerIndex": 3, "solution": "**'절연' 또는 '임피던스를 통해 접속'** 키워드가 나오면 **IT 계통**이다. I가 절연(Isolation)·임피던스를 의미한다.\nTN-C는 중성선과 보호도체를 겸용(PEN), TN-S는 분리(PE, N), TT는 계통접지와 별개의 독립 접지를 갖는 방식이다.", "timestampSec": 955, "theory": "**계통접지 문자 의미**: T(대지 직접접지), N(중성선 이용), C(겸용 PEN), S(분리 PE·N), I(절연 또는 임피던스 접속)\n**구분 키워드**: 겸용→TN-C / 분리→TN-S / 독립 접지→TT / 절연·임피던스→IT"}, {"no": 12, "question": "고압 가공전선로의 가공지선에 나경동선을 사용하려면 지름 몇 [mm] 이상의 것을 사용하여야 하는가?", "choices": ["① 2.0", "② 3.0", "③ 4.0", "④ 5.0"], "answerIndex": 2, "solution": "가공지선은 낙뢰로부터 전력선을 보호하는 선으로, **고압 가공전선로는 지름 4.0[mm] 이상**의 나경동선을 사용한다.\n특고압 가공전선로라면 5.0[mm] 이상으로 바뀐다.", "timestampSec": 1143, "theory": "**가공지선 굵기(나경동선)**: 고압 → 4.0[mm] 이상 / 특고압 → 5.0[mm] 이상\n**개념**: 가공지선은 지지물 최상부에 시설하여 낙뢰를 대지로 방류, 전력선을 보호\n**함정 포인트**: 문제 앞에 '특'자만 붙으면 답이 5.0으로 바뀐다."}, {"no": 13, "question": "저압 또는 고압의 가공 전선로와 기설 가공약전류 전선로가 병행할 때 유도작용에 의한 통신상의 장해가 생기지 않도록 전선과 기설 약전류 전선간의 이격거리는 몇 [m] 이상이어야 하는가? (단, 전기철도용 급전선로는 제외한다.)", "choices": ["① 2", "② 3", "③ 4", "④ 6"], "answerIndex": 0, "solution": "저·고압 가공전선로와 가공약전류전선로가 병행하는 경우 유도장해 방지를 위한 이격거리는 **2[m] 이상**이다.", "timestampSec": 1221, "theory": "**유도장해 방지 이격거리**: 저압·고압 가공전선 ↔ 가공약전류전선 병행 시 2[m] 이상\n**함정 포인트**: '동일 지지물'(병가·공가) 조건이 붙으면 다른 규정이 적용되므로 문제 조건을 반드시 확인."}, {"no": 14, "question": "22.9[kV] 3상 4선식 다중 접지방식의 지중 전선로의 절연내력시험을 할 경우 시험전압은 몇 [V]인가?", "choices": ["① 16448", "② 21068", "③ 32796", "④ 42136"], "answerIndex": 1, "solution": "중성점 다중접지식으로 7[kV] 초과 25[kV] 이하인 전로의 절연내력 시험전압은 **최대사용전압의 0.92배**이다.\n$22900 \\times 0.92 = 21068$[V] → ②.", "timestampSec": 1276, "theory": "**절연내력 시험전압 배수**: 7[kV] 이하 → 1.5배(최저 500[V]) / 7~25[kV] 다중접지 → 0.92배 / 7~60[kV] 기타 → 1.25배(최저 10500[V])\n**함정 포인트**: 22.9[kV]에 '다중접지'가 보이면 무조건 0.92배. 22900보다 조금 작은 값(21068)을 고르면 계산 없이도 해결."}, {"no": 15, "question": "전기저장장치를 시설하는 곳에 필수 계측장치가 아닌 것은?", "choices": ["① 이차전지 출력 단자의 전압, 전류, 전력", "② 이차전지 출력 단자의 충방전 상태", "③ 주요변압기의 전압, 전류 및 전력", "④ 주요변압기의 온도"], "answerIndex": 3, "solution": "전기저장장치의 필수 계측장치는 이차전지 출력 단자의 전압·전류·전력·충방전 상태와 주요변압기의 전압·전류·전력이다.\n**변압기 '온도'는 전기저장장치 규정에 없으므로** ④가 정답. 발전소 계측장치(특고압용 변압기 온도 포함)와 혼동하지 말 것.", "timestampSec": 1436, "theory": "**전기저장장치 필수 계측**: 이차전지 출력단자 V·I·P + 충방전 상태 / 주요변압기 V·I·P\n**함정 포인트**: 발전소 규정에는 특고압용 변압기 온도가 필수지만, 전기저장장치 규정에는 온도 항목이 아예 없다."}, {"no": 16, "question": "전선 기타의 가섭선 주위에 두께 6[mm], 비중 0.9의 빙설이 부착된 상태에서 을종 풍압하중은 구성재의 수직 투영면적 1[$\\mathrm{m^2}$]당 몇 [Pa]을 기초로 하여 계산하는가? (단, 다도체를 구성하는 전선이 아니라고 한다.)", "choices": ["① 333", "② 372", "③ 588", "④ 666"], "answerIndex": 1, "solution": "을종 풍압하중은 갑종의 **절반**을 기초로 한다. 단도체 전선의 갑종 풍압하중은 745[Pa]이므로 을종은 $745 \\div 2 \\fallingdotseq 372$[Pa].\n다도체였다면 갑종 666[Pa] → 을종 333[Pa]이 된다. 문제에서 '다도체가 아니다'라고 했으므로 372.", "timestampSec": 1516, "theory": "**풍압하중**: 갑종(고온계) — 단도체 전선 745[Pa], 다도체 666[Pa] / 을종(저온계, 빙설 6mm·비중 0.9 부착) — 갑종의 1/2 (단도체 372, 다도체 333)\n**함정 포인트**: 다도체 여부에 따라 372 ↔ 333이 바뀐다. 문제의 단서 조건을 반드시 확인."}, {"no": 17, "question": "가공전선로에 사용하는 지지물의 강도 계산 시 강관에 의하여 구성된 철탑에서 구성재의 수직 투영면적 1[$\\mathrm{m^2}$]에 대한 풍압을 기초로 적용하는 갑종 풍압하중 값의 기준으로 알맞은 것은?", "choices": ["① 588", "② 1117", "③ 1255", "④ 2157"], "answerIndex": 2, "solution": "갑종 풍압하중에서 **강관으로 구성된 철탑은 1255[Pa]**이다.\n앞자리 암기법: 588(원형 목주·철주·철근콘크리트주) / 10××(애자장치 1039) / 11××(강관 철주 1117) / 12××(강관 철탑 1255) / 14××(기타 2157 등 특수).", "timestampSec": 1596, "theory": "**갑종 풍압하중 주요값**: 원형 목주·철주·콘크리트주 588[Pa] / 애자장치 1039[Pa] / 강관 구성 철주 1117[Pa] / 강관 구성 철탑 1255[Pa]\n**암기 팁**: 앞자리만 따서 '10 애자, 11 강관 철주, 12 강관 철탑'으로 정리하면 수십 년치 숫자 문제를 커버할 수 있다."}, {"no": 18, "question": "고압 옥내배선의 공사 방법으로 불가능한 것은?", "choices": ["① 애자사용공사(건조한 장소로 전개된 장소)", "② 금속관공사", "③ 케이블공사", "④ 케이블트레이공사"], "answerIndex": 1, "solution": "고압 옥내배선이 가능한 공사는 **애자사용공사(건조하고 전개된 장소), 케이블공사, 케이블트레이공사** 3가지뿐이다.\n**금속관공사는 저압 배선용**으로, 고압 옥내배선에는 사용할 수 없다.", "timestampSec": 1687, "theory": "**고압 옥내배선 가능 공법 3가지**: 애자사용공사(건조·전개 장소 한정) / 케이블공사 / 케이블트레이공사\n**함정 포인트**: 금속관·합성수지관·가요전선관 등 관공사는 고압에서 불가 — 저압 공사법과 혼동 주의."}, {"no": 19, "question": "전력계통에서 돌발적으로 발생하는 이상현상에 대비하여 대지와 계통을 연결하는 것으로, 중성점을 대지에 접속하는 것은 무엇인가?", "choices": ["① 피뢰시스템", "② 단독접지", "③ 계통접지", "④ 보호접지"], "answerIndex": 2, "solution": "계통의 중성점을 대지에 접속하여 이상현상에 대비하는 것은 **계통접지**의 정의이다.\n피뢰시스템은 낙뢰 보호, 단독접지는 독립적으로 시설한 접지 방식, 보호접지는 인체 감전 보호 목적이다.", "timestampSec": 1786, "theory": "**접지 용어 구분**: 계통접지(중성점을 대지에 접속, 계통 이상현상 대비) / 보호접지(감전 보호, 노출도전부 접지) / 피뢰시스템(낙뢰 보호) / 단독접지(다른 접지와 독립 시설)\n**함정 포인트**: '중성점 + 대지 접속' 키워드 = 계통접지."}, {"no": 20, "question": "저압전로에 사용하는 배선용 차단기의 경우 산업용일 경우 63[A] 이하일 때 동작 전류는 몇 배인가?", "choices": ["① 1.05배", "② 1.13배", "③ 1.3배", "④ 1.45배"], "answerIndex": 2, "solution": "산업용 배선용 차단기(63[A] 이하, 60분)의 부동작 전류는 1.05배, **동작 전류는 1.3배**이다.\n주택용은 부동작 1.13배, 동작 1.45배로 다르니 구분할 것.", "timestampSec": 1816, "theory": "**배선용 차단기 동작특성(63A 이하, 60분)**: 산업용 — 부동작 1.05배 / 동작 1.3배, 주택용 — 부동작 1.13배 / 동작 1.45배\n**함정 포인트**: '산업용/주택용'과 '부동작/동작' 조합 4가지가 모두 출제된다. 최근 필기·실기 공통 빈출."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
