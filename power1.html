V결선 등으로 3상에도 널리 사용된다(예: 3상 단권변압기 기동보상기). 따라서 ④가 틀린 설명이다.", "timestampSec": 505, "theory": "**개념**: 단권변압기는 직렬권선+분로권선 구조로 권선 일부를 1·2차 공용. 동량 절약, 소형·경량, 효율 높고 전압변동률 작음.\n**함정 포인트**: 단점은 1·2차가 절연되지 않아 저압측도 고압측 이상전압의 영향을 받는 것. '3상 사용 불가'는 항상 틀린 보기."}, {"no": 4, "question": "피뢰기의 직렬 갭(gap)의 작용으로 가장 옳은 것은?", "choices": ["① 이상전압의 진행파를 증가시킨다.", "② 상용주파수의 전류를 방전시킨다.", "③ 이상전압이 내습하면 뇌전류를 방전하고, 상용주파수의 속류를 차단하는 역할을 한다.", "④ 뇌전류 방전 시의 전위상승을 억제하여 절연파괴를 방지한다."], "answerIndex": 2, "solution": "직렬 갭은 평상시 절연을 유지하다가 이상전압 내습 시 방전하여 뇌전류를 대지로 흘리고, 방전 후에는 상용주파 속류를 차단하여 원래 상태로 회복시킨다. (④는 특성요소의 역할)", "timestampSec": 715, "theory": "**개념**: 피뢰기 = 직렬 갭 + 특성요소(ZnO). 직렬 갭 — 뇌전류 방전·속류 차단. 특성요소 — 방전 시 전위상승 억제(비직선 저항).\n**함정 포인트**: 갭의 역할(③)과 특성요소의 역할(④)을 바꿔 묻는 것이 단골 출제."}, {"no": 5, "question": "정격전압 25.8[kV], 정격차단용량 500[MVA]인 3상 차단기의 정격차단전류는 약 몇 [kA]인가?", "choices": ["① 5.2", "② 8.2", "③ 11.2", "④ 12.29"], "answerIndex": 2, "solution": "$P_s=\\sqrt{3}\\,V I_s$에서 $I_s=\\dfrac{P_s}{\\sqrt{3}V}=\\dfrac{500}{\\sqrt{3}\\times25.8}\\approx11.2$[kA]", "timestampSec": 751, "theory": "**핵심 공식**: 정격차단용량 $P_s=\\sqrt{3}\\times$정격전압$\\times$정격차단전류\n**개념**: MVA와 kV를 그대로 넣으면 답이 kA로 나온다.\n**함정 포인트**: $\\sqrt{3}$ 누락 또는 상전압 사용 오류에 주의."}, {"no": 6, "question": "수차의 유효낙차와 안내날개, 그리고 노즐의 열린 정도를 일정하게 해 놓은 상태에서 조속기가 동작하지 않게 하고, 전부하 정격속도로 운전 중에 무부하로 하였을 경우에 도달하는 최고속도를 무엇이라 하는가?", "choices": ["① 특유 속도 (specific speed)", "② 동기 속도 (synchronous speed)", "③ 무구속 속도 (runaway speed)", "④ 임펄스 속도 (impulse speed)"], "answerIndex": 2, "solution": "부하 차단 후 조속기가 동작하지 않을 때 수차가 도달하는 최대 회전속도를 무구속 속도(runaway speed)라 한다.", "timestampSec": 865, "theory": "**개념**: 무구속 속도는 정격속도의 1.6~2.2배 정도까지 상승할 수 있어 회전부 기계적 강도 설계의 기준이 된다.\n**함정 포인트**: 특유속도 $N_s=N\\dfrac{P^{1/2}}{H^{5/4}}$(수차 형식 선정용)와 혼동하지 말 것."}, {"no": 7, "question": "전력원선도에서 구할 수 없는 것은?", "choices": ["① 송·수전할 수 있는 최대 전력", "② 필요한 전력을 보내기 위한 송·수전단 전압 간의 상차각", "③ 선로 손실과 송전 효율", "④ 과도극한전력"], "answerIndex": 3, "solution": "전력원선도에서 과도 안정 극한전력과 코로나 손실은 구할 수 없다. 정답 ④.", "timestampSec": 911, "theory": "**핵심 공식**: 전력원선도 반지름 $\\rho=\\dfrac{E_s E_r}{B}$, 가로축 유효전력·세로축 무효전력\n**개념**: 구할 수 있는 것 — 송·수전 전력, 상차각, 조상설비 용량, 개선 역률, 선로 손실·송전 효율. 구할 수 없는 것 — 과도극한전력, 코로나 손실.\n**함정 포인트**: '구할 수 없는 것' 두 가지(과도극한전력·코로나 손실)만 암기하면 즉답 가능."}, {"no": 8, "question": "화력 발전의 기본 열사이클인 랭킨 사이클에서 단열압축 과정이 행하여지는 곳은?", "choices": ["① 보일러", "② 터빈", "③ 복수기", "④ 급수펌프"], "answerIndex": 3, "solution": "랭킨 사이클: 보일러(등압가열) → 터빈(단열팽창) → 복수기(등압냉각) → 급수펌프(단열압축). 단열압축은 급수펌프에서 일어난다.", "timestampSec": 1071, "theory": "**개념**: 랭킨 사이클 4과정 — 보일러·과열기: 등압가열 / 터빈: 단열팽창 / 복수기: 등압냉각 / 급수펌프: 단열압축.\n**함정 포인트**: 터빈(단열팽창)과 급수펌프(단열압축)를 바꿔 묻는 변형이 잦다."}, {"no": 9, "question": "변압기 내부고장 검출을 위해 사용하는 계전기가 아닌 것은?", "choices": ["① 과전압 계전기", "② 비율차동 계전기", "③ 부흐홀츠 계전기", "④ 충격 압력 계전기"], "answerIndex": 0, "solution": "변압기 내부고장 보호용 계전기는 비율차동 계전기, 부흐홀츠 계전기, 충격압력 계전기 등이다. 과전압 계전기는 계통 전압 이상 검출용으로 내부고장 검출용이 아니다.", "timestampSec": 1301, "theory": "**개념**: 변압기 내부고장 보호 — 전기식: 비율차동(차동) 계전기 / 기계식: 부흐홀츠 계전기(가스·유류 검출, 콘서베이터 연결관에 설치), 충격압력 계전기, 유온계·유위계.\n**함정 포인트**: 과전류·과전압·지락 계전기는 내부고장 '전용' 검출 계전기가 아니다."}, {"no": 10, "question": "다중접지 3상 4선식 배전선로에서 고압측(1차측) 중성선과 저압측(2차측) 중성선을 전기적으로 연결하는 목적은?", "choices": ["① 저압측의 단락 사고를 검출하기 위함", "② 저압측의 접지 사고를 검출하기 위함", "③ 주상 변압기의 중성선측 부싱을 생략하기 위함", "④ 고저압 혼촉 시 수용가에 침입하는 상승전압을 억제하기 위함"], "answerIndex": 3, "solution": "고압·저압 중성선을 공통 접지(연결)하면 고저압 혼촉 사고 시 저압측 전위 상승이 억제되어 수용가 기기를 보호할 수 있다.", "timestampSec": 1341, "theory": "**개념**: 다중접지 방식은 중성선을 여러 곳에서 접지하여 접지저항을 낮춤 → 혼촉 시 저압측 대지전위 상승 억제.\n**함정 포인트**: 목적은 '혼촉 시 상승전압 억제'이지 사고 검출이나 부싱 생략이 아니다."}, {"no": 11, "question": "배전반에 접속되어 운전 중인 계기용변압기(PT) 및 변류기(CT)의 2차측 회로를 점검할 때 조치사항으로 옳은 것은?", "choices": ["① CT만 단락시킨다.", "② PT만 단락시킨다.", "③ CT와 PT 모두를 단락시킨다.", "④ CT와 PT 모두를 개방시킨다."], "answerIndex": 0, "solution": "CT 2차측을 개방하면 과전압이 유기되어 절연파괴 위험이 있으므로 반드시 단락 후 점검한다. PT 2차측은 단락하면 대전류로 소손되므로 개방 상태로 점검한다. 따라서 'CT만 단락'이 옳다.", "timestampSec": 1381, "theory": "**개념**: CT 2차 — 개방 금지(과전압·철손 증가·소손) → 점검 시 단락. PT 2차 — 단락 금지(과전류 소손) → 점검 시 개방.\n**함정 포인트**: CT=단락, PT=개방. 반대로 외우면 바로 틀리는 단골 문제."}, {"no": 12, "question": "연간 전력량이 $E$[kWh]이고, 연간 최대전력이 $W$[kW]인 연부하율은 몇 [%]인가?", "choices": ["① $\\dfrac{E}{W}\\times 100$", "② $\\dfrac{W}{E}\\times 100$", "③ $\\dfrac{8760\\,W}{E}\\times 100$", "④ $\\dfrac{E}{8760\\,W}\\times 100$"], "answerIndex": 3, "solution": "연부하율 $=\\dfrac{\\text{연간 평균전력}}{\\text{연간 최대전력}}\\times100=\\dfrac{E/8760}{W}\\times100=\\dfrac{E}{8760W}\\times100$[%] (1년 = 365×24 = 8760시간)", "timestampSec": 1451, "theory": "**핵심 공식**: 부하율 $=\\dfrac{\\text{평균전력}}{\\text{최대전력}}\\times100$, 평균전력 $=\\dfrac{\\text{사용전력량}}{\\text{시간}}$\n**개념**: 연간 기준이면 시간은 8760[h].\n**함정 포인트**: 분자·분모를 뒤집은 ③이 대표 오답. 8760이 분모(W쪽)에 붙는 형태가 정답."}, {"no": 13, "question": "수력 발전소에서 이용되는 서지탱크의 설치 목적이 아닌 것은?", "choices": ["① 흡출관을 보호하기 위함이다.", "② 부하의 변동 시 생기는 수격압을 경감시킨다.", "③ 유량을 조절한다.", "④ 수격압이 압력수로에 미치는 것을 방지한다."], "answerIndex": 0, "solution": "서지탱크(조압수조)는 압력수로와 수압관 사이에 설치되어 수격압 경감, 압력수로 보호, 유량 조절 역할을 한다. 흡출관 보호와는 무관하다.", "timestampSec": 1551, "theory": "**개념**: 조압수조(서지탱크) 목적 — 부하 급변 시 수격작용(수압 상승) 흡수·경감, 압력수로 보호, 유량 조정. 흡출관은 반동수차 출구~방수면 사이에서 낙차를 회복하는 설비로 서지탱크와 무관.\n**함정 포인트**: '흡출관'이 들어간 보기가 나오면 서지탱크 목적이 아님."}, {"no": 14, "question": "3상 단락고장을 대칭좌표법으로 해석을 할 경우 필요한 것은?", "choices": ["① 정상임피던스도", "② 정상임피던스도 및 역상임피던스도", "③ 정상임피던스도 및 영상임피던스도", "④ 역상임피던스도 및 영상임피던스도"], "answerIndex": 0, "solution": "3상 단락은 평형(대칭) 고장이므로 정상분만 존재한다. 따라서 정상임피던스도만 필요하다.", "timestampSec": 1741, "theory": "**개념**: 고장별 대칭분 — 3상 단락: 정상분만 / 선간 단락: 정상분+역상분 / 1선 지락: 정상분+역상분+영상분 모두.\n**함정 포인트**: '지락'이 들어가야 영상분이 필요하다. 3상 단락에 영상·역상을 고르게 하는 오답 유도."}, {"no": 15, "question": "전선에서 전류밀도가 도선의 중심으로 들어갈수록 작아지는 현상은?", "choices": ["① 근접효과", "② 표피효과", "③ 차폐효과", "④ 페란티효과"], "answerIndex": 1, "solution": "도체 중심일수록 쇄교 자속이 많아 유도 리액턴스가 커지므로 전류가 표면으로 몰리는 현상 = 표피효과.", "timestampSec": 1826, "theory": "**개념**: 표피효과는 주파수 $f$, 도전율 $\\sigma$, 투자율 $\\mu$, 전선 굵기가 클수록 심해진다. 침투깊이 $\\delta=\\sqrt{\\dfrac{2}{\\omega\\mu\\sigma}}$는 반대로 작아진다.\n**함정 포인트**: 페란티효과(무부하 시 수전단 전압 상승)와 이름 혼동 주의. 복도체 사용 시 표피효과 경감."}, {"no": 16, "question": " <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
