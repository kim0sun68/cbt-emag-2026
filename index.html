4a}, 0, 0\\right)$"], "answerIndex": 1, "solution": "접지 구도체와 점전하: 영상 점전하의 위치는 구도체 중심에서 점전하 방향으로 $\\dfrac{a^2}{d}[\\mathrm{m}]$ 떨어진 점이다.\n점전하가 $+x$축 위 $(d,0,0)$에 있으므로 영상전하 위치는 $\\left(\\dfrac{a^2}{d}, 0, 0\\right)$ (영상전하 크기는 $-\\dfrac{a}{d}Q$)", "timestampSec": 2811, "theory": "**핵심 공식**: 접지 구도체 영상전하 — 위치: 중심에서 $\\dfrac{a^2}{d}$, 크기: $Q' = -\\dfrac{a}{d}Q$\n**개념**: 구 표면이 0 전위가 되도록 구 내부의 점전하 방향 선상에 영상전하를 놓는다.\n**함정 포인트**: 위치와 크기 공식을 세트로 암기할 것. 점전하가 $+x$축에 있으면 영상전하도 $+x$축 위($a^2/d$)에 있다 — 부호(방향) 보기에 주의."}, {"no": 20, "question": "그림과 같이 비투자율이 $\\mu_{s1}$, $\\mu_{s2}$인 각각 다른 자성체를 접하여 놓고 $\\theta_1$을 입사각이라 하고, $\\theta_2$를 굴절각이라 한다. 경계면에 자하가 없을 경우 미소 폐곡면을 취하여 이곳에 출입하는 자속수를 구하면?", "choices": ["① $\\displaystyle\\int B \\cdot n\\, ds = 0$", "② $\\displaystyle\\int B \\cdot n\\, dl = 0$", "③ $\\displaystyle\\int B \\cdot n \\sin\\theta\\, ds = 0$", "④ $\\displaystyle\\int B \\cdot ds = 0$"], "answerIndex": 0, "solution": "자속의 연속성(자계의 가우스 법칙): 자하(자기 홀극)는 존재하지 않으므로 폐곡면으로 들어온 자속은 반드시 나간다.\n$\\displaystyle\\oint B \\cdot n\\, ds = 0$ (면적분이므로 $ds$, 법선 성분이므로 $n$이 필요)", "timestampSec": 2938, "theory": "**핵심 공식**: 자속의 연속성 $\\oint_s B \\cdot n\\, ds = 0$ (맥스웰 방정식 $\\mathrm{div}\\,B = 0$의 적분형)\n**개념**: 자하(자기 홀극)가 존재하지 않으므로 임의의 폐곡면에서 들어오는 자속과 나가는 자속의 합은 항상 0이다.\n**함정 포인트**: 면적분이므로 $ds$(면적 요소)와 법선 $n$이 모두 필요 — $dl$(선적분)이나 $\\sin\\theta$가 들어간 보기는 오답. 전계의 가우스 법칙($\\oint D\\cdot ds = Q$)과 대비해 기억."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
