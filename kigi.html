<script id="data" type="application/json">{"title": "2026 전기기사 전기기기 3회 기출 핵심풀이", "videoId": "DtyIW6x2Xms", "questions": [{"no": 1, "question": "직류기기의 철손에 관한 설명으로 틀린 것은?", "choices": ["① 성층철심을 사용하면 와전류손이 감소한다.", "② 철손에는 풍손과 와전류손 및 저항손이 있다.", "③ 철에 규소를 넣게 되면 히스테리시스손이 감소한다.", "④ 전기자 철심에는 철손을 작게하기 위해 규소강판을 사용한다."], "answerIndex": 1, "solution": "철손은 **히스테리시스손과 와전류손**으로 구성된다. 풍손(기계손)과 저항손(동손)은 철손이 아니므로 ②가 틀린 설명이다.\n규소 첨가 → 히스테리시스손 감소, 성층(적층) 철심 → 와전류손 감소.", "timestampSec": 53, "theory": "**핵심 분류**: 손실 = 무부하손(철손: 히스테리시스손+와전류손, 기계손: 풍손·마찰손) + 부하손(동손, 표유부하손)\n**개념**: 히스테리시스손 대책은 규소강판, 와전류손 대책은 성층철심.\n**함정 포인트**: 풍손·저항손을 철손에 슬쩍 끼워 넣는 보기가 단골. '철손 = 히+와' 두 가지뿐."}, {"no": 2, "question": "원통형 회전자를 가진 동기발전기는 부하각 $\\delta$가 몇 도일 때 최대 출력을 낼 수 있는가?", "choices": ["① 0°", "② 30°", "③ 60°", "④ 90°"], "answerIndex": 3, "solution": "원통형(비돌극형) 동기발전기의 출력 $P = \\dfrac{EV}{X_s}\\sin\\delta$이므로 $\\sin\\delta = 1$, 즉 **$\\delta = 90°$**에서 최대 출력이 된다.", "timestampSec": 118, "theory": "**핵심 공식**: 원통형 출력 $P = \\dfrac{EV}{X_s}\\sin\\delta$ → 최대 90° / 돌극형은 릴럭턴스 토크 때문에 최대 약 60°\n**개념**: 부하각(전기각)이 커질수록 출력이 증가하다가 한계를 넘으면 탈조한다.\n**함정 포인트**: 원통형 90° vs 돌극형 60° — 회전자 형태를 바꿔 출제된다."}, {"no": 3, "question": "동기발전기의 병렬운전에서 한쪽의 계자전류를 증대시켜 유기기전력을 크게 하면 어떻게 되는가?", "choices": ["① 무효 순환전류가 흐른다.", "② 두 발전기의 역률이 모두 낮아진다.", "③ 주파수가 변화되어 위상각이 달라진다.", "④ 속도 조정률이 변한다."], "answerIndex": 0, "solution": "계자전류 변화 → 기전력의 **크기 차이** 발생 → **무효 순환전류**가 흐른다.\n(기전력의 위상 차이면 유효 순환전류(동기화 전류), 크기 차이면 무효 순환전류)", "timestampSec": 190, "theory": "**핵심 규칙**: 병렬운전 시 기전력 크기 다름 → 무효 순환전류 / 위상 다름 → 유효(동기화) 전류 / 주파수 다름 → 난조\n**개념**: 병렬운전 조건은 기전력의 크기·위상·주파수·파형(·상회전) 일치.\n**함정 포인트**: '크기 차 = 무효', '위상 차 = 유효'가 뒤바뀐 보기가 단골."}, {"no": 4, "question": "2전동기설에 의하여 단상 유도전동기의 가상적 2개의 회전자 중 정방향에 회전하는 회전자 슬립이 $s$이면 역방향에 회전하는 가상적 회전자의 슬립은 어떻게 표시되는가?", "choices": ["① $1+s$", "② $1-s$", "③ $2-s$", "④ $3-s$"], "answerIndex": 2, "solution": "역방향 회전자계에 대한 슬립: $s' = \\dfrac{N_s-(-N)}{N_s} = \\dfrac{N_s+N}{N_s} = \\dfrac{N_s + N_s(1-s)}{N_s} = 2-s$", "timestampSec": 253, "theory": "**핵심 공식**: 역방향 회전자계 슬립 $s' = 2-s$\n**개념**: 2전동기설 — 단상 교번자계를 정·역 두 회전자계의 합으로 보고, 각 자계에 대한 슬립을 따로 계산한다.\n**함정 포인트**: $N = N_s(1-s)$ 대입 과정만 기억하면 유도 가능. 결과 '2-s'는 고정 암기."}, {"no": 5, "question": "단상 유도전동기의 기동 방법 중 기동 토크가 가장 큰 것은?", "choices": ["① 반발 기동형", "② 분상 기동형", "③ 셰이딩 코일형", "④ 콘덴서 분상 기동형"], "answerIndex": 0, "solution": "단상 유도전동기 기동토크 크기 순서: **반발 기동형 > 콘덴서 분상 기동형 > 분상 기동형 > 셰이딩 코일형**", "timestampSec": 404, "theory": "**핵심 순서**: 반발 기동 > 콘덴서 기동 > 분상 기동 > 셰이딩 코일 (기동토크 큰 순)\n**개념**: 단상은 자체 기동토크가 없어 보조 수단(반발, 콘덴서, 보조권선, 셰이딩)으로 기동한다.\n**함정 포인트**: '가장 작은 것'으로 뒤집어 물으면 셰이딩 코일형. 순서 전체를 암기."}, {"no": 6, "question": "3상 유도전동기의 2차 효율을 나타내는 것은? (단, 동기속도는 $N_s$, 회전수는 $N$이다.)", "choices": ["① $\\dfrac{N_s}{N}$", "② $\\dfrac{N}{N_s}$", "③ $\\dfrac{N_s-N}{N}$", "④ $\\dfrac{N_s-N}{N_s}$"], "answerIndex": 1, "solution": "2차 효율 $\\eta_2 = \\dfrac{P_0}{P_2} = 1-s = \\dfrac{N}{N_s}$\n($N = (1-s)N_s$이므로)", "timestampSec": 444, "theory": "**핵심 공식**: $\\eta_2 = 1-s = \\dfrac{N}{N_s}$, 슬립 $s = \\dfrac{N_s-N}{N_s}$\n**개념**: 2차 입력 $P_2$ : 기계적 출력 $P_0$ : 2차 동손 $P_{c2}$ = 1 : (1-s) : s 비례 관계에서 나온다.\n**함정 포인트**: ④($\\frac{N_s-N}{N_s}$)는 슬립 s의 식 — 2차 효율과 혼동시키는 대표 오답."}, {"no": 7, "question": "단상변압기를 병렬 운전하는 경우 부하전류의 분담에 관한 설명 중 옳은 것은?", "choices": ["① 누설리액턴스에 비례한다.", "② 누설임피던스에 비례한다.", "③ 누설임피던스에 반비례한다.", "④ 누설리액턴스의 제곱에 반비례한다."], "answerIndex": 2, "solution": "변압기 병렬운전 시 각 변압기의 부하전류 분담은 정격용량에는 비례하고, **누설임피던스(퍼센트 임피던스 %Z)에는 반비례**한다.", "timestampSec": 532, "theory": "**핵심 규칙**: 부하 분담 ∝ 정격용량, ∝ 1/%Z (누설임피던스에 반비례)\n**개념**: 병렬 연결이므로 같은 전압 강하를 만들며, 임피던스가 작은 쪽이 더 많은 전류를 분담한다.\n**함정 포인트**: '비례/반비례'와 '리액턴스/임피던스'를 조합한 4보기 중 정답은 '임피던스에 반비례'."}, {"no": 8, "question": "변압기 여자회로의 여자어드미턴스 $Y_0[\\mho]$를 구하면? (단, $I_0$는 여자전류, $I_i$는 철손전류, $I_\\phi$는 자화전류, $g_0$는 콘덕턴스, $V_1$은 인가전압이다.)", "choices": ["① $\\dfrac{I_0}{V_1}$", "② $\\dfrac{I_i}{V_1}$", "③ $\\dfrac{I_\\phi}{V_1}$", "④ $\\dfrac{g_0}{V_1}$"], "answerIndex": 0, "solution": "여자어드미턴스 $Y_0 = \\dfrac{I_0}{V_1}[\\mho]$ — 여자전류 전체를 인가전압으로 나눈 값이다.\n(콘덕턴스 $g_0 = I_i/V_1$: 철손전류 대응, 서셉턴스 $b_0 = I_\\phi/V_1$: 자화전류 대응)", "timestampSec": 626, "theory": "**핵심 공식**: $Y_0 = \\dfrac{I_0}{V_1}$, $g_0 = \\dfrac{I_i}{V_1}$, $b_0 = \\dfrac{I_\\phi}{V_1}$, $I_0 = \\sqrt{I_i^2 + I_\\phi^2}$\n**개념**: 여자전류는 철손전류(유효분)와 자화전류(무효분)의 벡터 합이다.\n**함정 포인트**: 철손전류/자화전류를 넣은 ②③이 오답 유도용. '어드미턴스는 전체 여자전류'로 기억."}, {"no": 9, "question": "단상 단권변압기 3대를 Y결선으로 해서 3상 전압 3000[V]를 300[V] 승압하여 3300[V]로 하고, 150[kVA]를 송전하려고 한다. 이 경우에 단상 단권변압기의 저전압측 전압, 승압전압 및 Y결선의 자가용량은 얼마인가?", "choices": ["① 3000[V], 300[V], 13.62[kVA]", "② 3000[V], 300[V], 4.54[kVA]", "③ 1732[V], 173.2[V], 13.62[kVA]", "④ 1732[V], 173.2[V], 4.54[kVA]"], "answerIndex": 2, "solution": "Y결선이므로 상전압은 선간전압의 $1/\\sqrt{3}$: 저전압측 $= 3000/\\sqrt{3} = 1732[\\mathrm{V}]$, 승압전압 $= 300/\\sqrt{3} = 173.2[\\mathrm{V}]$\n자기용량/부하용량 $= \\dfrac{V_h - V_l}{V_h} = \\dfrac{300}{3300}$ → 자기용량 $= 150 \\times \\dfrac{300}{3300} = 13.62[\\mathrm{kVA}]$", "timestampSec": 728, "theory": "**핵심 공식**: 단권변압기 Y결선 자기용량/부하용량 $= \\dfrac{V_h-V_l}{V_h}$, Y결선 상전압 $= V_{선간}/\\sqrt{3}$\n**개념**: 단권변압기는 공통 권선을 쓰므로 자기용량(고유용량)이 부하용량보다 작다 — 이것이 장점.\n**함정 포인트**: Y결선이면 전압에 $1/\\sqrt{3}$을 반드시 적용. 자기용량 비 공식은 결선(Y, V, △)마다 다르다."}, {"no": 10, "question": "변압기 권선의 상간 단락 사고를 검출하는 계전기는?", "choices": ["① 방향 단락 계전기", "② 과전류 계전기", "③ 비율 차동 계전기", "④ 과전압 계전기"], "answerIndex": 2, "solution": "**비율 차동 계전기**는 변압기 1차측과 2차측 전류의 차이를 비교하여 내부 권선의 단락 및 상간 단락 사고를 검출하는 대표적인 변압기 내부고장 보호 계전기다.", "timestampSec": 903, "theory": "**핵심 규정**: 변압기 내부고장 보호 — 비율 차동 계전기(전기적), 부흐홀츠 계전기(기계적, 유증기 검출)\n**개념**: 1·2차 전류의 벡터 차가 일정 비율을 넘으면 내부고장으로 판단해 동작한다.\n**함정 포인트**: 과전류 계전기는 외부 단락·과부하용, 부흐홀츠는 콘서베이터-본체 연결관에 설치 — 각 계전기의 역할 구분이 출제 포인트."}, {"no": 11, "question": "실리콘 정류 소자(SCR)와 관계 없는 것은?", "choices": ["① 교류 부하에서만 제어가 가능하다.", "② 아크가 생기지 않도록 열의 발생이 적다.", "③ 턴온 시키기 위해서 필요한 최소의 순 전류를 유지해야 한다.", "④ 게이트 신호를 인가할 때부터 도통할 때까지 시간이 짧다."], "answerIndex": 0, "solution": "SCR은 **교류뿐 아니라 직류 부하 제어에도 사용**할 수 있다(위상 제어, 초퍼 등). 따라서 ①이 관계 없는(틀린) 설명이다.\n②③④는 SCR의 특징으로 옳다 (아크 없음, 유지전류(latching 1.2", "④ 1.5"], "answerIndex": 1, "solution": "퍼센트 동기임피던스 $\\%Z_s = \\dfrac{P Z_s}{10 V^2} = \\dfrac{10000\\times2}{10\\times6^2} = 55.56[\\%]$ ($P$: kVA, $V$: kV)\n단락비 $K_s = \\dfrac{100}{\\%Z_s} = \\dfrac{100}{55.56} = 1.8$", "timestampSec": 1337, "theory": "**핵심 공식**: $K_s = \\dfrac{100}{\\%Z_s}$, $\\%Z_s = \\dfrac{P[\\mathrm{kVA}]\\cdot Z_s}{10\\,V^2[\\mathrm{kV}]}$\n**개념**: 단락비는 퍼센트 동기임피던스의 역수. 단락비가 크면 철기계(안정도 좋음, 전압변동 작음, 크고 비쌈).\n**함정 포인트**: $\\%Z$ 공식에서 $P$는 kVA, $V$는 kV 단위 — 단위 변환 실수가 최다 오답 원인."}, {"no": 16, "question": "직류 전동기의 전기자 전류가 10[A]일 때 5[N·m]의 토크가 발생했을 때, 이 전동기의 계자의 자속이 80[%]로 감소되고, 전기자 전류가 12[A]로 되면 토크는 약 몇 [N·m]인가?", "choices": ["① 5.3", "② 4.8", "③ 4.6", "④ 3.8"], "answerIndex": 1, "solution": "$T = k\\phi I_a$이므로 자속이 0.8배, 전류가 $12/10 = 1.2$배가 되면\n$T_2 = T_1 \\times 0.8 \\times 1.2 = 5 \\times 0.96 = 4.8[\\mathrm{N\\cdot m}]$", "timestampSec": 1463, "theory": "**핵심 공식**: 직류 전동기 토크 $T = k\\phi I_a$ (자속과 전기자 전류의 곱에 비례)\n**개념**: 비율 문제는 절대값 계산 없이 배수의 곱으로 처리하면 빠르다.\n**함정 포인트**: '80%로 감소' = 0.8배 (0.2배 아님). 직권 전동기라면 $T \\propto I_a^2$가 되는 점도 구분."}, {"no": 17, "question": "다음 중 동기 전동기에서 동기 와트로 표시되는 것은?", "choices": ["① 출력", "② 토크", "③ 1차 입력", "④ 동기 속도"], "answerIndex": 1, "solution": "동기와트는 동기속도에서의 전력량으로 **토크를 나타내는 단위**이며, 토크의 크기에 직접 비례하는 값이다. (동기와트 = $P_2$로 표현한 토크)", "timestampSec": 1555, "theory": "**핵심 개념**: 동기와트 $P_2 = \\omega_s T$ — 2차 입력을 동기각속도로 나누면 토크이므로, $P_2$ 자체를 토크의 척도로 쓴다.\n**함정 포인트**: '출력'·'입력'이 오답 유도용. '동기와트 = 토크' 한 줄 암기."}, {"no": 18, "question": "60[Hz], 6극의 3상 권선형 유도전동기가 있다. 이 전동기의 정격 부하 시 회전수는 1,140[rpm]이다. 이 전동기를 같은 공급전압에서 전부하 토크로 기동하기 위한 외부저항은 몇 $[\\Omega]$인가? (단, 회전자 권선은 Y결선이며 슬립링 간의 저항은 $0.1[\\Omega]$이다.)", "choices": ["① 0.5", "② 0.85", "③ 0.95", "④ 1"], "answerIndex": 2, "solution": "동기속도 $N_s = \\dfrac{120\\times60}{6} = 1200[\\mathrm{rpm}]$, 슬립 $s = \\dfrac{1200-1140}{1200} = 0.05$\n슬립링 간(선간) 저항이 0.1Ω이고 Y결선이므로 상당 $r_2 = 0.05[\\Omega]$\n비례추이: 전부하 토크로 기동($s=1$)하려면 $R = r_2\\left(\\dfrac{1}{s}-1\\right) = 0.05\\times(20-1) = 0.95[\\Omega]$", "timestampSec": 1632, "theory": "**핵심 공식**: 비례추이 외부저항 $R = r_2\\dfrac{1-s}{s}$ (전부하 토크 기동 기준)\n**개념**: 권선형 유도전동기는 2차 저항을 키우면 토크 곡선이 큰 슬립 쪽으로 이동한다(비례추이).\n**함정 포인트**: '슬립링 간(선간) 저항 0.1Ω' — Y결선 상당 저항은 절반인 0.05Ω. 이 함정을 놓치면 1.9Ω으로 오답."}, {"no": 19, "question": "반파정류회로와 전파정류회로를 비교한 설명으로 옳지 않은 것은?", "choices": ["① 3상 반파정류회로는 변압기 철심은 자기포화를 일으키기 쉽다.", "② 3상 반파정류회로는 3상 전파정류회로보다 출력 직류전압이 크다.", "③ 3상 반파정류회로는 3상 전파정류회로보다 리플 전압이 크다.", "④ 3상 반파정류회로는 3상 전파정류회로보다 회로 구성이 간단하다."], "answerIndex": 1, "solution": "3상 전파정류(6펄스)의 출력 직류전압($E_d = 1.35E$)이 3상 반파(3펄스, $E_d = 1.17E$)보다 **크다**. 따라서 ②가 옳지 않다.\n반파는 직류 성분에 의한 철심 자기포화가 생기기 쉽고, 리플은 크며, 회로는 간단하다.", "timestampSec": 1814, "theory": "**핵심 수치**: 직류전압 — 단상 반파 0.45E / 단상 전파 0.9E / 3상 반파 1.17E / 3상 전파 1.35E\n**개념**: 펄스 수가 많을수록(전파, 다상) 직류전압이 크고 리플이 작다.\n**함정 포인트**: '반파가 전압이 크다'는 항상 틀린 설명. 리플 주파수(맥동 주파수)도 함께 출제됨 — 3상 전파는 360Hz."}, {"no": 20, "question": "직류 분권발전기의 극수 4, 전기자 총 도체수 600으로 매분 600 회전할 때 유기기전력이 220[V]라 한다. 전기자 권선이 파권일 때 매극당 자속은 약 몇 [Wb]인가?", "choices": ["① 0.0154", "② 0.0183", "③ 0.0192", "④ 0.0199"], "answerIndex": 1, "solution": "유기기전력 $E = \\dfrac{pZ\\phi N}{60a}$, 파권이므로 $a = 2$\n$\\phi = \\dfrac{60aE}{pZN} = \\dfrac{60\\times2\\times220}{4\\times600\\times600} = 0.0183[\\mathrm{Wb}]$", "timestampSec": 1963, "theory": "**핵심 공식**: $E = \\dfrac{pZ\\phi N}{60a}$ — 파권 $a=2$, 중권 $a=p$\n**개념**: 유기기전력은 극수·도체수·자속·회전수에 비례하고 병렬회로수에 반비례.\n**함정 포인트**: 파권/중권에 따른 $a$ 값이 최대 함정. 중권($a=4$)으로 풀면 0.00915로 보기에 없는 값이 나온다."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
