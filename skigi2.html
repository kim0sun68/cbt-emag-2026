<script id="data" type="application/json">{"title": "2026 전기산업기사 전기기기 2회 기출 핵심풀이", "videoId": "ZdZYbCeZAhE", "questions": [{"no": 1, "question": "직류전동기의 워드레오나드 속도제어 방식으로 옳은 것은?", "choices": ["① 전압제어", "② 저항제어", "③ 계자제어", "④ 직병렬제어"], "answerIndex": 0, "solution": "직류전동기 속도 $N = k\\dfrac{V - I_a R_a}{\\phi}$에서 단자전압 $V$를 조정하는 방식이 전압제어이다.\n전압제어에는 워드레오나드 제어, 일그너 제어, 직병렬제어가 속하며, 워드레오나드 방식은 전압제어의 대표 방식이다.", "timestampSec": 78, "theory": "**핵심 공식**: $N = k\\dfrac{V - I_a R_a}{\\phi}$ — 속도제어 3방식은 전압·저항·계자 제어\n**개념**: 전압제어(워드레오나드·일그너·직병렬)는 광범위·효율 우수, 일그너는 플라이휠 부착형.\n**함정 포인트**: 워드레오나드↔일그너를 바꿔 묻거나, 워드레오나드를 계자제어로 두는 보기가 단골. '워드레오나드=전압제어' 고정 암기."}, {"no": 2, "question": "출력 15HP, 800rpm인 전동기의 토크는 약 몇 N·m인가?", "choices": ["① 100.1", "② 120.30", "③ 133.57", "④ 155"], "answerIndex": 2, "solution": "전동기 토크 $T = 0.975\\dfrac{P}{N} = 0.975 \\times \\dfrac{15 \\times 746}{800} = 13.64\\,[\\mathrm{kg\\cdot m}]$\n$T = 13.64 \\times 9.8 = 133.57\\,[\\mathrm{N\\cdot m}]$\n(1HP = 746W, 1kg·m = 9.8N·m)", "timestampSec": 132, "theory": "**핵심 공식**: $T = 0.975\\dfrac{P}{N}\\,[\\mathrm{kg\\cdot m}]$, N·m 환산은 ×9.8\n**개념**: 마력(HP) 출력은 반드시 746을 곱해 W로 환산한 뒤 대입한다.\n**함정 포인트**: kg·m 값(13.64)과 N·m 값(133.57)을 보기에 같이 배치하는 유형 — 단위 표기를 끝까지 확인할 것."}, {"no": 3, "question": "6극 파권의 전기자가 도체 250개로 되어 있다. 매분 1200 회전한다고 하면 유도 기전력을 600[V]로 하는 데 필요한 자속은 몇 [Wb]인가?", "choices": ["① 0.04", "② 0.16", "③ 0.25", "④ 0.31"], "answerIndex": 0, "solution": "유기기전력 $E = \\dfrac{pZ\\phi N}{60a}$에서 파권이므로 $a=2$.\n$\\phi = \\dfrac{60aE}{pZN} = \\dfrac{60 \\times 2 \\times 600}{6 \\times 250 \\times 1200} = 0.04\\,[\\mathrm{Wb}]$", "timestampSec": 236, "theory": "**핵심 공식**: $E = \\dfrac{pZ\\phi N}{60a}$ — 파권 $a=2$, 중권 $a=p$\n**개념**: 병렬회로수 $a$는 권선법으로 결정된다. 파권은 극수와 무관하게 항상 2.\n**함정 포인트**: 파권 문제에 $a=p=6$을 대입하면 0.013으로 오답 유도. '파권=2' 조건어를 놓치지 말 것."}, {"no": 4, "question": "직류 발전기의 전기자에 대한 설명 중 잘못된 것은?", "choices": ["① 전기자 권선은 대전류인 경우 평각동선을 사용한다.", "② 전기자 권선은 소전류인 경우 연동환선을 사용한다.", "③ 소형기에는 반폐 슬롯을 사용한다.", "④ 중형 및 대형기에서는 가지형 슬롯을 사용한다."], "answerIndex": 3, "solution": "중형·대형기에서는 가지형 슬롯이 아니라 **개방형(개구형) 슬롯**을 사용한다. 따라서 ④가 잘못된 설명이다.\n대전류→평각동선, 소전류→연동환선, 소형기→반폐 슬롯은 모두 옳다.", "timestampSec": 315, "theory": "**핵심 정리**: 소형기=반폐 슬롯, 중·대형기=개방형 슬롯 / 대전류=평각동선, 소전류=연동환선\n**개념**: 개방형 슬롯은 성형권(형권) 코일을 삽입하기 쉬워 대형기에 적합하다.\n**함정 포인트**: 슬롯 명칭(개방형↔반폐형↔가지형)을 바꿔치기하는 보기가 단골."}, {"no": 5, "question": "5000[kVA], 6000[V]의 3상 교류발전기에서 여자전류 200[A]에 상당하는 무부하 단자전압은 6000[V]이고 단락전류는 600[A]이다. 이 발전기의 단락비는?", "choices": ["① 0.25", "② 1", "③ 1.25", "④ 1.5"], "answerIndex": 2, "solution": "정격전류 $I_n = \\dfrac{P}{\\sqrt{3}\\,V} = \\dfrac{5000 \\times 10^3}{\\sqrt{3} \\times 6000} = 481.125\\,[\\mathrm{A}]$\n단락비 $K_s = \\dfrac{I_s}{I_n} = \\dfrac{600}{481.125} = 1.247 \\fallingdotseq 1.25$\n(영상에는 보기가 화면에 표시되지 않아 원 기출 보기로 구성함)", "timestampSec": 525, "theory": "**핵심 공식**: $K_s = \\dfrac{I_s}{I_n}$, 3상 정격전류 $I_n = \\dfrac{P}{\\sqrt{3}V}$\n**개념**: 정격전류가 주어지지 않으면 3상 출력식에서 직접 구해 대입한다.\n**함정 포인트**: $\\sqrt{3}$을 빼먹으면 833A가 되어 0.72 근처의 오답이 나온다. '3상'이라는 조건어 확인 필수."}, {"no": 6, "question": "동기 발전기의 병렬운전에서 일치하지 않아도 되는 것은?", "choices": ["① 기전력의 크기", "② 기전력의 위상", "③ 기전력의 임피던스", "④ 기전력의 주파수"], "answerIndex": 2, "solution": "동기발전기 병렬운전 조건은 기전력의 **크기·위상·주파수·파형**(3상은 상회전 방향 포함)이 같을 것이다.\n임피던스는 병렬운전 조건에 포함되지 않으므로 ③이 정답이다.", "timestampSec": 605, "theory": "**핵심 정리**: 병렬운전 조건 = 크기·위상·주파수·파형(+상회전) 일치\n**개념**: 조건 불일치 시 무효순환전류(크기), 유효순환전류·동기화전류(위상), 난조(주파수), 고조파 순환전류(파형) 발생.\n**함정 포인트**: '일치하지 않아도 되는 것'으로 임피던스·용량·전류를 끼워 넣는 유형 — 용량과 임피던스는 달라도 된다."}, {"no": 7, "question": "터빈 발전기의 출력 1350[kVA], 2극, 3600[rpm], 11[kV]일 때 역률 80%에서 전부하 효율이 96%라 하면 이때의 손실 전력[kW]은?", "choices": ["① 36.6", "② 45", "③ 56.6", "④ 65"], "answerIndex": 1, "solution": "발전기 효율 $\\eta = \\dfrac{P_o\\cos\\theta}{P_o\\cos\\theta + P_\\ell}$에서\n$P_\\ell = \\dfrac{P_o\\cos\\theta}{\\eta} - P_o\\cos\\theta = \\dfrac{1350 \\times 0.8}{0.96} - 1350 \\times 0.8 = 1125 - 1080 = 45\\,[\\mathrm{kW}]$\n(영상에는 보기가 화면에 표시되지 않아 원 기출 보기로 구성함)", "timestampSec": 668, "theory": "**핵심 공식**: $P_\\ell = \\dfrac{P_o\\cos\\theta}{\\eta} - P_o\\cos\\theta$ (출력 기준 효율)\n**개념**: kVA 출력은 역률을 곱해 유효전력 kW로 바꾼 뒤 효율식에 대입한다.\n**함정 포인트**: 역률 0.8을 곱하지 않고 1350을 그대로 쓰면 56.25로 오답 유도. 극수·회전수는 계산에 쓰이지 않는 미끼 조건."}, {"no": 8, "question": "3상 동기 발전기의 전기자 반작용은 부하의 성질에 따라 다르다. 잘못 설명한 것은?", "choices": ["① 전기자전류(I)가 무부하 유도기전력(E)보다 90°만큼 뒤질 때 감자작용이 발생한다.", "② 전기자전류(I)가 무부하 유도기전력(E)보다 90°만큼 앞설 때 증자작용이 발생한다.", "③ 전기자전류(I)가 무부하 유도기전력(E)보다 φ만큼 앞설 때 교차자화작용과 감자작용이 발생한다.", "④ 전기자전류(I)와 무부하 유도기전력(E)이 동상일 때 교차자화작용이 발생한다."], "answerIndex": 2, "solution": "발전기에서 전류가 기전력보다 φ만큼 **앞서면** 교차자화작용과 **증자작용**이 발생한다. 감자작용이라 한 ③이 잘못이다.\n뒤질 때(지상)는 감자, 앞설 때(진상)는 증자, 동상이면 교차자화작용이다.", "timestampSec": 745, "theory": "**핵심 정리**: 발전기 기준 — 동상: 교차자화 / 90° 지상: 감자 / 90° 진상: 증자 (전동기는 반대)\n**개념**: φ만큼 앞서는 일반 진상 부하는 교차자화+증자가 함께 나타난다.\n**함정 포인트**: 발전기↔전동기에서 감자·증자가 반대라는 점, 그리고 '앞설 때 감자'처럼 방향만 슬쩍 바꾼 보기."}, {"no": 9, "question": "3상 유도전동기의 제5차 고조파에 의한 기자력의 회전방향 및 회전 속도가 기본파 회전자계에 대한 관계는?", "choices": ["① 기본파와 같은 방향이고 5배의 속도로 회전한다.", "② 기본파와 역방향이고 5배의 속도로 회전한다.", "③ 기본파와 같은 방향이고 1/5배의 속도로 회전한다.", "④ 기본파와 역방향이고 1/5배의 속도로 회전한다."], "answerIndex": 3, "solution": "$h = 2nm - 1$(3상에서 5, 11차 등)인 고조파는 기본파와 **역방향**으로 회전하며, 속도는 기본파의 $1/h$배이다.\n따라서 제5차 고조파는 역방향, 1/5배 속도이다.", "timestampSec": 905, "theory": "**핵심 정리**: $h=2nm+1$(7·13차)=정방향, $h=2nm-1$(5·11차)=역방향, $h=3n$(3·9차)=회전자계 미발생 — 속도는 모두 $1/h$배\n**개념**: 5차는 역상분, 9차는 회전자계를 만들지 않는다는 두 유형이 시험의 단골.\n**함정 포인트**: 속도를 h배로 쓰거나 방향을 정방향으로 바꾼 보기 — '차수분의 1 속도, 5차는 역방향' 고정 암기."}, {"no": 10, "question": "단상 유도전동기의 기동 방법 중 기동 토크가 가장 큰 것은?", "choices": ["① 반발 기동형", "② 반발 유도형", "③ 콘덴서 분상형", "④ 분상 기동형"], "answerIndex": 0, "solution": "단상 유도전동기의 기동토크 크기 순서는 **반발 기동형 > 반발 유도형 > 콘덴서 기동형 > 분상 기동형 > 셰이딩 코일형**이다.\n따라서 기동토크가 가장 큰 것은 반발 기동형이다.", "timestampSec": 1015, "theory": "**핵심 순서**: 반발 기동 > 반발 유도 > 콘덴서 기동 > 분상 기동 > 셰이딩 코일\n**개념**: '반기콘분셰'로 암기. 셰이딩 코일형은 기동토크가 가장 작고 역회전 불가.\n**함정 포인트**: '가장 큰 것'과 '가장 작은 것'을 바꿔 묻는 유형 — 질문 끝까지 읽을 것."}, {"no": 11, "question": "3상 유도전동기의 동기속도는 주파수와 어떤 관계가 있는가?", "choices": ["① 비례한다.", "② 반비례한다.", "③ 자승에 비례한다.", "④ 자승에 반비례한다."], "answerIndex": 0, "solution": "동기속도 $N_s = \\dfrac{120f}{p}$이므로 동기속도는 주파수 $f$에 **비례**한다($N_s \\propto f$).", "timestampSec": 1053, "theory": "**핵심 공식**: $N_s = \\dfrac{120f}{p}$\n**개념**: 주파수에 비례, 극수에 반비례. 주파수 제어(VVVF)가 속도제어의 원리.\n**함정 포인트**: 극수와의 관계(반비례)를 주파수와 섞어 묻는 유형에 주의."}, {"no": 12, "question": "P[kW]인 직류 발전기를 3상 유도 전동기에 직결하여 운전할 때, 전동기 입력은? (단, 전동기의 효율은 $\\eta_m$, 직류발전기의 효율 $\\eta_g$, 역률은 $\\cos\\theta$)", "choices": ["① $\\dfrac{\\eta_g P}{\\eta_m \\cos\\theta}$", "② $\\dfrac{\\eta_m P}{\\eta_g \\cos\\theta}$", "③ $\\dfrac{P\\cos\\theta}{\\eta_m \\eta_g}$", "④ $\\dfrac{P}{\\eta_m \\eta_g \\cos\\theta}$"], "answerIndex": 3, "solution": "발전기 출력 $P$를 내려면 발전기 입력(=전동기 출력)은 $\\dfrac{P}{\\eta_g\\cos\\theta}$.\n전동기 입력 $P_{m,in} = \\dfrac{P_{m,out}}{\\eta_m} = \\dfrac{P}{\\eta_m\\eta_g\\cos\\theta}$ [kVA]", "timestampSec": 1093, "theory": "**핵심 공식**: 입력 = 출력/효율 — 직렬 연결이면 효율을 연쇄로 나눈다\n**개념**: 전동기 출력이 곧 발전기 입력이 되는 직결 구조. 최종 입력은 모든 효율과 역률로 나눈 값.\n**함정 포인트**: 효율을 곱할지 나눌지 혼동 유도(①·② 형태). '입력은 항상 출력보다 크다'로 검산하면 분모에 모두 놓여야 함."}, {"no": 13, "question": "변압기의 철심이 갖추어야 할 조건으로 틀린 것은?", "choices": ["① 투자율이 클 것", "② 전기 저항이 작을 것", "③ 성층 철심으로 할 것", "④ 히스테리시스손 계수가 작을 것"], "answerIndex": 1, "solution": "철심은 와전류손을 줄이기 위해 전기 저항이 **커야** 한다(전도도가 작아야 한다). 따라서 '작을 것'이라 한 ②가 틀린 설명이다.\n투자율 大, 성층 철심, 히스테리시스손 계수 小는 모두 올바른 구비조건이다.", "timestampSec": 1315, "theory": "**핵심 정리**: 철심 구비조건 — 투자율 클 것, 전기저항 클 것(전도도 작을 것), 성층 철심, 히스테리시스손 계수 작을 것\n**개념**: 저항이 작으면 와전류가 커져 와류손 증가 — 규소강판 성층으로 대응.\n**함정 포인트**: '저항이 작을 것'을 '전도도가 작을 것(옳음)'으로 바꿔 표현을 흔드는 유형 — 저항 大 = 전도도 小."}, {"no": 14, "question": "3상 전원을 이용하여 2상 전압을 얻고자 할 때 사용하는 결선 방법은?", "choices": ["① 환상 결선", "② Fork 결선", "③ Scott 결선", "④ 2중 3각 결선"], "answerIndex": 2, "solution": "3상→2상 변환 결선은 **스코트(Scott) 결선, 우드브리지 결선, 메이어 결선**이다. 보기 중에서는 Scott 결선이 해당한다.", "timestampSec": 1487, "theory": "**핵심 정리**: 3상→2상 = 스코트·우드브리지·메이어 / 3상→6상 = 환상·2중 성형·2중 3각·대각·포크\n**개념**: '우(드브리지)·스(코트)·메(이어)'로 암기. 스코트 결선은 T좌 변압기 사용.\n**함정 포인트**: 3상→6상 결선(포크·2중3각 등)을 2상 변환 보기에 섞는 유형 — 상수별 결선 그룹을 분리 암기."}, {"no": 15, "question": "변압기에 콘서베이터(Conservator)를 설치하는 목적은?", "choices": ["① 통풍장치", "② 코로나 방지", "③ 오일의 열화방지", "④ 오일의 강제순환"], "answerIndex": 2, "solution": "콘서베이터는 변압기 기름이 외부 공기·수분과 직접 접촉하는 것을 줄여 **절연유의 열화를 방지**하기 위해 설치한다.\n열화 방지책: 밀봉식(질소봉입), 브리더(흡착제) 설치, 콘서베이터 설치.", "timestampSec": 1525, "theory": "**핵심 정리**: 열화 방지 3대책 = 질소봉입(밀봉), 브리더, 콘서베이터\n**개념**: 호흡작용으로 유입되는 습기·산소가 절연유 열화의 원인 — 콘서베이터가 유면과 공기 접촉을 차단.\n**함정 포인트**: '냉각·강제순환' 목적으로 바꿔 놓은 보기 — 콘서베이터는 냉각장치가 아니라 열화 방지 설비."}, {"no": 16, "question": "변압기 여자 회로에 흐르는 전류의 벡터도에서 여자전류를 분해했을 때, 자속 φ와 같은 방향(동상)인 성분 C는 어떤 전류인가? (원본은 벡터도 그림 문제: V₁ 기준 90° 뒤진 축에 자속 φ와 성분 C, 빗변이 여자전류 B, V₁과 반대 방향 성분이 A)", "choices": ["① 1차 전류", "② 철손 전류", "③ 여자 전류", "④ 자화 전류"], "answerIndex": 3, "solution": "여자전류(B) = 철손전류(A) + 자화전류(C)로 분해되며, 자속 φ와 동상으로 **자속만을 만드는 성분 C가 자화전류**이다.\n원본 보기는 벡터도 그림이므로 지문에 텍스트로 서술하여 변환함.", "timestampSec": 1585, "theory": "**핵심 정리**: 여자전류 $I_0$ = 철손전류 $I_i$(전압과 동상) + 자화전류 $I_\\phi$(자속과 동상, 전압보다 90° 지상)\n**개념**: 자화전류는 자속을 만들고, 철손전류는 철손을 공급한다.\n**함정 포인트**: 자속과 동상=자화전류, 전압과 동상=철손전류 — 기준축을 바꿔 철손전류를 답으로 유도하는 그림 문제 주의."}, {"no": 17, "question": "단상 정류자 전동기에 보상권선을 사용하는 이유는?", "choices": ["① 정류개선", "② 기동토크 조절", "③ 속도제어", "④ 역률개선"], "answerIndex": 3, "solution": "단상 정류자 전동기(직권형)는 교류 사용으로 역률이 나빠지므로, 보상권선으로 전기자 반작용을 상쇄하여 **역률을 개선**한다.\n약계자·강전기자 구조로 커진 전기자 기자력을 보상하는 것이 목적이다.", "timestampSec": 1685, "theory": "**핵심 정리**: 단상 정류자 전동기 — 약계자·강전기자 채용(철손↓·역률↑), 보상권선(전기자 반작용 상쇄→역률 개선)\n**개념**: 직류기의 보상권선(정류·반작용 대책)과 달리 단상 정류자 전동기에서는 '역률개선'이 시험 키워드.\n**함정 포인트**: 직류기 감각으로 ① 정류개선을 고르게 유도 — 단상 정류자 전동기 문제면 답은 역률개선."}, {"no": 18, "question": "전압이나 전류의 제어가 불가능한 소자는?", "choices": ["① SCR", "② GTO", "③ TRIAC", "④ 다이오드"], "answerIndex": 3, "solution": "다이오드는 순방향 도통·역방향 저지의 특성만 가지며 게이트가 없어 도통 시점을 **제어할 수 없다**.\nSCR·GTO·TRIAC 등은 게이트 신호로 전류 흐름을 제어할 수 있다.\n(영상에는 보기가 화면에 표시되지 않아 원 기출 보기로 구성함. 영상 육성으로 '정답은 다이오드, 4번' 확인)", "timestampSec": 1752, "theory": "**핵심 정리**: 다이오드 = 게이트 없는 비제어 소자(순방향 도통·역방향 저지)\n**개념**: SCR(게이트 턴온), GTO(게이트 턴온·턴오프), TRIAC(양방향 제어) — 게이트 유무가 제어 가능성의 기준.\n**함정 포인트**: '제어가 불가능한'을 '자기소호가 불가능한(SCR)'과 혼동시키는 유형 — 질문 키워드를 정확히 구분."}, {"no": 19, "question": "전원용으로 사용되는 컨버터나 정류기의 사용 목적은?", "choices": ["① 직류 전원 전압을 교류 전압으로 변환시키기 위한 장치이다.", "② 직류 전원 전압을 크기가 다른 직류 전압으로 변환시키기 위한 장치이다.", "③ 교류 전원 전압을 직류 전압화시키기 위한 장치이다.", "④ 교류 전원 전압의 주파수를 변환시키기 위한 장치이다."], "answerIndex": 2, "solution": "컨버터(정류기)는 **교류를 직류로 변환**하는 장치이므로 ③이 정답이다.\n①은 인버터, ②는 초퍼, ④는 사이클로 컨버터에 대한 설명이다.", "timestampSec": 1807, "theory": "**핵심 정리**: 컨버터(정류기)=AC→DC, 인버터=DC→AC, 초퍼=DC→DC, 사이클로 컨버터=주파수 변환\n**개념**: 전력변환장치 4종의 입·출력 방향만 정확히 구분하면 되는 단골 문제.\n**함정 포인트**: 보기 문장이 길어 방향(교류→직류)을 뒤집어 놓는 유형 — '무엇을 무엇으로'만 뽑아 읽을 것."}, {"no": 20, "question": "다음 중 직류 초퍼(DC Chopper)의 전압 제어 방식 및 원리에 대한 설명으로 틀린 것은?", "choices": ["① 펄스폭 제어", "② 시비율 제어", "③ 펄스 파고 제어", "④ 펄스 주파수 제어"], "answerIndex": 2, "solution": "직류 초퍼는 펄스폭(PWM)·시비율(듀티비)·펄스 주파수(PFM) 제어로 평균 출력전압을 조절한다.\n펄스의 **파고(진폭)를 제어하는 방식은 초퍼의 제어 방식이 아니므로** ③이 틀린 설명이다.", "timestampSec": 1880, "theory": "**핵심 정리**: 초퍼 제어 = 펄스폭·시비율(듀티비)·펄스 주파수 제어 — 파고(진폭) 제어는 아님\n**개념**: 평균전압 $V_o = \\dfrac{T_{on}}{T}V$ — 온타임 비율(시비율)로 조절하는 것이 원리.\n**함정 포인트**: '펄스 파고'처럼 그럴듯한 용어를 끼워 넣는 유형 — 초퍼는 스위칭 시간 비율로만 제어한다."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
</html>
