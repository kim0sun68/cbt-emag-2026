ution": "변압기 2대로 3상 공급 → V결선.\n\n$P_V = \\sqrt{3}\\,P_1 = \\sqrt{3}\\times 10 \\approx 17.3$[kVA]", "timestampSec": 362, "theory": "**핵심 공식**: V결선 출력 $P_V = \\sqrt{3}\\,P_1$, 이용률 $\\dfrac{\\sqrt{3}}{2}=0.866$, 출력비 $\\dfrac{1}{\\sqrt{3}}=0.577$\n**개념**: 변압기 2대로 3상을 공급하는 방식이 V결선이며, 최대 출력은 1대 용량의 $\\sqrt{3}$배다.\n**함정 포인트**: 단순히 2대라고 $2P_1=20$(①)을 고르면 안 된다. $\\sqrt{2}\\times 10 = 14.1$(③)은 유인 보기."}, {"no": 4, "question": "비정현파 기전력 및 전류의 값이 $v = 100\\sin\\omega t - 50\\sin(3\\omega t + 30°) + 20\\sin(5\\omega t + 45°)$[V], $i = 20\\sin(\\omega t + 30°) + 10\\sin(3\\omega t - 30°) + 5\\cos 5\\omega t$[A]라면 전력 [W]은?", "choices": ["① 763.2", "② 776.4", "③ 705.8", "④ 725.6"], "answerIndex": 1, "solution": "같은 고조파끼리만 전력이 발생한다. $5\\cos 5\\omega t = 5\\sin(5\\omega t + 90°)$로 변환.\n\n기본파: $\\dfrac{1}{2}\\times 100\\times 20\\times\\cos(30°-0°) = 1000\\cos 30° = 866.0$\n3고조파: $\\dfrac{1}{2}\\times(-50)\\times 10\\times\\cos(30°-(-30°)) = -250\\cos 60° = -125$\n5고조파: $\\dfrac{1}{2}\\times 20\\times 5\\times\\cos(45°-90°) = 50\\cos 45° = 35.4$\n\n$P = 866.0 - 125 + 35.4 = 776.4$[W]", "timestampSec": 418, "theory": "**핵심 공식**: $P = \\sum\\dfrac{V_{mn}I_{mn}}{2}\\cos\\theta_n$ (최대값 사용 시), $\\cos\\omega t = \\sin(\\omega t + 90°)$\n**개념**: 비정현파 전력은 같은 차수 고조파 성분끼리의 전력 합. 위상차는 전압 위상 − 전류 위상.\n**함정 포인트**: cos항을 sin으로 바꿔 위상 $+90°$를 반영하지 않으면 틀린다. 진폭에 붙은 음(−) 부호도 그대로 계산에 넣어야 한다."}, {"no": 5, "question": "4단자 정수 $A$, $B$, $C$, $D$ 중에서 어드미턴스의 차원을 가진 정수는 어느 것인가?", "choices": ["① $A$", "② $B$", "③ $C$", "④ $D$"], "answerIndex": 2, "solution": "4단자 정수의 정의:\n$A = \\dfrac{V_1}{V_2}$ (전압비, 무차원)\n$B = \\dfrac{V_1}{I_2}$ (임피던스 차원)\n$C = \\dfrac{I_1}{V_2}$ (어드미턴스 차원)\n$D = \\dfrac{I_1}{I_2}$ (전류비, 무차원)\n\n따라서 어드미턴스 차원을 갖는 것은 $C$.", "timestampSec": 620, "theory": "**핵심 공식**: $V_1 = AV_2 + BI_2$, $I_1 = CV_2 + DI_2$\n**개념**: $A$·$D$는 무차원(전압비·전류비), $B$는 전류를 곱해 전압이 되므로 임피던스[Ω], $C$는 전압을 곱해 전류가 되므로 어드미턴스[℧] 차원이다.\n**함정 포인트**: 임피던스 차원을 묻는 변형 출제 시 답은 $B$. 어드미턴스=$C$, 임피던스=$B$를 짝으로 암기할 것."}, {"no": 6, "question": "$\\mathcal{L}[f(t)] = F(s)$일 때의 $\\lim_{t\\to\\infty} f(t)$는?", "choices": ["① $\\lim_{s\\to 0} F(s)$", "② $\\lim_{s\\to 0} sF(s)$", "③ $\\lim_{s\\to\\infty} F(s)$", "④ $\\lim_{s\\to\\infty} sF(s)$"], "answerIndex": 1, "solution": "최종값 정리(final value theorem):\n$\\lim_{t\\to\\infty} f(t) = \\lim_{s\\to 0} sF(s)$\n\n$t\\to\\infty$(최종값)일 때 $s\\to 0$, $t\\to 0$(초기값)일 때 $s\\to\\infty$로 서로 반대 방향이다.", "timestampSec": 645, "theory": "**핵심 공식**: 최종값 $\\lim_{t\\to\\infty}f(t)=\\lim_{s\\to 0}sF(s)$, 초기값 $\\lim_{t\\to 0}f(t)=\\lim_{s\\to\\infty}sF(s)$\n**개념**: 라플라스 변환의 최종값·초기값 정리. $t$와 $s$의 극한 방향이 서로 반대이고, 둘 다 $sF(s)$에 취한다.\n**함정 포인트**: $sF(s)$가 아닌 $F(s)$만 취한 ①·③이 유인 보기. 초기값 정리($s\\to\\infty$, ④)와 혼동하기 쉽다."}, {"no": 7, "question": "3상 회로의 선간 전압이 각각 $80$[V], $50$[V], $50$[V]일 때의 전압의 불평형률[%]은?", "choices": ["① 39.6", "② 57.3", "③ 73.6", "④ 86.7"], "answerIndex": 0, "solution": "선간 전압을 벡터로 배치: $V_a = 80 + j0$, $V_b = -40 - j30$, $V_c = -40 + j30$ (합이 0이 되는 배치)\n\n정상분: $V_1 = \\dfrac{1}{3}(V_a + aV_b + a^2V_c) = 57.3$[V]\n역상분: $V_2 = \\dfrac{1}{3}(V_a + a^2V_b + aV_c) = 22.7$[V]\n\n불평형률 $= \\dfrac{V_2}{V_1}\\times 100 = \\dfrac{22.7}{57.3}\\times 100 \\approx 39.6$[%]", "timestampSec": 695, "theory": "**핵심 공식**: 불평형률 $=\\dfrac{\\text{역상분 }V_2}{\\text{정상분 }V_1}\\times 100$[%], $V_1=\\frac{1}{3}(V_a+aV_b+a^2V_c)$, $V_2=\\frac{1}{3}(V_a+a^2V_b+aV_c)$\n**개념**: 80·50·50[V] 선간 전압 삼각형을 좌표로 놓고 대칭분으로 분해한다. $a = 1\\angle 120°$.\n**함정 포인트**: 정상분 $V_1=57.3$이 보기 ②에 그대로 놓여 있다. 불평형률은 비율이지 정상분 크기가 아니다."}, {"no": 8, "question": "그림과 같은 회로에서 $0.2[\\Omega]$의 저항에 흐르는 전류는 몇 [A]인가? (브리지 회로: $10$[V] 전원에 상단 좌 $6[\\Omega]$·우 $4[\\Omega]$, 하단 좌 $4[\\Omega]$·우 $6[\\Omega]$이 연결되고, 중앙 $a$–$b$ 사이에 $0.2[\\Omega]$이 연결되어 있다.)", "choices": ["① 0.1", "② 0.2", "③ 0.3", "④ 0.4"], "answerIndex": 3, "solution": "원본 보기는 회로 그림이며 텍스트로 서술함.\n\n좌우 대칭 구조이므로 $a$–$b$ 양측을 6과 4의 병렬 조합으로 정리하면 한쪽 합성 $\\dfrac{6\\times 4}{6+4} = 2.4[\\Omega]$, 좌우 합쳐 $4.8[\\Omega]$이 $0.2[\\Omega]$과 직렬이 된다.\n\n$I = \\dfrac{10}{4.8 + 0.2} = \\dfrac{10}{5} = 2$[A] … 전원측 환산 전류\n\n노드 방정식으로 풀면 $V_a = 5-0.04$, $V_b = 5+0.04$[V]로 $0.2[\\Omega]$ 양단 전압은 $0.08$[V], 흐르는 전류는 $\\dfrac{0.08}{0.2} = 0.4$[A]", "timestampSec": 975, "theory": "**핵심 공식**: 테브난 등가 $I = \\dfrac{V_{th}}{R_{th}+R}$, 브리지 대칭 변환\n**개념**: 6-4/4-6으로 엇갈린 불평형 브리지는 대칭성을 이용해 테브난 등가($V_{th}=2$[V], $R_{th}=4.8[\\Omega]$)로 바꾸면 $0.2[\\Omega]$의 전류가 바로 나온다.\n**함정 포인트**: 6·4가 직렬로 보이지만 실제 연결은 병렬이다. 평형 브리지(6-4/6-4)로 착각하면 전류가 0이라고 잘못 판단한다."}, {"no": 9, "question": "다음의 회로가 정저항 회로가 되기 위한 $L$[H]의 값은? (첫째 병렬쌍: $10[\\Omega]$과 $L$, 둘째 병렬쌍: $10[\\Omega]$과 $100[\\mu\\mathrm{F}]$ 커패시터가 직렬로 연결된 2단 회로)", "choices": ["① 1", "② 0.1", "③ 0.01", "④ 0.001"], "answerIndex": 2, "solution": "원본 보기는 회로 그림이며 텍스트로 서술함.\n\n정저항 조건: $R^2 = \\dfrac{L}{C}$\n\n$L = R^2 C = 10^2 \\times 100\\times 10^{-6} = 0.01$[H]", "timestampSec": 1460, "theory": "**핵심 공식**: 정저항 조건 $R^2 = \\dfrac{L}{C}$, 즉 $L = R^2C$, $C = \\dfrac{L}{R^2}$\n**개념**: R-L 병렬과 R-C 병렬을 조합한 회로가 주파수와 무관한 순저항이 되려면 두 리액턴스 곱이 $R^2$이 되어야 한다.\n**함정 포인트**: $\\mu$F의 $10^{-6}$ 지수를 빼먹으면 자릿수가 틀어져 ①·②를 고르게 된다. 같은 회로에서 $C$를 묻는 변형(16번)도 같은 식으로 푼다."}, {"no": 10, "question": "어느 소자에 전압 $e = 125\\sin 377t$[V]를 가했을 때 전류 $i = 50\\cos 377t$[A]가 흘렀다. 이 회로의 소자는 어떤 종류인가?", "choices": ["① 순저항", "② 용량 리액턴스", "③ 유도 리액턴스", "④ 저항과 유도 리액턴스"], "answerIndex": 1, "solution": "$i = 50\\cos 377t = 50\\sin(377t + 90°)$[A]\n\n전류가 전압보다 위상이 $90°$ 앞선다(진상) → 커패시터, 즉 용량 리액턴스이다.", "timestampSec": 1495, "theory": "**핵심 공식**: $\\cos\\omega t = \\sin(\\omega t + 90°)$, C회로: 전류 $90°$ 진상, L회로: 전류 $90°$ 지상\n**개념**: 전압·전류의 위상 관계로 소자를 판별한다. 전류가 앞서면 용량성(C), 뒤지면 유도성(L), 동상이면 순저항.\n**함정 포인트**: cos을 sin으로 환산하지 않고 위상차를 놓치면 순저항(①)으로 착각한다. '전류가 앞선다=C'를 반대로 외우면 ③을 고르게 된다."}, {"no": 11, "question": "그림과 같은 회로에서 스위치 $S$를 $t=0$에서 닫았을 때 $v_L(t)\\big|_{t=0} = 100$[V], $\\dfrac{di(t)}{dt}\\Big|_{t=0} = 400$[A/s]이다. $L$[H]의 값은? (전압원 $V$–스위치 $S$–저항 $R$–인덕터 $L$이 직렬로 연결된 회로)", "choices": ["① 0.75", "② 0.5", "③ 0.25", "④ 0.1"], "answerIndex": 2, "solution": "원본 보기는 회로 그림이며 텍스트로 서술함.\n\n$v_L = L\\dfrac{di}{dt}$\n\n$100 = L\\times 400$\n\n$L = \\dfrac{100}{400} = 0.25$[H]", "timestampSec": 1565, "theory": "**핵심 공식**: $v_L = L\\dfrac{di}{dt}$\n**개념**: 인덕터 단자전압과 전류 변화율의 관계식에 초기값을 대입하면 바로 $L$이 나온다. 과도현상 회로처럼 보여도 실은 정의식 한 줄 문제.\n**함정 포인트**: $\\dfrac{400}{100} = 4$처럼 분자·분모를 뒤집지 말 것. $R$ 값이 주어지지 않아도 풀 수 있는 문제인데 괜히 시정수 공식을 찾다 시간을 잃기 쉽다."}, {"no": 12, "question": "전류의 대칭분이 $I_0 = -2 + j4$[A], $I_1 = 6 - j5$[A], $I_2 = 8 + j10$[A]일 때, 3상 전류 중 $a$상 전류($I_a$)의 크기($|I_a|$)는 몇 [A]인가? (단, $I_0$은 영상분이고, $I_1$은 정상분이고, $I_2$는 역상분이다.)", "choices": ["① 9", "② 12", "③ 15", "④ 19"], "answerIndex": 2, "solution": "$I_a = I_0 + I_1 + I_2 = (-2+6+8) + j(4-5+10) = 12 + j9$[A]\n\n$|I_a| = \\sqrt{12^2 + 9^2} = \\sqrt{144+81} = \\sqrt{225} = 15$[A]", "timestampSec": 1645, "theory": "**핵심 공식**: $I_a = I_0 + I_1 + I_2$, $I_b = I_0 + a^2I_1 + aI_2$, $I_c = I_0 + aI_1 + a^2I_2$\n**개념**: $a$상 전류는 대칭분 세 개를 그대로 더하기만 하면 된다. $a$ 연산자가 붙는 것은 $b$·$c$상뿐이다.\n**함정 포인트**: $b$상·$c$상을 물으면 $a$, $a^2$을 곱해야 한다. 실수부·허수부를 따로 더한 뒤 크기 계산에서 $\\sqrt{12^2+9^2}$ (3-4-5 비율의 3배)임을 눈치채면 계산기 없이도 15."}, {"no": 13, "question": "기본파의 $30$[%]인 제3고조파와 기본파의 $20$[%]인 제5고조파를 포함하는 전압의 왜형률은 약 얼마인가?", "choices": ["① 0.21", "② 0.31", "③ 0.36", "④ 0.42"], "answerIndex": 2, "solution": "왜형률 $= \\dfrac{\\text{전 고조파의 실효값}}{\\text{기본파의 실효값}} = \\dfrac{\\sqrt{V_3^2 + V_5^2}}{V_1}$\n\n$= \\sqrt{0.3^2 + 0.2^2} = \\sqrt{0.09 + 0.04} = \\sqrt{0.13} \\approx 0.36$", "timestampSec": 1775, "theory": "**핵심 공식**: 왜형률(THD) $= \\dfrac{\\sqrt{V_3^2+V_5^2+\\cdots}}{V_1}$\n**개념**: 고조파 각각의 비율을 제곱합의 제곱근으로 합성한다. 기본파 대비 비율(0.3, 0.2)을 그대로 쓰면 된다.\n**함정 포인트**: 산술합 $0.3+0.2=0.5$가 아니다. 30%·20% 조합은 단골 수치로 답 0.36을 기억해 두면 검산이 빠르다."}, {"no": 14, "question": "$22$[kVA]의 부하가 $0.8$의 역률로 운전될 때 이 부하의 무효전력[kVar]은?", "choices": ["① 11.5", "② 12.3", "③ 13.2", "④ 14.5"], "answerIndex": 2, "solution": "$\\sin\\theta = \\sqrt{1-\\cos^2\\theta} = \\sqrt{1-0.8^2} = 0.6$\n\n$P_r = P_a\\sin\\theta = 22\\times 0.6 = 13.2$[kVar]", "timestampSec": 1875, "theory": "**핵심 공식**: $P_r = P_a\\sin\\theta$, $\\sin\\theta = \\sqrt{1-\\cos^2\\theta}$\n**개념**: 피상전력[kVA]에 $\\sin\\theta$를 곱하면 무효전력, $\\cos\\theta$를 곱하면 유효전력. 역률 0.8이면 무효율은 0.6(3-4-5 삼각형).\n**함정 포인트**: $22\\times 0.8 = 17.6$은 유효전력[kW]이다. 단위가 kVar이면 반드시 $\\sin\\theta$를 곱해야 한다."}, {"no": 15, "question": "3상 평형 부하의 전압이 $100$[V]이고, 전류가 $10$[A]이다. 이때 소비 전력[W]은? (단, 역률은 $0.8$이다.)", "choices": ["① 1385", "② 1732", "③ 2405", "④ 2800"], "answerIndex": 0, "solution": "$P = \\sqrt{3}\\,V_L I_L\\cos\\theta = \\sqrt{3}\\times 100\\times 10\\times 0.8 \\approx 1385$[W]", "timestampSec": 1905, "theory": "**핵심 공식**: 3상 전력 $P = \\sqrt{3}\\,V_L I_L\\cos\\theta$\n**개념**: 선간전압·선전류 기준의 3상 소비전력 공식. $\\sqrt{3}\\times 1000\\times 0.8 = 1385.6$.\n**함정 포인트**: 역률을 빼먹으면 $\\sqrt{3}\\times 1000 = 1732$(②)가 나온다. 보기에 역률 미적용 값이 반드시 함께 놓이는 유형."}, {"no": 16, "question": "다음과 같은 회로가 정저항 회로로 되기 위해서는 $C[\\mu\\mathrm{F}]$를 얼마로 하면 좋은가? (단, $R = 10[\\Omega]$, $L = 100$[mH]이다. 첫째 병렬쌍: $R$과 $L$, 둘째 병렬쌍: $R$과 $C$가 직렬로 연결된 2단 회로)", "choices": ["① $1[\\mu\\mathrm{F}]$", "② $10[\\mu\\mathrm{F}]$", "③ $100[\\mu\\mathrm{F}]$", "④ $1000[\\mu\\mathrm{F}]$"], "answerIndex": 3, "solution": "원본 보기는 회로 그림이며 텍스트로 서술함.\n\n정저항 조건: $R^2 = \\dfrac{L}{C}$\n\n$C = \\dfrac{L}{R^2} = \\dfrac{100\\times 10^{-3}}{10^2} = 10^{-3}$[F] $= 1000[\\mu\\mathrm{F}]$", "timestampSec": 1985, "theory": "**핵심 공식**: 정저항 조건 $R^2 = \\dfrac{L}{C}$ → $C = \\dfrac{L}{R^2}$\n**개념**: 9번과 동일한 정저항 회로에서 이번엔 $C$를 역산한다. mH의 $10^{-3}$을 반영하면 $10^{-3}$[F].\n**함정 포인트**: F→µF 환산($\\times 10^6$)에서 실수하면 ①~③으로 빠진다. 같은 시험에서 $L$을 묻는 문제와 짝으로 출제되는 단골 유형."}, {"no": 17, "question": "그림에서 $R = 5[\\Omega]$에서 흐르는 전류의 크기 [A]는? (왼쪽에 $2$[A] 전류원, 상단에 $2[\\Omega]$ 저항, 중앙에 $R=5[\\Omega]$, 오른쪽에 $10$[V] 전압원이 병렬로 연결된 회로)", "choices": ["① 1", "② 2", "③ 3", "④ 4"], "answerIndex": 1, "solution": "원본 보기는 회로 그림이며 텍스트로 서술함. 중첩의 원리로 푼다.\n\n① 전류원 $2$[A]만 있을 때(전압원 단락): 단락된 전압원이 $R$ 양단을 단락시키므로 $R$에 흐르는 전류는 $0$[A]\n\n② 전압원 $10$[V]만 있을 때(전류원 개방): $R$에는 $I_2 = \\dfrac{10}{5} = 2$[A]\n\n$I = 0 + 2 = 2$[A]", "timestampSec": 2045, "theory": "**핵심 공식**: 중첩의 원리 — 전압원은 단락, 전류원은 개방하여 각각 계산 후 합산\n**개념**: 이상 전압원이 $R$과 직접 병렬이면 $R$의 전압은 항상 $10$[V]로 고정되어 전류원의 영향이 0이 된다.\n**함정 포인트**: 전압원을 개방·전류원을 단락으로 반대로 처리하는 실수가 가장 흔하다. 전류원 2[A]를 그대로 더해 4[A](④)를 고르지 말 것."}, {"no": 18, "question": "그림과 같은 회로에서 $t=0$일 때 스위치 $K$를 닫을 때 과도 전류 $i(t)$는 어떻게 표시되는가? (전압원 $V$–인덕터 $L$–저항 $R_1$–저항 $R_2$가 직렬 연결되고, 스위치 $K$가 $R_2$와 병렬로 연결된 회로)", "choices": ["① $i(t)=\\dfrac{V}{R_1}\\left(1-\\dfrac{R_2}{R_1+R_2}e^{-\\frac{R_1}{L}t}\\right)$", "② $i(t)=\\dfrac{V}{R_1+R_2}\\left(1+\\dfrac{R_2}{R_1}e^{-\\frac{(R_1+R_2)}{L}t}\\right)$", "③ $i(t)=\\dfrac{V}{R_1}\\left(1+\\dfrac{R_2}{R_1}e^{-\\frac{R_2 t}{L}}\\right)$", "④ $i(t)=\\dfrac{R_1 V}{R_2+R_1}\\left(1+\\dfrac{R_1}{R_2+R_1}e^{-\\frac{(R_1+R_2)}{L}t}\\right)$"], "answerIndex": 0, "solution": "원본 보기는 회로 그림이며 텍스트로 서술함.\n\n일반식 $i(t) = i(\\infty) + [\\,i(0) - i(\\infty)\\,]e^{-t/\\tau}$ 사용.\n\n초기값(스위치 닫기 직전, $R_1+R_2$ 직렬): $i(0) = \\dfrac{V}{R_1+R_2}$\n최종값($K$ 닫힘 → $R_2$ 단락): $i(\\infty) = \\dfrac{V}{R_1}$\n시정수: $\\tau = \\dfrac{L}{R_1}$\n\n$i(t) = \\dfrac{V}{R_1} + \\left(\\dfrac{V}{R_1+R_2} - \\dfrac{V}{R_1}\\right)e^{-\\frac{R_1}{L}t} = \\dfrac{V}{R_1}\\left(1 - \\dfrac{R_2}{R_1+R_2}e^{-\\frac{R_1}{L}t}\\right)$", "timestampSec": 2180, "theory": "**핵심 공식**: $i(t) = i(\\infty) + [\\,i(0)-i(\\infty)\\,]e^{-t/\\tau}$, $\\tau = \\dfrac{L}{R_{동작 후}}$\n**개념**: 스위치로 회로 구조가 바뀌는 상위급 과도현상은 초기값·최종값·시정수 세 가지만 구해 일반식에 대입하면 미분방정식 없이 풀린다.\n**함정 포인트**: 시정수의 $R$은 스위치 동작 후 남은 저항($R_1$)이다. 보기에서 지수부가 $\\frac{R_1}{L}$인 것을 먼저 골라내면 ①만 남는다."}, {"no": 19, "question": "대칭 3상 Y부하에서 각 상의 임피던스가 $Z = 3 + j4[\\Omega]$이고, 부하전류가 $10$[A]일 때 피상전력[VA]은?", "choices": ["① 900[VA]", "② 1200[VA]", "③ 1500[VA]", "④ 2000[VA]"], "answerIndex": 2, "solution": "$|Z| = \\sqrt{3^2+4^2} = 5[\\Omega]$\n\n$P_a = 3I_p^2|Z| = 3\\times 10^2\\times 5 = 1500$[VA]", "timestampSec": 2655, "theory": "**핵심 공식**: $P_a = 3I_p^2|Z|$, $P = 3I_p^2R$, $P_r = 3I_p^2X$\n**개념**: 상전류와 임피던스가 주어진 3상 부하의 전력은 한 상의 $I^2Z$에 3을 곱한다. 3-4-5 직각삼각형으로 $|Z|=5$.\n**함정 포인트**: $R=3$을 쓰면 유효전력 900(①), $X=4$를 쓰면 무효전력 1200(②)이 나온다. '피상'은 반드시 $|Z|$."}, {"no": 20, "question": "$\\mathcal{L}^{-1}\\left[\\dfrac{1}{s^2+2s+5}\\right]$의 값은?", "choices": ["① $e^{-t}\\sin 2t$", "② $\\dfrac{1}{2}e^{-t}\\sin t$", "③ $\\dfrac{1}{2}e^{-t}\\sin 2t$", "④ $e^{-t}\\sin t$"], "answerIndex": 2, "solution": "완전제곱식으로 변형:\n$\\dfrac{1}{s^2+2s+5} = \\dfrac{1}{(s+1)^2+2^2} = \\dfrac{1}{2}\\cdot\\dfrac{2}{(s+1)^2+2^2}$\n\n$\\mathcal{L}^{-1}\\left[\\dfrac{\\omega}{s^2+\\omega^2}\\right] = \\sin\\omega t$이고 $s \\to s+1$ 이동은 $e^{-t}$를 곱하므로\n\n$\\mathcal{L}^{-1}\\left[\\dfrac{1}{s^2+2s+5}\\right] = \\dfrac{1}{2}e^{-t}\\sin 2t$", "timestampSec": 2735, "theory": "**핵심 공식**: $\\mathcal{L}[\\sin\\omega t] = \\dfrac{\\omega}{s^2+\\omega^2}$, 복소추이 $F(s+a) \\leftrightarrow e^{-at}f(t)$\n**개념**: 분모를 $(s+1)^2+2^2$로 완전제곱하면 $a=1$, $\\omega=2$가 보인다. 분자를 $\\omega=2$로 맞추기 위해 $\\frac{1}{2}$을 곱한다.\n**함정 포인트**: 분자 보정 $\\frac{1}{2}$을 빼먹으면 ①, $\\omega$를 $\\sqrt{5}$나 1로 잘못 읽으면 ②·④로 빠진다."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
</html>
