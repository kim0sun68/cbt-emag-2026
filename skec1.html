<script id="data" type="application/json">{"title": "2026 전기산업기사 전기설비기술기준 1회 기출 핵심풀이", "videoId": "tXLvNPR4LL0", "questions": [{"no": 1, "question": "특고압전로의 중성점을 접지할 때 접지선으로 연동선을 사용하는 경우의 최소공칭단면적은 몇 $\\mathrm{mm^2}$인가?", "choices": ["① 6.0", "② 10", "③ 16", "④ 25"], "answerIndex": 2, "solution": "접지선 굵기는 '6 아니면 16'만 기억하면 된다. **저압은 6$\\mathrm{mm^2}$, 고압·특고압은 16$\\mathrm{mm^2}$**. 특고압 전로의 중성점 접지이므로 **16$\\mathrm{mm^2}$**이 정답.", "timestampSec": 21, "theory": "**핵심 수치**: 접지도체(연동선) 굵기 — 저압 6$\\mathrm{mm^2}$ 이상 / 고압·특고압 16$\\mathrm{mm^2}$ 이상\n**암기 팁**: 접지+굵기 문제는 무조건 '6이냐 16이냐'. 저압만 6이고 나머지(고압·특고압)는 16.\n**함정 포인트**: '고압'이 나와도 16을 선택. 저압일 때만 6으로 답한다."}, {"no": 2, "question": "고압 가공전선으로 ACSR(강심알루미늄연선)을 사용할 때의 안전율은 얼마 이상이 되는 이도로 시설하여야 하는가?", "choices": ["① 1.38", "② 2.1", "③ 2.5", "④ 4.01"], "answerIndex": 2, "solution": "안전율은 작은 수부터 1.33 → 1.5 → 2.0 → 2.2 → 2.5 다섯 개로 정리한다. ACSR·알루미늄선 등 전선류(경동선 제외)와 지선(지지선)은 **2.5**. 보기의 나머지 숫자는 법에 없는 값이므로 정답은 **2.5**.", "timestampSec": 65, "theory": "**안전율 총정리(작은 순)**\n- 1.33: 이상 시 상정하중에 대한 철탑의 기초 안전율\n- 1.5: 안테나가 설치된 목주·철주·철근콘크리트주·철탑, 케이블트레이\n- 2.0: 지지물의 기초 안전율(특별 키워드 없을 때)\n- 2.2: 경동선·내열동합금선(동이 들어가면 2.2)\n- 2.5: 지선(지지선), ACSR·알루미늄선 등 기타 전선\n**함정 포인트**: 경동선(2.2)과 ACSR 등 기타 전선(2.5)을 구분할 것. 목주는 별도로 암기."}, {"no": 3, "question": "저압 옥내배선을 금속제 가요전선관 공사에 의해 시공하고자 한다. 이 금속제 가요전선관에 설치하는 전선으로 단선을 사용할 경우 그 단면적은 최대 몇 $\\mathrm{mm^2}$ 이하이어야 하는가? (단, 알루미늄선은 제외한다.)", "choices": ["① 2.5", "② 4", "③ 6", "④ 10"], "answerIndex": 3, "solution": "저압 옥내배선 공사의 공통사항: 전선은 연선이 원칙이지만 **단면적 10$\\mathrm{mm^2}$ 이하는 단선 사용 가능**. 가요전선관 공사도 이 공통사항이 적용되어 정답은 **10$\\mathrm{mm^2}$**.", "timestampSec": 250, "theory": "**저압 옥내배선 공사 공통사항 5가지**\n1. 전선은 연선 사용(단, 단선은 10$\\mathrm{mm^2}$ 이하 가능, 알루미늄은 16$\\mathrm{mm^2}$)\n2. 옥외용 비닐절연전선(OW)은 사용 불가\n3. 금속관·금속덕트·버스덕트 등 금속제는 접지할 것\n4. 관·덕트 내 전선의 접속점은 없도록 할 것(원칙)\n5. 덕트 끝부분은 막을 것\n**개념**: 공사방법별 문제가 나와도 이 공통사항으로 대부분 해결된다."}, {"no": 4, "question": "시가지에서 특고압 가공전선로의 지지물에 시설하는 통신선은 단선의 경우 지름 몇 $\\mathrm{mm}$ 이상의 절연전선 또는 광섬유 케이블이여야 하는가?", "choices": ["① 2", "② 5", "③ 4", "④ 2.5"], "answerIndex": 2, "solution": "통신선의 굵기는 4와 5 두 개만 공부한다. 키워드 **절연전선이면 4$\\mathrm{mm}$**. 시가지 특고압 지지물에 시설하는 첨가통신선은 절연전선이어야 하므로 정답은 **4$\\mathrm{mm}$**.", "timestampSec": 399, "theory": "**핵심 수치**: 통신선 굵기 — 절연전선 4$\\mathrm{mm}$ / (경동선 등) 5$\\mathrm{mm}$\n**개념**: 특고압 가공전선로가 시가지로 들어올 때 통신선 첨가는 원칙적으로 제한되며, 특별 보안장치(제1종·제2종 특고압 보안장치 등)를 갖추고 절연전선 또는 광섬유 케이블을 사용해야 한다.\n**암기 팁**: 통신선+굵기 문제 = 4 아니면 5, 절연전선이면 4."}, {"no": 5, "question": "수중조명등의 시설공사에서 절연변압기는 그 2차측 전로의 사용전압이 몇 $\\mathrm{V}$ 이하인 경우에는 1차 권선과 2차 권선사이에 금속제의 혼촉 방지판을 설치하여야 하는가?", "choices": ["① 150", "② 60", "③ 30", "④ 300"], "answerIndex": 2, "solution": "수중조명등(풀용)은 절연변압기를 사용하며, 2차측 사용전압 **30V 이하이면 혼촉방지판을 설치하고 접지**한다. 30V 초과이면 정격감도전류 30mA(0.03초) 누전차단기를 설치. 정답은 **30V**.", "timestampSec": 471, "theory": "**수중조명등 절연변압기 핵심**\n- 1차측 전압 400V 이하, 2차측 전압 150V 이하\n- 2차측 전로는 접지하지 않는다(비접지)\n- 사용전압 30V 이하: 1·2차 권선 사이 금속제 혼촉방지판 시설(+접지)\n- 사용전압 30V 초과: 지락 발생 시 자동차단하는 정격감도전류 30mA 누전차단기 시설\n**출제 트렌드**: '30V 기준'과 '2차측 비접지' 두 가지가 반복 출제된다."}, {"no": 6, "question": "수소냉각식 발전기 및 이에 부속하는 수소냉각장치에 대한 시설기준으로 틀린 것은?", "choices": ["① 발전기 내부의 수소의 온도를 계측하는 장치를 시설할 것", "② 발전기 내부의 수소의 순도가 70[%] 이하로 저하한 경우에 경보하는 장치를 시설할 것", "③ 발전기는 기밀구조의 것이고 또한 수소가 대기압에서 폭발하는 경우에 생기는 압력에 견디는 강도를 가지는 것일 것", "④ 발전기 내부의 수소의 압력을 계측하는 장치 및 압력이 현저히 변동한 경우에 이를 경보하는 장치를 시설할 것"], "answerIndex": 1, "solution": "수소 순도의 기준값은 **85%**다. 순도가 85% 이하로 저하하면 경보장치가 동작해야 하는데, 보기 ②는 70%로 잘못 제시했으므로 틀린 것은 **②**.", "timestampSec": 610, "theory": "**수소냉각식 발전기 시설기준**\n- 수소 순도가 **85% 이하**로 저하 시 경보하는 장치 시설\n- 수소의 온도·압력을 계측하는 장치 시설, 압력이 현저히 변동하면 경보\n- 발전기는 기밀구조, 수소가 대기압에서 폭발할 때의 압력에 견디는 강도\n**함정 포인트**: '밀도를 측정한다'는 규정은 없다 — 밀도가 나오면 틀린 보기. 숫자는 85% 하나만 기억."}, {"no": 7, "question": "터널 안의 전선로의 경우 저압 애자사용 공사에 의하여 시설하는 경우 설치 높이는 노면상 몇 $\\mathrm{m}$ 이상인가?", "choices": ["① 1.5", "② 2", "③ 2.5", "④ 3"], "answerIndex": 2, "solution": "터널 안 전선로에서 애자사용공사 시 노면상 높이는 **저압 2.5m, 고압 3m**. 저압이므로 정답은 **2.5m**.", "timestampSec": 699, "theory": "**터널 안 전선로 핵심**\n- 굵기: 저압 2.6$\\mathrm{mm}$, 고압 4$\\mathrm{mm}$(5가 아님에 주의)\n- 애자사용공사 시 노면상 높이: 저압 2.5m, 고압 3m\n- 케이블공사로 시설한 경우 지지점 간 거리: 케이블 2m(캡타이어케이블 1m)\n**함정 포인트**: 고압 전선 굵기를 5mm로 착각하기 쉽다. 터널 안은 4mm."}, {"no": 8, "question": "목주, A종 철주 및 A종 철근 콘크리트주를 사용할 수 없는 보안공사는?", "choices": ["① 제1종 특고압 보안공사", "② 제2종 특고압 보안공사", "③ 제3종 특고압 보안공사", "④ 고압 보안공사"], "answerIndex": 0, "solution": "목주·A종은 연약한 지지물이므로 가장 강화된 보안공사인 **제1종 특고압 보안공사**(35kV 초과, 제2차 접근상태)에는 사용할 수 없다. 정답은 **①**.", "timestampSec": 809, "theory": "**특고압 보안공사 구분**\n- 제1종: 35kV 초과 + 제2차 접근상태 — 가장 강화. 목주·A종 사용 불가(B종·철탑만 가능)\n- 제2종: 35kV 이하 + 제2차 접근상태 또는 건조물 키워드\n- 제3종: 제1차 접근상태\n**개념**: 제1종 특고압 보안공사는 특고압이 시가지에 들어올 때의 강화규정과 80% 이상 유사할 정도로 엄격하다.\n**출제 변형**: '제1종에서 사용 가능한 지지물은?'(B종·철탑) 형태로도 출제."}, {"no": 9, "question": "사용 전압이 400[V] 이하인 저압 가공전선은 절연전선을 사용하는 경우 지름 몇 $\\mathrm{mm}$ 이상의 경동선을 사용해야 하는가?", "choices": ["① 2.6", "② 3.6", "③ 4.0", "④ 1.6"], "answerIndex": 0, "solution": "저압 가공전선 굵기는 '2·3·4·5' 틀에 소수점 .6, .2를 붙여 정리한다. 400V 이하에서 **절연전선은 2.6$\\mathrm{mm}$**, 나전선은 3.2$\\mathrm{mm}$. 정답은 **2.6mm**.", "timestampSec": 892, "theory": "**저압 가공전선 굵기 정리**\n- 400V 이하: 절연전선 2.6$\\mathrm{mm}$ / 나전선 3.2$\\mathrm{mm}$\n- 400V 초과: 시가지 외 4.0$\\mathrm{mm}$ / 시가지 5.0$\\mathrm{mm}$\n**난이도 업**: 400V 이하에서 저압 보안공사가 되면 4.0$\\mathrm{mm}$ 이상으로 강화된다.\n**암기 팁**: 2-3-4-5 순서에 키워드 절연전선→나전선→시가지 외→시가지."}, {"no": 10, "question": "조상기의 보호장치로서 내부 고장 시에 자동적으로 전로로부터 차단되는 장치를 설치하여야 하는 조상기 용량은 몇 $\\mathrm{kVA}$ 이상인가?", "choices": ["① 5000", "② 7500", "③ 10000", "④ 15000"], "answerIndex": 3, "solution": "'조상기(조상설비) = 15,000'으로 암기한다. 조상기는 **15,000kVA 이상**이면 내부 고장 시 자동차단장치를 시설해야 한다. 정답은 **④**.", "timestampSec": 974, "theory": "**조상설비 보호장치 정리**\n- 조상기(회전기): 15,000kVA 이상 — 내부 고장 시 자동차단\n- 전력용 커패시터·분로리액터(정지기): 500~15,000kVA — 내부 고장·과전류 / 15,000kVA 이상 — 내부 고장·과전류·과전압\n**출제 변형**: '전력용 콘덴서 20,000kVA에 시설해야 하는 보호장치가 아닌 것' → 과전류·과전압·내부고장 3가지를 제외하고 선택.\n**암기 팁**: 조상기가 뜨면 무조건 15,000."}, {"no": 11, "question": "지중 공가설비로 사용하는 광섬유 케이블 및 동축케이블은 지름 몇 $\\mathrm{mm}$ 이하이어야 하는가?", "choices": ["① 16", "② 5", "③ 4", "④ 22"], "answerIndex": 3, "solution": "지중 공가설비는 땅속과 공중을 함께 지나는 설비이므로 튼튼한(굵은) 규격이 필요하다. 광섬유·동축케이블은 **지름 22$\\mathrm{mm}$ 이하**. 정답은 **④**.", "timestampSec": 1079, "theory": "**핵심 수치**: 지중 공가설비의 광섬유 케이블·동축케이블 지름 22$\\mathrm{mm}$ 이하\n**암기 팁**: 단순 암기 문제 — '지중 공가 = 22'. 보기 중 가장 굵은 값을 고른다."}, {"no": 12, "question": "다음 상에 따른 전선의 색상으로 알맞은 것은?", "choices": ["① N - 녹색", "② L3 - 회색", "③ L2 - 청색", "④ L1 - 적색"], "answerIndex": 1, "solution": "상별 색상은 L1 갈색, L2 흑색, L3 회색, N 청색('갈·흑·회·청'). 보기에서 맞는 것은 **② L3 - 회색**. (①N은 청색, ③L2는 흑색, ④L1은 갈색이어야 함)", "timestampSec": 1111, "theory": "**전선 식별 색상**\n- L1: 갈색 / L2: 흑색(검정) / L3: 회색 / N(중성선): 청색(파랑)\n- 보호도체(PE·접지도체): 녹황색(녹색-노란색)\n**암기 팁**: '갈흑회(파)' — 가르케파 조직원처럼 순서로 암기.\n**함정 포인트**: N을 녹색으로 내는 오답 보기가 자주 나온다. 녹황색은 보호도체 전용."}, {"no": 13, "question": "가반형의 용접전극을 사용하는 아크 용접장치의 시설에 대한 설명으로 잘못된 것은?", "choices": ["① 용접 변압기의 1차측 전로의 대지전압은 300[V] 이하일 것", "② 용접변압기의 1차측 전로에는 용접 변압기에 가까운 곳에 쉽게 개폐할 수 있는 개폐기를 시설할 것", "③ 전로는 용접 시 흐르는 전류를 안전하게 통할 수 없는 것일 것", "④ 용접 변압기는 절연 변압기 일 것"], "answerIndex": 2, "solution": "전로는 용접 시 흐르는 전류를 **안전하게 통전할 수 있어야** 한다. '통전할 수 없는 것일 것'이라고 한 **③**이 잘못된 설명. 법을 몰라도 문장만 천천히 읽으면 풀리는 문제.", "timestampSec": 1192, "theory": "**아크 용접장치 시설기준**\n- 용접변압기는 절연변압기일 것\n- 1차측 전로의 대지전압 300V 이하\n- 1차측 전로에 용접변압기 가까운 곳에 쉽게 개폐할 수 있는 개폐기 시설\n- 전로는 용접 시 흐르는 전류를 안전하게 통전할 수 있을 것\n**팁**: 상식적으로 말이 안 되는 보기('안전하게 통전할 수 없을 것')를 골라내는 유형."}, {"no": 14, "question": "전력계통에서 돌발적으로 발생하는 이상현상에 대비하여 대지와 계통을 연결하는 것으로, 중성점을 대지에 접속하는 것은 무엇인가?", "choices": ["① 피뢰시스템접지", "② 단독접지", "③ 계통접지", "④ 전동기접지"], "answerIndex": 2, "solution": "'계통을 대지와 연결'했다는 표현 그대로 **계통접지**다. Y결선의 중성점을 대지에 접속하는 방식(TN·TT 계통 등)이 계통접지에 해당. 정답은 **③**.", "timestampSec": 1250, "theory": "**접지의 구분**\n- 계통접지: 전력계통의 이상현상에 대비해 중성점(계통)을 대지에 접속 — TN, TT, IT 계통 분류의 기초\n- 보호접지: 감전보호를 위해 기기 노출도전부를 접지\n- 피뢰시스템접지: 뇌격전류를 대지로 방류\n**암기 팁**: 문제 문장에서 '계통을 연결' → 계통접지, '기기 외함' → 보호접지, '뇌·낙뢰' → 피뢰시스템접지."}, {"no": 15, "question": "과전류차단기로 저압전로 사용하는 주택용 배선차단기의 동작전류로 알맞은 것은?", "choices": ["① 1.05", "② 1.3", "③   q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
</html>
