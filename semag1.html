: ["① $\\dfrac{\\lambda}{\\varepsilon_0}$", "② $\\dfrac{\\lambda}{2\\pi\\varepsilon_0}$", "③ $\\dfrac{\\lambda}{\\pi a}$", "④ $\\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}$"], "answerIndex": 3, "solution": "원주(원통) 밖의 점($r>a$)에서는 원주 내 전하가 축에 집중된 무한장 직선전하와 같게 보인다.\n무한장 직선전하에 의한 전계의 세기는\n$E = \\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}[\\mathrm{V/m}]$", "timestampSec": 155, "theory": "**핵심 공식**: 무한장 직선전하(원통 외부)의 전계 $E = \\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}[\\mathrm{V/m}]$\n**개념**: 가우스 법칙에 의해 원통 외부에서는 내부 전하 전체가 축상의 선전하처럼 작용한다. 전계는 거리 $r$에 반비례한다.\n**함정 포인트**: 점전하의 $\\dfrac{1}{r^2}$ 반비례와 혼동하지 말 것. 직선전하는 $\\dfrac{1}{r}$에 반비례하며, 분모에 $4\\pi$가 아닌 $2\\pi$가 붙는다."}, {"no": 4, "question": "유전율이 서로 다른 두 종류의 경계면에 전속과 전기력선이 수직으로 도달할 때 다음 설명 중 옳지 않은 것은?", "choices": ["① 전계의 세기는 연속이다.", "② 전속밀도는 불변이다.", "③ 전속과 전기력선은 굴절하지 않는다.", "④ 전속선은 유전율이 큰 유전체 중으로 모이려는 성질이 있다."], "answerIndex": 0, "solution": "경계면에 수직 입사하는 경우 전속밀도의 법선성분은 연속($D_{1}=D_{2}$)이므로 전속밀도는 불변이고 굴절도 없다.\n그러나 전계는 $E = \\dfrac{D}{\\varepsilon}$이므로 유전율이 다르면 $E_1 \\neq E_2$가 되어 전계의 세기는 불연속이다.\n따라서 옳지 않은 것은 ①이다.\n전속선은 유전율이 큰 쪽으로, 전기력선은 유전율이 작은 쪽으로 모이는 성질이 있다.", "timestampSec": 235, "theory": "**핵심 공식**: 유전체 경계조건 $D_{1n}=D_{2n}$, $E_{1t}=E_{2t}$\n**개념**: 수직 입사 시 전속밀도는 연속(불변)이고 굴절하지 않지만, 전계의 세기는 $E=D/\\varepsilon$이라 유전율이 다르면 크기가 달라진다.\n**함정 포인트**: '전속선은 유전율이 큰 쪽으로, 전기력선은 유전율이 작은 쪽으로 모인다'는 성질을 반대로 바꿔 출제하는 경향이 있다."}, {"no": 5, "question": "전기저항 $R$과 정전용량 $C$, 고유저항 $\\rho$ 및 유전율 $\\varepsilon$ 사이의 관계로 옳은 것은?", "choices": ["① $RC = \\rho\\varepsilon$", "② $R\\rho = C\\varepsilon$", "③ $C = R\\rho\\varepsilon$", "④ $R = \\varepsilon\\rho C$"], "answerIndex": 0, "solution": "저항과 정전용량의 관계식은 $RC = \\rho\\varepsilon$이다.\n이로부터 접지저항 $R = \\dfrac{\\rho\\varepsilon}{C}[\\Omega]$, 누설전류 $I = \\dfrac{V}{R} = \\dfrac{CV}{\\rho\\varepsilon}[\\mathrm{A}]$를 유도할 수 있다.", "timestampSec": 380, "theory": "**핵심 공식**: $RC = \\rho\\varepsilon$, 접지저항 $R = \\dfrac{\\rho\\varepsilon}{C}[\\Omega]$, 누설전류 $I = \\dfrac{CV}{\\rho\\varepsilon}[\\mathrm{A}]$\n**개념**: 같은 전극 배치에서 저항과 정전용량의 곱은 매질 상수(고유저항×유전율)로 일정하다.\n**함정 포인트**: $RC=\\rho\\varepsilon$의 좌우 조합을 바꾼 보기(②③④)로 혼동을 유도한다. 누설전류·접지저항 계산형으로도 자주 출제된다."}, {"no": 6, "question": "그림과 같이 진공 중에 자극 면적이 $2[\\mathrm{cm^2}]$, 간격이 $0.1[\\mathrm{cm}]$인 자성체 내에서 포화자속밀도가 $2[\\mathrm{Wb/m^2}]$일 때 두 자극면 사이에 작용하는 힘의 크기는 약 몇 $[\\mathrm{N}]$인가?", "choices": ["① $53$", "② $106$", "③ $159$", "④ $318$"], "answerIndex": 3, "solution": "단위 면적당 자석의 흡인력 $f = \\dfrac{F}{S} = \\dfrac{B^2}{2\\mu_0}[\\mathrm{N/m^2}]$\n자석의 총 흡인력 $F = f\\cdot S = \\dfrac{B^2}{2\\mu_0}S = \\dfrac{2^2}{2\\times4\\pi\\times10^{-7}}\\times2\\times10^{-4} \\fallingdotseq 318[\\mathrm{N}]$\n(면적 $2[\\mathrm{cm^2}]=2\\times10^{-4}[\\mathrm{m^2}]$ 환산)\n원본 영상에는 N·S 자극이 간격 $d$를 두고 마주 보는 그림이 제시되며, 보기 숫자는 화면에 표시되지 않아 강의 육성 정답(318 N, 4번)을 기준으로 구성하였다.", "timestampSec": 457, "theory": "**핵심 공식**: 단위 면적당 흡인력 $f = \\dfrac{B^2}{2\\mu_0} = \\dfrac{1}{2}\\mu_0 H^2[\\mathrm{N/m^2}]$, 총 흡인력 $F = \\dfrac{B^2}{2\\mu_0}S[\\mathrm{N}]$\n**개념**: 자극면 사이 흡인력은 자속밀도 제곱에 비례한다. 전체 힘을 구할 때는 단위 면적당 힘에 면적 $S$를 곱한다.\n**함정 포인트**: $[\\mathrm{cm^2}]\\to[\\mathrm{m^2}]$ 환산 시 $10^{-4}$를 곱해야 한다. 단위 면적당 힘 $[\\mathrm{N/m^2}]$과 전체 힘 $[\\mathrm{N}]$ 중 무엇을 묻는지 확인할 것."}, {"no": 7, "question": "단면적 $4[\\mathrm{cm^2}]$의 철심에 $6\\times10^{-4}[\\mathrm{Wb}]$의 자속을 통하게 하려면 $2800[\\mathrm{AT/m}]$의 자계가 필요하다. 철심의 비투자율은 약 얼마인가?", "choices": ["① $12$", "② $43$", "③ $75$", "④ $426$"], "answerIndex": 3, "solution": "자속밀도 $B = \\dfrac{\\phi}{S} = \\mu_0\\mu_s H[\\mathrm{Wb/m^2}]$에서\n$\\mu_s = \\dfrac{\\phi}{\\mu_0 HS} = \\dfrac{6\\times10^{-4}}{4\\pi\\times10^{-7}\\times2800\\times4\\times10^{-4}} \\fallingdotseq 426$", "timestampSec": 592, "theory": "**핵심 공식**: $B = \\dfrac{\\phi}{S} = \\mu_0\\mu_s H$, 비투자율 $\\mu_s = \\dfrac{\\phi}{\\mu_0 HS}$\n**개념**: 자속밀도는 자속을 단면적으로 나눈 값이며, 동시에 투자율과 자계의 곱과 같다. 두 식을 연립해 비투자율을 구한다.\n**함정 포인트**: 단면적 $4[\\mathrm{cm^2}]=4\\times10^{-4}[\\mathrm{m^2}]$ 환산을 빠뜨리면 자릿수가 틀어진다. $\\mu_0=4\\pi\\times10^{-7}$을 정확히 대입할 것."}, {"no": 8, "question": "$\\phi = \\phi_m\\sin\\omega t[\\mathrm{Wb}]$의 정현파로 변화하는 자속이 권선수 $n$인 코일과 쇄교할 때의 유도기전력의 위상을 자속에 비교하면?", "choices": ["① $\\dfrac{\\pi}{2}$만큼 빠르다.", "② $\\dfrac{\\pi}{2}$만큼 늦다.", "③ $\\pi$만큼 빠르다.", "④ $\\pi$만큼 늦다."], "answerIndex": 1, "solution": "$e = -N\\dfrac{d\\phi}{dt} = -N\\dfrac{d}{dt}(\\phi_m\\sin\\omega t) = -\\omega N\\phi_m\\cos\\omega t$\n$= \\omega N\\phi_m\\sin\\left(\\omega t - \\dfrac{\\pi}{2}\\right)[\\mathrm{V}]$\n따라서 유도기전력은 자속보다 위상이 $\\dfrac{\\pi}{2}$만큼 늦다.", "timestampSec": 680, "theory": "**핵심 공식**: $e = -N\\dfrac{d\\phi}{dt} = \\omega N\\phi_m\\sin\\left(\\omega t-\\dfrac{\\pi}{2}\\right)[\\mathrm{V}]$\n**개념**: 정현파 자속을 미분하면 $\\cos$이 되고, 음의 부호까지 정리하면 $\\sin(\\omega t-\\pi/2)$ 형태가 되어 자속보다 $90°$ 뒤진다.\n**함정 포인트**: 미분으로 $\\cos$이 되었다고 '$\\pi/2$ 빠르다'로 착각하기 쉽다. 앞의 $(-)$ 부호까지 반영해야 '$\\pi/2$ 늦다'가 나온다."}, {"no": 9, "question": "환상 솔레노이드 코일에 흐르는 전류가 $2[\\mathrm{A}]$일 때, 자로의 자속이 $3\\times10^{-2}[\\mathrm{Wb}]$이었다고 한다. 코일의 권수를 500회라 하면, 이 코일의 자기 인덕턴스는 몇 $[\\mathrm{H}]$인가? (단, 코일의 전류와 자로의 자속과는 정비례한다고 한다.)", "choices": ["① $3.0$", "② $5.5$", "③ $6.0$", "④ $7.5$"], "answerIndex": 3, "solution": "자기 인덕턴스 $L = \\dfrac{N\\phi}{I}[\\mathrm{H}]$\n$L = \\dfrac{500\\times3\\times10^{-2}}{2} = 7.5[\\mathrm{H}]$", "timestampSec": 791, "theory": "**핵심 공식**: 자기 인덕턴스 $L = \\dfrac{N\\phi}{I}[\\mathrm{H}]$\n**개념**: 인덕턴스는 전류에 따라 쇄교자속($N\\phi$)이 발생하는 비율이다.\n**함정 포인트**: 권수 $N$을 곱하지 않고 $\\phi/I$만 계산하면 오답 보기에 걸린다. 쇄교자속 $N\\phi$ 기준임을 기억할 것."}, {"no": 10, "question": "정전용량이 $1[\\mu\\mathrm{F}]$, $2[\\mu\\mathrm{F}]$인 콘덴서에 각각 $2\\times10^{-4}[\\mathrm{C}]$ 및 $3\\times10^{-4}[\\mathrm{C}]$의 전하를 주고 극성을 같게 하여 병렬로 접속할 때 콘덴서에 축적된 에너지는 약 몇 $[\\mathrm{J}]$인가?", "choices": ["① $0.042$", "② $0.063$", "③ $0.084$", "④ $0.126$"], "answerIndex": 0, "solution": "병렬 접속 시 전하량은 합해지고 정전용량도 합해지므로\n$W = \\dfrac{Q_0^2}{2C_0} = \\dfrac{(Q_1+Q_2)^2}{2(C_1+C_2)} = \\dfrac{(2\\times10^{-4}+3\\times10^{-4})^2}{2\\times(1+2)\\times10^{-6}}$\n$= \\dfrac{(5\\times10^{-4})^2}{6\\times10^{-6}} \\fallingdotseq 0.042[\\mathrm{J}]$", "timestampSec": 846, "theory": "**핵심 공식**: 정전에너지 $W = \\dfrac{Q^2}{2C} = \\dfrac{1}{2}CV^2 = \\dfrac{1}{2}QV[\\mathrm{J}]$\n**개념**: 극성을 같게 병렬 접속하면 총 전하는 $Q_1+Q_2$, 합성 정전용량은 $C_1+C_2$가 되어 $W = \\dfrac{(Q_1+Q_2)^2}{2(C_1+C_2)}$로 계산한다.\n**함정 포인트**: 전하가 주어졌으므로 $\\dfrac{Q^2}{2C}$ 형태를 쓸 것. 극성을 반대로 접속하는 유형이면 $Q_1-Q_2$로 바뀐다."}, {"no": 11, "question": "비유전율이 4이고, 전계의 세기가 $20[\\mathrm{kV/m}]$인 유전체 내의 전속밀도는 약 몇 $[\\mu\\mathrm{C/m^2}]$인가?", "choices": ["① $0.71$", "② $1.42$", "③ $2.83$", "④ $5.28$"], "answerIndex": 0, "solution": "전속밀도 $D = \\varepsilon E = \\varepsilon_0\\varepsilon_s E[\\mathrm{C/m^2}]$\n$D = 8.855\\times10^{-12}\\times4\\times20\\times10^3 \\fallingdotseq 7.1\\times10^{-7}[\\mathrm{C/m^2}] = 0.71[\\mu\\mathrm{C/m^2}]$", "timestampSec": 946, "theory": "**핵심 공식**: 전속밀도 $D = \\varepsilon E = \\varepsilon_0\\varepsilon_s E[\\mathrm{C/m^2}]$\n**개념**: 전속밀도는 단위 면적당 전속이며, 유전체 내에서는 진공의 유전율에 비유전율을 곱해 계산한다.\n**함정 포인트**: $[\\mathrm{kV/m}]\\to[\\mathrm{V/m}]$($\\times10^3$) 환산과 최종 답의 $[\\mu\\mathrm{C/m^2}]$ 단위 환산($\\times10^6$)을 모두 챙겨야 한다. 비유전율 4를 빠뜨리면 다른 보기에 걸린다."}, {"no": 12, "question": "전류가 흐르는 도선을 자계 내에 놓으면 이 도선에 힘이 작용한다. 평등자계의 진공 중에 놓여 있는 직선 전류 도선이 받는 힘에 대한 설명으로 옳은 것은?", "choices": ["① 도선의 길이에 비례한다.", "② 전류의 세기에 반비례한다.", "③ 자계의 세기에 반비례한다.", "④ 전류와 자계 사이의 각에 대한 정현(sine)에 반비례한다."], "answerIndex": 0, "solution": "플레밍의 왼손 법칙에 의한 전자력은\n$F = BIl\\sin\\theta = \\mu_0 HIl\\sin\\theta = (I\\times B)l[\\mathrm{N}]$\n힘은 도선의 길이 $l$, 전류 $I$, 자계(자속밀도) $B$, $\\sin\\theta$ 모두에 비례하므로 옳은 것은 ①이다.", "timestampSec": 1058, "theory": "**핵심 공식**: 전자력 $F = BIl\\sin\\theta[\\mathrm{N}]$ (플레밍의 왼손 법칙)\n**개념**: 자계 내 전류 도선이 받는 힘은 자속밀도·전류·도선 길이·사잇각의 사인값 모두에 비례한다.\n**함정 포인트**: 보기에서 '비례'를 '반비례'로 바꿔 출제한다. $F=BIl\\sin\\theta$의 네 요소 전부 비례 관계임을 기억할 것."}, {"no": 13, "question": "다음 중 강자성체가 아닌 것은?", "choices": ["① 철", "② 니켈", "③ 코발트", "④ 백금"], "answerIndex": 3, "solution": "강자성체($\\mu_s \\gg 1$)의 종류는 철, 니켈, 코발트이다.\n백금은 상자성체이므로 강자성체가 아니다.", "timestampSec": 1105, "theory": "**핵심 개념**: 강자성체($\\mu_s \\gg 1$) = 철,       <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
</html>
