·흡수) / 톰슨(같은 금속 + 온도차 + 전류 → 열) / 핀치(액체 도체 수축)\n**개념**: '다른 금속 + 전류' 키워드면 펠티에.\n**함정 포인트**: 제벡과 펠티에는 서로 역현상 — 온도차가 원인이면 제벡, 전류가 원인이면 펠티에."}, {"no": 12, "question": "단면적 $S[\\mathrm{m^2}]$, 단위 길이에 대한 권수가 $n[\\mathrm{T/m}]$인 무한히 긴 솔레노이드의 단위 길이당 자기 인덕턴스 $[\\mathrm{H/m}]$를 구하면?", "choices": ["① $\\mu Sn$", "② $\\mu Sn^2$", "③ $\\mu S^2n^2$", "④ $\\mu S^2n$"], "answerIndex": 1, "solution": "무한장 솔레노이드의 단위 길이당 자기 인덕턴스\n$L = \\mu Sn^2 = \\mu\\pi a^2 n^2[\\mathrm{H/m}]$", "timestampSec": 1245, "theory": "**핵심 공식**: 무한장 솔레노이드 $L = \\mu S n^2[\\mathrm{H/m}]$ ($n$: 단위 길이당 권수)\n**개념**: 인덕턴스는 권수의 제곱에 비례한다 ($L \\propto N^2$).\n**함정 포인트**: $n$의 1제곱(①)이나 $S$의 제곱(③④) 보기에 주의 — '권수만 제곱'으로 기억."}, {"no": 13, "question": "정전계에서 도체에 정전하를 주었을 때의 설명으로 틀린 것은?", "choices": ["① 도체 표면에서 수직으로 전기력선이 출입한다.", "② 도체 외측의 표면에만 전하가 분포한다.", "③ 도체 내에 있는 공동면에도 전하가 골고루 분포한다.", "④ 도체 표면의 곡률 반지름이 작은 곳에 전하가 많이 분포한다."], "answerIndex": 2, "solution": "도체 내부(공동면 포함)에는 전하·전기력선·전계·정전에너지가 **존재하지 않는다**. 전하는 도체 외측 표면에만 분포하므로 ③이 틀린 설명이다.", "timestampSec": 1268, "theory": "**핵심 성질**: 대전 도체 — 전하는 표면에만 분포, 표면은 등전위면, 전기력선은 표면에 수직, 곡률이 클수록(뾰족할수록) 전하밀도 큼\n**개념**: 도체 내부 전계가 0이므로 내부·공동에는 전하가 있을 수 없다.\n**함정 포인트**: '곡률 반지름이 작다 = 뾰족하다 = 전하 많음' — 곡률과 곡률 반지름은 반비례 관계라는 표현에 주의."}, {"no": 14, "question": "유전율이 다른 두 유전체의 경계면에 작용하는 힘은? (단, 유전체의 경계면과 전계방향은 수직이다.)", "choices": ["① $\\dfrac{1}{2}(\\varepsilon_1-\\varepsilon_2)E^2$", "② $\\dfrac{1}{2}\\left(\\dfrac{1}{\\varepsilon_1}-\\dfrac{1}{\\varepsilon_2}\\right)D^2$", "③ $\\dfrac{1}{2}(\\varepsilon_2-\\varepsilon_1)E^2$", "④ $\\dfrac{1}{2}\\left(\\dfrac{1}{\\varepsilon_2}-\\dfrac{1}{\\varepsilon_1}\\right)D^2$"], "answerIndex": 3, "solution": "전계가 경계면에 **수직** 입사 시($\\varepsilon_1 > \\varepsilon_2$) 경계면에 작용하는 힘(맥스웰 응력)\n$f = \\dfrac{1}{2}\\left(\\dfrac{1}{\\varepsilon_2}-\\dfrac{1}{\\varepsilon_1}\\right)D^2[\\mathrm{N/m^2}]$ — $D$가 연속이므로 $D^2$ 형태로 표현한다.", "timestampSec": 1334, "theory": "**핵심 공식**: 수직 입사 $f = \\dfrac{1}{2}\\left(\\dfrac{1}{\\varepsilon_2}-\\dfrac{1}{\\varepsilon_1}\\right)D^2$ / 수평 입사 $f = \\dfrac{1}{2}(\\varepsilon_1-\\varepsilon_2)E^2$\n**개념**: 수직이면 $D$ 연속이라 $D^2$식, 수평이면 $E$ 연속이라 $E^2$식을 쓴다. 힘은 유전율 큰 쪽 → 작은 쪽으로 작용.\n**함정 포인트**: '수직 = D식, 수평 = E식' 짝을 바꾼 보기가 항상 출제된다."}, {"no": 15, "question": "공기 중에 $0.3[\\mathrm{Wb/m^2}]$인 평등자계 내에 $5[\\mathrm{A}]$의 전류가 흐르고 있는 길이 $2[\\mathrm{m}]$인 직선도체를 자계의 방향에 대하여 $60°$의 각도로 놓았을 때 이 도체가 받는 힘은 약 몇 $[\\mathrm{N}]$인가?", "choices": ["① 2.6", "② 3.5", "③ 4.7", "④ 5.6"], "answerIndex": 0, "solution": "플레밍의 왼손 법칙에 의한 전자력\n$F = BIl\\sin\\theta = 0.3\\times5\\times2\\times\\sin60° = 2.6[\\mathrm{N}]$", "timestampSec": 1449, "theory": "**핵심 공식**: 전자력 $F = BIl\\sin\\theta[\\mathrm{N}]$ (플레밍의 왼손 법칙)\n**개념**: 자계 내 전류 도체가 받는 힘. 전동기의 원리다.\n**함정 포인트**: $\\sin60° = \\frac{\\sqrt{3}}{2} \\approx 0.866$. $\\cos60° = 0.5$로 잘못 대입하면 1.5N으로 오답."}, {"no": 16, "question": "$0.2[\\mu\\mathrm{F}]$인 평행판 공기 콘덴서가 있다. 전극 간에 그 간격의 절반 두께의 유리판을 넣었다면 콘덴서의 용량은 약 몇 $[\\mu\\mathrm{F}]$인가? (단, 유리의 비유전율은 10이다.)", "choices": ["① 0.26", "② 0.36", "③ 0.46", "④ 0.56"], "answerIndex": 1, "solution": "판 간격의 절반만 유전체 삽입 시 (직렬 합성)\n$C = C_0\\times\\dfrac{2\\varepsilon_s}{1+\\varepsilon_s} = 0.2\\times\\dfrac{2\\times10}{1+10} = 0.36[\\mu\\mathrm{F}]$", "timestampSec": 1574, "theory": "**핵심 공식**: 간격 절반 유전체 삽입(직렬) $C = \\dfrac{2\\varepsilon_s}{1+\\varepsilon_s}C_0$ / 면적 절반 삽입(병렬) $C = \\dfrac{1+\\varepsilon_s}{2}C_0$\n**개념**: 극판 간격 방향 분할은 콘덴서 직렬, 면적 방향 분할은 병렬로 계산한다.\n**함정 포인트**: '간격의 절반'(직렬)과 '면적의 절반'(병렬) 공식을 반드시 구분."}, {"no": 17, "question": "공극(air gap)이 $\\delta[\\mathrm{m}]$인 강자성체로 된 환상 영구자석에서 성립하는 식은? (단, $l[\\mathrm{m}]$는 영구자석의 길이이며 $l \\gg \\delta$이고, 자속밀도와 자계의 세기를 각각 $B[\\mathrm{Wb/m^2}]$, $H[\\mathrm{AT/m}]$라 한다.)", "choices": ["① $\\dfrac{B}{H} = \\dfrac{\\delta\\mu_0}{l}$", "② $\\dfrac{B}{H} = \\dfrac{l\\mu_0}{\\delta}$", "③ $\\dfrac{B}{H} = -\\dfrac{\\delta\\mu_0}{l}$", "④ $\\dfrac{B}{H} = -\\dfrac{l\\mu_0}{\\delta}$"], "answerIndex": 3, "solution": "영구자석(기자력 없음)의 자기회로: $\\dfrac{l}{\\mu S} + \\dfrac{\\delta}{\\mu_0 S} = 0$ (암페어 주회적분 = 0)\n$\\dfrac{l}{\\mu} = -\\dfrac{\\delta}{\\mu_0}$ → $\\mu = -\\dfrac{l\\mu_0}{\\delta}$, $B = \\mu H$이므로 $\\dfrac{B}{H} = -\\dfrac{l\\mu_0}{\\delta}$", "timestampSec": 1610, "theory": "**핵심 공식**: 영구자석 감자 상태 $\\dfrac{B}{H} = -\\dfrac{l\\mu_0}{\\delta}$ (음수 — 감자곡선 상 동작)\n**개념**: 외부 기자력이 없으므로 $Hl + H_0\\delta = 0$에서 철심 내부 $H$와 공극 자계는 부호가 반대다.\n**함정 포인트**: 부호(-)가 붙는 이유가 핵심 — 양수인 ②를 고르기 쉽다. $l$과 $\\delta$의 위치도 확인."}, {"no": 18, "question": "다음 중 폐회로에 유도되는 유도기전력에 관한 설명 중 가장 알맞은 것은?", "choices": ["① 렌츠의 법칙은 유도기전력의 크기를 결정하는 법칙이다.", "② 자계가 일정한 공간 내에서 폐회로가 운동하여도 유도기전력이 유도된다.", "③ 유도기전력은 권선수의 제곱에 비례한다.", "④ 전계가 일정한 공간 내에서 폐회로가 운동하여도 유도기전력이 유도된다."], "answerIndex": 1, "solution": "자계 내에서 폐회로가 운동하면 도체가 자속을 끊으므로 유도기전력이 발생할 수 있다(②).\n(① 렌츠의 법칙은 유도기전력의 '방향'을 결정 — 크기는 패러데이 법칙, ③ $e = -N\\frac{d\\phi}{dt}$로 권선수의 1제곱에 비례, ④ 전계는 유도기전력과 무관)", "timestampSec": 1900, "theory": "**핵심 법칙**: 패러데이(크기 $e = -N\\frac{d\\phi}{dt}$) + 렌츠(방향: 자속 변화를 방해)\n**개념**: 유도기전력의 원인은 자속의 시간적 변화 또는 도체의 자속 끊기 운동이다.\n**함정 포인트**: '렌츠 = 방향, 패러데이 = 크기' 역할 바꿔치기와 '권선수 제곱 비례'(1제곱이 맞음)가 단골 오답."}, {"no": 19, "question": "반지름이 $1[\\mathrm{m}]$인 구의 중심으로부터 $5[\\mathrm{m}]$ 떨어진 지점의 전위가 $2[\\mathrm{V}]$일 때 구도체의 공간전하밀도 $[\\mathrm{C/m^3}]$는?", "choices": ["① $\\dfrac{\\varepsilon_0}{15}$", "② $\\dfrac{\\varepsilon_0}{30}$", "③ $15\\varepsilon_0$", "④ $30\\varepsilon_0$"], "answerIndex": 3, "solution": "구도체 외부 전위 $V = \\dfrac{Q}{4\\pi\\varepsilon_0 r} = \\dfrac{\\rho_v\\cdot\\frac{4}{3}\\pi a^3}{4\\pi\\varepsilon_0 r} = \\dfrac{\\rho_v a^3}{3\\varepsilon_0 r}[\\mathrm{V}]$\n$\\rho_v = \\dfrac{3\\varepsilon_0 r V}{a^3} = \\dfrac{3\\times\\varepsilon_0\\times5\\times2}{1^3} = 30\\varepsilon_0[\\mathrm{C/m^3}]$", "timestampSec": 2020, "theory": "**핵심 공식**: 체적전하 구의 외부 전위 $V = \\dfrac{\\rho_v a^3}{3\\varepsilon_0 r}$ ($Q = \\rho_v\\cdot\\frac{4}{3}\\pi a^3$ 대입 결과)\n**개념**: 공간(체적)전하밀도 문제는 전체 전하 $Q$를 부피로 표현해 역산한다.\n**함정 포인트**: $4\\pi$가 약분되어 분모에 $3\\varepsilon_0 r$만 남는 형태를 기억하면 빠르다."}, {"no": 20, "question": "한 변의 길이가 $a[\\mathrm{m}]$인 정삼각형 회로에 전류 $I[\\mathrm{A}]$가 흐르고 있을 때 정삼각형 중심에서의 자계의 세기 $[\\mathrm{AT/m}]$는?", "choices": ["① $\\dfrac{9I}{2\\pi a}$", "② $\\dfrac{\\sqrt{3}I}{\\pi a}$", "③ $\\dfrac{\\sqrt{2}I}{2\\pi a}$", "④ $\\dfrac{2\\sqrt{2}I}{\\pi a}$"], "answerIndex": 0, "solution": "정삼각형 중심의 자계 $H = \\dfrac{9I}{2\\pi a}[\\mathrm{AT/m}]$ ($a$: 한 변의 길이)", "timestampSec": 2227, "theory": "**핵심 공식(정다각형 중심 자계)**: 정삼각형 $\\dfrac{9I}{2\\pi l}$ / 정사각형 $\\dfrac{2\\sqrt{2}I}{\\pi l}$ / 정육각형 $\\dfrac{\\sqrt{3}I}{\\pi l}$ ($l$: 한 변)\n**개념**: 유한 직선 도체 자계를 변의 수만큼 합성한 결과다.\n**함정 포인트**: 세 공식이 보기로 함께 나온다 — 도형과 공식의 짝을 정확히 암기할 것."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
