<script id="data" type="application/json">{"title": "2026 전기산업기사 전력공학 2회 기출 핵심풀이", "videoId": "3MOn2PkcCLA", "questions": [{"no": 1, "question": "가공전선을 단도체식으로 하는 것보다 같은 단면적의 복도체식으로 하였을 경우에 대한 내용으로 틀린 것은?", "choices": ["① 전선의 인덕턴스가 감소된다.", "② 전선의 정전용량이 감소된다.", "③ 코로나 발생률이 적어진다.", "④ 송전용량이 증가한다."], "answerIndex": 1, "solution": "복도체를 사용하면 등가 반지름이 커져 인덕턴스 $L$은 감소하고 정전용량 $C$는 증가한다.\n따라서 \"정전용량이 감소된다\"는 설명이 틀렸다.\n그 밖에 코로나 방지, 전위경도 감소, 임계전압 상승, 송전용량 증가의 장점이 있다.", "timestampSec": 80, "theory": "**핵심**: 복도체 — $L$ 감소, $C$ 증가, 리액턴스 감소, 송전용량 증가, 코로나 방지(임계전압 $E_0$ 상승, 전위경도 감소)\n**개념**: 등가 반지름이 커지는 효과 때문에 단도체 대비 $L\\downarrow$, $C\\uparrow$가 항상 쌍으로 움직인다.\n**함정 포인트**: 보기에서 '정전용량 감소/증가'를 바꿔 출제한다. $L$과 $C$는 반대 방향으로 변한다는 것만 기억하면 된다."}, {"no": 2, "question": "3상 1회선 전선로에서 대지정전용량은 $C_s$이고 선간정전용량을 $C_m$이라 할 때, 작용정전용량 $C_n$은?", "choices": ["① $C_s + C_m$", "② $C_s + 2C_m$", "③ $C_s + 3C_m$", "④ $2C_s + C_m$"], "answerIndex": 2, "solution": "3상 1회선의 작용정전용량 $C_n = C_s + 3C_m$이다.\n(단상 2선식이면 $C_n = C_s + 2C_m$)", "timestampSec": 208, "theory": "**핵심 공식**: 3상 작용정전용량 $C_w = C_s + 3C_m$, 단상 작용정전용량 $C_w = C_s + 2C_m$\n**개념**: 작용정전용량은 1선 기준의 등가 정전용량으로, 선간정전용량을 $\\Delta \\to Y$ 환산해 대지정전용량과 합한 값이다.\n**함정 포인트**: 단상($+2C_m$)과 3상($+3C_m$)을 서로 바꿔서 낸다. 상수(相數)를 먼저 확인할 것."}, {"no": 3, "question": "교류 송전방식과 직류 송전방식을 비교할 때 교류 송전방식의 장점에 해당되는 것은?", "choices": ["① 전압의 승압, 강압 변경이 용이하다.", "② 절연계급을 낮출 수 있다.", "③ 송전효율이 좋다.", "④ 안정도가 좋다."], "answerIndex": 0, "solution": "교류는 변압기로 전압의 승압·강압이 쉬워 전압 변경이 용이하다.\n절연계급 저감, 송전효율 우수, 안정도 우수는 모두 직류 송전방식의 장점이다.", "timestampSec": 240, "theory": "**핵심**: 교류 장점 — 승압·강압 용이, 회전자계 얻기 쉬움, 일괄 운용(계통 연계) 용이\n**개념**: 직류 장점 — 절연계급 저감, 송전효율·안정도 우수, 리액턴스 강하 없음, 주파수가 다른 계통 연계 가능.\n**함정 포인트**: 직류의 장점 3개(절연·효율·안정도)를 교류 장점인 것처럼 섞어 놓는 전형 문제다."}, {"no": 4, "question": "송전선로에 낙뢰를 방지하기 위하여 설치하는 것은?", "choices": ["① 댐퍼", "② 초호환", "③ 가공지선", "④ 매설지선"], "answerIndex": 2, "solution": "낙뢰(직격뢰)로부터 전선로를 차폐하기 위해 철탑 최상부에 가공지선을 설치한다.\n매설지선은 탑각 접지저항을 낮춰 역섬락을 방지하고, 댐퍼는 진동 방지, 초호환(아킹혼)은 애자련 보호용이다.", "timestampSec": 268, "theory": "**핵심**: 낙뢰 차폐 — 가공지선 / 역섬락 방지 — 매설지선(탑각 접지저항 저감) / 진동 방지 — 댐퍼 / 애자련 보호 — 초호환(아킹혼)\n**개념**: 가공지선은 직격뢰·유도뢰 차폐와 통신선 유도장해 경감 효과도 있다.\n**함정 포인트**: '역섬락 방지'로 물으면 답은 매설지선. 낙뢰 방지(차폐)와 역섬락 방지를 구별할 것."}, {"no": 5, "question": "반지름 $r$[m]이고, 소도체 간격 $a$인 2도체 송전선로에 등가 선간거리가 $D$[m]로 배치되고 완전 연가된 경우 인덕턴스는 몇 [mH/km]인가?", "choices": ["① $0.4605\\log_{10}\\dfrac{D}{\\sqrt{ra^2}} + 0.025$", "② $0.4605\\log_{10}\\dfrac{D}{\\sqrt{ra}} + 0.025$", "③ $0.4605\\log_{10}\\dfrac{D}{\\sqrt{ra}} + 0.05$", "④ $0.4605\\log_{10}\\dfrac{D}{\\sqrt{ra^2}} + 0.05$"], "answerIndex": 1, "solution": "$n$복도체의 인덕턴스 $L_n = \\dfrac{0.05}{n} + 0.4605\\log_{10}\\dfrac{D}{\\sqrt[n]{r\\,a^{n-1}}}$ [mH/km]\n2도체($n=2$)이므로 $L = \\dfrac{0.05}{2} + 0.4605\\log_{10}\\dfrac{D}{\\sqrt{ra}} = 0.025 + 0.4605\\log_{10}\\dfrac{D}{\\sqrt{ra}}$", "timestampSec": 322, "theory": "**핵심 공식**: $L_n = \\dfrac{0.05}{n} + 0.4605\\log_{10}\\dfrac{D}{\\sqrt[n]{r\\,a^{n-1}}}$ [mH/km] ($n$: 소도체 수)\n**개념**: 단도체는 $0.05 + 0.4605\\log_{10}(D/r)$이고, 복도체는 내부 인덕턴스 항이 $1/n$로 줄고 등가 반지름이 $\\sqrt[n]{ra^{n-1}}$로 커진다.\n**함정 포인트**: 상수항 $0.05$와 $0.025$, 근호 안 $\\sqrt{ra}$와 $\\sqrt{ra^2}$를 바꿔치기한다. 2도체면 $0.025$, $\\sqrt{ra}$."}, {"no": 6, "question": "다음 중 전력계통의 안정도 향상대책으로 옳은 것은?", "choices": ["① 송전계통의 전달 리액턴스를 증가시킨다.", "② 고속 재폐로 방식을 채용한다.", "③ 전원측 원동기용 조속기의 작동을 느리게 한다.", "④ 고장을 줄이기 위하여 각 계통을 분리시킨다."], "answerIndex": 1, "solution": "고속도 재폐로 방식과 고속 차단기를 채용하면 고장 제거가 빨라져 안정도가 향상된다.\n리액턴스는 감소시켜야 하고, 조속기는 신속하게 동작시켜야 하며, 계통은 분리가 아니라 연계해야 안정도가 좋아진다.", "timestampSec": 445, "theory": "**핵심**: 안정도 향상대책 — 직렬 리액턴스 감소(복도체·병행회선·직렬콘덴서), 전압변동 억제(속응여자·중간조상), 고장 시 충격 경감(고속차단·고속 재폐로), 조속기 신속 동작\n**개념**: 재폐로는 고장 제거 후 신속히 재투입해 동기 이탈을 막는 방식이다.\n**함정 포인트**: '증가/감소', '느리게/빠르게', '분리/연계'처럼 방향만 뒤집은 보기가 나온다."}, {"no": 7, "question": "수전단 전압이 송전단 전압보다 높아지는 현상과 관련된 것은?", "choices": ["① 페란티 효과", "② 표피 효과", "③ 근접 효과", "④ 도플러 효과"], "answerIndex": 0, "solution": "무부하·경부하 시 선로의 정전용량에 의한 진상 충전전류 때문에 수전단 전압($V_r$)이 송전단 전압($V_s$)보다 높아지는 현상을 페란티 효과(현상)라 한다.\n대책으로 분로리액터를 설치한다.", "timestampSec": 533, "theory": "**핵심**: 페란티 현상 — 원인: 선로 정전용량 $C$(진상 충전전류), 발생 조건: 무부하·경부하, 대책: 분로리액터\n**개념**: $V_s < V_r$이 되는 유일한 대표 현상. 표피효과·근접효과는 도체 내 전류분포 문제다.\n**함정 포인트**: 원인을 '인덕턴스'로 바꾸거나 대책을 '직렬리액터'로 바꿔 출제한다. 페란티 대책은 분로(병렬)리액터."}, {"no": 8, "question": "장거리 송전선에서 단위 길이당 임피던스 $Z = R + j\\omega L$[Ω/km], 어드미턴스 $Y = G + j\\omega C$[℧/km]라 할 때 저항과 누설 컨덕턴스를 무시하는 경우 특성임피던스의 값은?", "choices": ["① $\\sqrt{\\dfrac{L}{C}}$", "② $\\sqrt{\\dfrac{C}{L}}$", "③ $\\dfrac{L}{C}$", "④ $\\dfrac{C}{L}$"], "answerIndex": 0, "solution": "특성임피던스 $Z_0 = \\sqrt{\\dfrac{Z}{Y}} = \\sqrt{\\dfrac{R + j\\omega L}{G + j\\omega C}}$에서 $R = 0$, $G = 0$이면\n$Z_0 = \\sqrt{\\dfrac{j\\omega L}{j\\omega C}} = \\sqrt{\\dfrac{L}{C}}$", "timestampSec": 585, "theory": "**핵심 공식**: 특성임피던스 $Z_0 = \\sqrt{Z/Y} = \\sqrt{L/C}$ (무손실), 전파정수 $\\gamma = \\sqrt{ZY}$\n**개념**: 특성임피던스는 선로 길이에 무관한 선로 고유의 값이다.\n**함정 포인트**: $\\sqrt{C/L}$은 특성어드미턴스. 분자·분모를 뒤집은 보기에 주의."}, {"no": 9, "question": "송전선의 전압변동률 식 $\\varepsilon = \\dfrac{V_{R1} - V_{R2}}{V_{R2}} \\times 100$[%]에서 $V_{R1}$은 무엇을 의미하는가?", "choices": ["① 부하 시 송전단 전압", "② 무부하 시 송전단 전압", "③ 전부하 시 수전단 전압", "④ 무부하 시 수전단 전압"], "answerIndex": 3, "solution": "전압변동률 $\\varepsilon = \\dfrac{V_{R1} - V_{R2}}{V_{R2}} \\times 100$[%]에서\n$V_{R1}$: 무부하 시 수전단 전압, $V_{R2}$: 전부하 시 수전단 전압이다.", "timestampSec": 695, "theory": "**핵심 공식**: $\\varepsilon = \\dfrac{V_{R0} - V_{Rn}}{V_{Rn}} \\times 100$[%] ($V_{R0}$: 무부하 수전단 전압, $V_{Rn}$: 전부하 수전단 전압)\n**개념**: 전압변동률은 수전단 전압 기준의 지표로, 송전단 전압은 식에 등장하지 않는다.\n**함정 포인트**: '송전단'이 들어간 보기는 무조건 오답. 분모가 전부하 수전단 전압이라는 것도 함께 출제된다."}, {"no": 10, "question": "154[kV] 송전계통에서 3상 단락고장이 발생하였을 경우 고장점에서 본 등가 정상 임피던스가 100[MVA] 기준으로 25[%]라고 하면 단락용량은 몇 [MVA]인가?", "choices": ["① 250", "② 300", "③ 400", "④ 500"], "answerIndex": 2, "solution": "단락용량 $P_s = \\dfrac{100}{\\%Z} \\times P_n = \\dfrac{100}{25} \\times 100 = 400$[MVA]", "timestampSec": 745, "theory": "**핵심 공식**: 단락용량 $P_s = \\dfrac{100}{\\%Z}P_n$, 단락전류 $I_s = \\dfrac{100}{\\%Z}I_n$\n**개념**: %임피던스는 기준용량에 대한 백분율이므로 기준용량 $P_n$과 반드시 짝지어 사용한다.\n**함정 포인트**: 계통 전압 154[kV]는 계산에 쓰이지 않는 미끼 조건이다. $\\%Z$와 기준용량만 있으면 된다."}, {"no": 11, "question": "송전선로의 중성점을 접지하는 목적으로 가장 알맞은 것은?", "choices": ["① 전선량의 절약", "② 송전용량의 증가", "③ 전압강하의 감소", "④ 이상전압의 경감 및 발생 방지"], "answerIndex": 3, "solution": "중성점 접지의 가장 큰 목적은 1선 지락 시 건전상의 전위 상승을 억제하여 이상전압을 경감하고 발생을 방지하는 것이다.\n이 밖에 기기 절연레벨 경감, 보호계전기의 확실한 동작 확보 등의 목적이 있다.", "timestampSec": 795, "theory": "**핵심**: 중성점 접지 목적 — 이상전압 경감·발생 방지, 건전상 전위 상승 억제, 절연레벨 경감, 지락계전기 확실한 동작, 아크 지락 신속 소멸\n**개념**: 직접접지는 전위 상승이 가장 작아 절연 경감에 유리하고, 소호리액터 접지는 지락전류가 최소다.\n**함정 포인트**: 전선량 절약·송전용량 증가·전압강하 감소는 접지 목적과 무관한 미끼 보기다."}, {"no": 12, "question": "그림과 같은 3상 발전기가 있다. $a$상이 지락한 경우 지락전류는 어떻게 표현되는가? (단, $Z_0$: 영상임피던스, $Z_1$: 정상임피던스, $Z_2$: 역상임피던스이다. 원본 보기는 발전기 결선 그림이나, 무부하 발전기 $a$상 1선 지락 조건이다.)", "choices": ["① $\\dfrac{E_0}{Z_0 + Z_1 + Z_2}$", "② $\\dfrac{3E_a}{Z_0 + Z_1 + Z_2}$", "③ $-\\dfrac{Z_0}{Z_0 + Z_1 + Z_2}$", "④ $\\dfrac{2Z_2 E_a}{Z_1 + Z_2}$"], "answerIndex": 1, "solution": "1선 지락 시 대칭분 전류 $I_0 = I_1 = I_2 = \\dfrac{E_a}{Z_0 + Z_1 + Z_2}$이고,\n지락전류 $I_g = 3I_0 = \\dfrac{3E_a}{Z_0 + Z_1 + Z_2}$이다.\n(원본 문제의 그림은 Y결선 발전기의 $a$상 지락 회로도이다.)", "timestampSec": 865, "theory": "**핵심 공식**: 1선 지락전류 $I_g = 3I_0 = \\dfrac{3E_a}{Z_0 + Z_1 + Z_2}$\n**개념**: 1선 지락은 영상·정상·역상 세 대칭분이 모두 존재하며 직렬로 연결된 등가회로가 된다.\n**함정 포인트**: 분자의 3을 빠뜨린 $E_a/(Z_0+Z_1+Z_2)$가 단골 오답. 선간단락은 $Z_1+Z_2$, 3상 단락은 $Z_1$만 쓴다."}, {"no": 13, "question": "전력 퓨즈(Power Fuse)는 주로 어떤 전류의 차단을 목적으로 사용하는가?", "choices": ["① 충전전류", "② 과부하전류", "③ 단락전류", "④ 과도전류"], "answerIndex": 2, "solution": "전력 퓨즈(PF)는 주로 단락전류의 차단을 목적으로 사용한다.\n과부하전류나 충전전류 차단용이 아니며, 재투입이 불가능한 것이 단점이다.", "timestampSec": 945, "theory": "**핵심**: 전력 퓨즈 — 단락전류 차단 전용. 장점: 소형 경량, 차단용량 큼, 고속 차단, 보수 간단 / 단점: 재투입 불가, 과도전류에 용단되기 쉬움\n**개념**: 과부하 보호는 계전기+차단기, 충전전류 개폐는 단로기·개폐기 영역이다.\n**함정 포인트**: '과부하전류'를 답으로 고르기 쉽다. 퓨즈는 단락 보호 전용임을 기억할 것."}, {"no": 14, "question": "전압이 일정값 이하로 되었을 때 동작하는 것으로서 단락 시 고장 검출용으로도 사용되는 계전기는?", "choices": ["① OVR", "② OVGR", "③ NSR", "④ UVR"], "answerIndex": 3, "solution": "전압이 일정값 이하로 떨어지면 동작하는 계전기는 부족전압계전기(UVR)이다.\nOVR은 과전압계전기, OVGR은 지락과전압계전기, NSR은 역상계전기이다.", "timestampSec": 968, "theory": "**핵심**: UVR(부족전압계전기) — 전압이 일정값 이하일 때 동작, 단락 고장 검출·정전 검출용\n**개념**: OVR — 일정값 이상 전압에서 동작 / OVGR — 지락 시 영상전압 검출 / NSR — 역상분 검출(결상·역상 보호).\n**함정 포인트**: '이하'면 UVR, '이상'이면 OVR. 문제의 부등호 방향 한 글자로 답이 갈린다."}, {"no": 15, "question": "발전기나 변압기의 내부고장 검출로 주로 사용되는 계전기는?", "choices": ["① 역상 계전기", "② 과전압 계전기", "③ 과전류 계전기", "④ 비율차동 계전기"], "answerIndex": 3, "solution": "발전기·변압기의 내부고장 검출에는 비율차동계전기가 주로 사용된다.\n양측 전류의 차이(차동전류)가 일정 비율 이상일 때 동작한다.", "timestampSec": 1025, "theory": "**핵심**: 발전기·변압기 내부고장 보호 — 비율차동계전기(RDR), 변압기 내부고장 기계적 검출 — 부흐홀츠계전기\n**개념**: 유입 전류와 유출 전류의 벡터차가 억제 전류의 일정 비율을 넘으면 동작하는 원리다.\n**함정 포인트**: '부흐홀츠계전기'가 보기에 함께 나오면 전기적 검출(비율차동)인지 기계적 검출(부흐홀츠)인지 구분해야 한다."}, {"no": 16, "question": "전력용 조상설비 중 무효전력 흡수를 진상과 지상 양용으로 할 수 있는 것은?", "choices": ["① 동기조상기", "② 분로리액터", "③ 직렬리액터", "④ 전력용 콘덴서"], "answerIndex": 0, "solution": "동기조상기는 여자를 조정하여 진상·지상 무효전력을 모두 연속적으로 공급할 수 있다.\n전력용 콘덴서는 진상 전용, 분로리액터는 지상 전용이며 조정이 불연속(계단적)이다.", "timestampSec": 1048, "theory": "**핵심**: 동기조상기 — 진상·지상 양용, 연속 조정, 시송전(시충전) 가능 / 전력용 콘덴서 — 진상 전용, 불연속 / 분로리액터 — 지상 전용, 불연속\n**개념**: 조상설비 비교표는 '양용·연속·시송전' 세 키워드가 모두 동기조상기의 특징이다.\n**함정 포인트**: '시송전이 가능한 설비'로 바꿔 물어도 답은 동기조상기다."}, {"no": 17, "question": "다음 중 그 값이 1이상인 것은?", "choices": ["① 부등률", "② 부하율", "③ 수용률", "④ 전압강하율"], "answerIndex": 0, "solution": "부등률 $= \\dfrac{\\text{각 부하 최대수용전력의 합}}{\\text{합성 최대수용전력}}$은 항상 1 이상이다.\n부하율과 수용률은 보통 1 이하(100% 이하)의 값을 갖는다.", "timestampSec": 1176, "theory": "**핵심 공식**: 부등률 $= \\dfrac{\\sum \\text{개별 최대전력}}{\\text{합성 최대전력}} \\geq 1$, 수용률 $= \\dfrac{\\text{최대수용전력}}{\\text{설비용량}} \\leq 1$, 부하율 $= \\dfrac{\\text{평균전력}}{\\text{최대전력}} \\leq 1$\n**개념**: 각 부하의 최대가 같은 시각에 겹치지 않으므로 개별 최대의 합이 합성 최대보다 크거나 같다.\n**함정 포인트**: 부등률이 클수록 설비 이용률이 좋다. '1 이하인 것'으로 뒤집어 내면 수용률·부하율을 고른다."}, {"no": 18, "question": "배전방식으로 저압 네트워크 방식이 적당한 경우는?", "choices": ["① 부하가 밀집되어있는 시가지", "② 바람이 많은 어촌지역", "③ 농촌지역", "④ 화학공장"], "answ <script>

      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
</html>
