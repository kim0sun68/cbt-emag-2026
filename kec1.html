<script id="data" type="application/json">{"title": "2026 전기기사 전기설비기술기준 1회 기출 핵심풀이", "videoId": "zK2jwZlfQxo", "questions": [{"no": 1, "question": "가공전선로의 지지물에 시설하는 지선의 시설기준으로 잘못된 것은?", "choices": ["① 지선의 안전율은 2.5 이상일 것", "② 소선은 최소 5가닥 이상의 연선일 것", "③ 소선은 지름 2.6[mm] 이상인 금속선일 것", "④ 지중부분 및 지표상 0.3[m]까지의 부분은 아연도금을 한 철봉 등 부식하기 어려운 재료를 사용할 것"], "answerIndex": 1, "solution": "지선의 소선은 **3가닥 이상의 연선**이어야 한다. 5가닥이 아니므로 ②가 잘못된 내용.\n안전율 2.5, 소선 지름 2.6mm, 지표 부근 30cm 아연도금은 모두 규정에 맞다.", "timestampSec": 20, "theory": "**핵심 수치(지선 5종 세트)**: 안전율 2.5 / 소선 지름 2.6mm / 가닥수 3가닥 / 허용 인장하중 4.31kN / 도로 횡단 높이 5m\n**개념**: 지선은 지지물의 강도를 분담시키기 위해 반대쪽으로 당겨 주는 선. 단, 철탑은 지선으로 강도를 분담시켜서는 안 된다.\n**함정 포인트**: 항목 순서대로 2.5→2.6→3→4.31→5로 숫자가 커진다. 가닥수를 5가닥으로 바꿔 틀린 보기를 만드는 전형 문제."}, {"no": 2, "question": "고압전로 중의 과전류차단기의 시설로 알맞지 않은 것은?", "choices": ["① 비포장 퓨즈는 정격전류의 1.25배의 전류에 견디고 또한 2배의 전류로 2분 안에 용단되는 것이어야 한다.", "② 단락이 생긴 경우에 동작하는 과전류차단기는 이것을 시설하는 곳을 통과하는 단락전류를 차단하는 능력을 가지는 것이어야 한다.", "③ 포장 퓨즈는 정격전류의 1.3배의 전류에 견디고 또한 2배의 전류로 60분 안에 용단되는 것이어야 한다.", "④ 과전류차단기는 그 동작에 따라 그 개폐상태를 표시하는 장치가 되어 있는 것이어야 한다."], "answerIndex": 2, "solution": "고압 포장 퓨즈는 정격전류의 1.3배에 견디고 2배의 전류로 **120분** 안에 용단되어야 한다. 60분이 아니므로 ③이 잘못된 내용.\n비포장 퓨즈는 1.25배에 견디고 2배 전류로 2분 안에 용단 — ①은 맞는 내용.", "timestampSec": 190, "theory": "**핵심 수치**: 고압 포장 퓨즈 — 1.3배 견딤 / 2배 전류 120분 내 용단, 비포장 퓨즈 — 1.25배 견딤 / 2배 전류 2분 내 용단\n**개념**: 과전류차단기는 개폐상태 표시장치가 있어야 하고, 단락전류를 차단할 수 있는 차단능력을 갖춰야 한다.\n**함정 포인트**: 포장 120분·비포장 2분의 시간을 서로 바꾸거나 60분으로 줄여 출제된다. '포장 1.3배·120분 / 비포장 1.25배·2분' 세트 암기."}, {"no": 3, "question": "전기철도의 전기방식에 관한 사항으로 잘못된 것은?", "choices": ["① 공칭전압(수전전압)은 교류 3상 22.9[kV], 154[kV], 345[kV]을 선정한다.", "② 직류방식에서 최고 비영구 전압은 지속시간이 3분 이하로 예상되는 전압의 최고값으로 한다.", "③ 교류방식의 급전전압 주파수는 60[Hz]이다.", "④ 교류방식에서 최고 비영구 전압은 지속시간이 2분 이하로 예상되는 전압의 최저값으로 한다."], "answerIndex": 1, "solution": "직류방식의 최고 비영구 전압은 지속시간이 **5분 이하**로 예상되는 전압의 최고값이다. 3분이 아니므로 ②가 잘못된 내용.\n공칭전압 22.9/154/345kV, 주파수 60Hz, 교류방식 2분은 모두 맞다.", "timestampSec": 310, "theory": "**핵심 수치**: 비영구 전압 지속시간 — 직류방식 5분 / 교류방식 2분, 급전전압 주파수 60Hz, 수전 공칭전압 교류 3상 22.9·154·345kV\n**개념**: 전기철도의 비영구(비지속성) 전압은 짧은 시간만 나타나는 전압으로, 방식별 지속시간 기준이 다르다.\n**함정 포인트**: '2 아니면 5' — 직류 5분·교류 2분에서 숫자 하나를 3분 등으로 바꿔 출제한다. '이(2)오(5) 요구르트'로 암기."}, {"no": 4, "question": "발전소, 변전소, 개폐소의 시설부지 조성을 위해 산지를 전용할 경우에 전용하고자 하는 산지의 평균 경사도는 몇 도 이하이어야 하는가?", "choices": ["① 10도", "② 15도", "③ 25도", "④ 20도"], "answerIndex": 2, "solution": "발·변전소, 개폐소 부지 조성용 산지 전용 시 평균 경사도는 **25도 이하**이어야 한다.", "timestampSec": 370, "theory": "**핵심 수치**: 산지 평균 경사도 — 일반 발·변전소/개폐소 25도 이하, 태양광 발전소 15도 이하\n**개념**: 경사가 급한 산지에 부지를 조성하면 붕괴 위험이 있어 법으로 경사도를 제한한다.\n**함정 포인트**: '태양광'이라는 말이 나오면 15도(강화 규정), 없으면 25도. 보기에 15도가 함께 나오는 이유."}, {"no": 5, "question": "지중 전선로를 직접 매설식에 의하여 시설할 때, 중량물의 압력을 받을 우려가 있는 장소에 저압 또는 고압의 지중전선을 견고한 트라프 기타 방호물에 넣지 않고도 부설할 수 있는 케이블은?", "choices": ["① PVC 외장 케이블", "② 콤바인덕트 케이블", "③ 염화비닐 절연 케이블", "④ 폴리에틸렌 외장 케이블"], "answerIndex": 1, "solution": "**콤바인덕트(CD) 케이블**은 케이블 자체가 견고한 덕트 구조이므로 트라프 등 방호물에 넣지 않고 직접 매설할 수 있다.", "timestampSec": 432, "theory": "**핵심 규정**: 직접 매설식에서 방호물 생략 가능 — 콤바인덕트 케이블(저압·고압)\n**개념**: 지중 전선로 매설 방식 3가지 — 직접 매설식·관로식·전력구식(암거식). 매설 깊이는 중량물 압력 우려 시 1.0m, 없으면 0.6m 이상.\n**함정 포인트**: 매설 깊이(1.0m/0.6m)와 매설 방식 3종도 같은 조문에서 번갈아 출제된다."}, {"no": 6, "question": "한국전기설비규정에 따른 전선의 색상으로 N의 경우 어떠한 색상을 사용하는가?", "choices": ["① 검정색", "② 녹색-노란색", "③ 회색", "④ 파란색"], "answerIndex": 3, "solution": "중성선 N의 색상은 **파란색(청색)**이다.\nL1 갈색, L2 흑색, L3 회색, N 청색, 보호도체(PE) 녹색-노란색.", "timestampSec": 528, "theory": "**핵심 규정**: 전선 색상 — L1 갈색 / L2 흑색 / L3 회색 / N 청색 / PE(보호도체) 녹황색\n**개념**: N은 뉴트럴(중성선). 상별 색상 식별은 실기까지 이어지는 필수 암기 사항이다.\n**함정 포인트**: '갈·흑·회·청·녹황' 순서 암기. PE의 녹색-노란색을 N으로 착각하게 만드는 보기가 자주 나온다."}, {"no": 7, "question": "주택용 배선차단기의 순시트립에 따른 구분 중 B형의 경우 순시트립범위로 알맞은 것은?", "choices": ["① 3In 초과 ~ 5In 이하", "② 1.5In 초과 ~ 3In 이하", "③ 5In 초과 ~ 10In 이하", "④ 10In 초과 ~ 20In 이하"], "answerIndex": 0, "solution": "주택용 배선차단기 순시트립 범위 — **B형: 3In 초과 ~ 5In 이하**, C형: 5In 초과 ~ 10In 이하, D형: 10In 초과 ~ 20In 이하.", "timestampSec": 600, "theory": "**핵심 수치**: B형 3~5In / C형 5~10In / D형 10~20In (A형은 없음)\n**개념**: 순시트립은 단락 등 큰 전류에서 즉시 차단되는 동작 범위. B→C→D로 갈수록 2배씩 커진다.\n**함정 포인트**: 보기에 'A형'을 섞거나 C·D형 범위를 묻는 변형이 나온다. 'B형 3~5, 아래로 2배씩'으로 암기."}, {"no": 8, "question": "건축물 외부의 전기사용장소에서 그 전기사용장소에서의 전기사용을 목적으로 조영물에 고정시켜 시설하는 전선을 무엇이라 하는가?", "choices": ["① 옥외배선", "② 옥내배선", "③ 가공인입선", "④ 옥측배선"], "answerIndex": 3, "solution": "건물 바깥(옥외)의 전기사용장소에서 그 장소의 전기사용을 목적으로 **조영물에 고정시켜** 시설하는 전선은 **옥측배선**이다.\n조영물에 고정한다는 표현이 핵심 — 고정 없이 옥외에 시설하면 옥외배선이다.", "timestampSec": 650, "theory": "**핵심 규정**: 옥측배선 — 옥외 전기사용장소에서 전기사용 목적으로 조영물에 고정시켜 시설하는 전선\n**개념**: 옥내배선(건물 내부) / 옥측배선(건물 외벽 등 조영물에 고정) / 옥외배선(옥측배선 이외의 옥외 배선) / 인입선(수용장소로 끌어들이는 선)의 용어 구분 문제.\n**함정 포인트**: '조영물에 고정'이라는 문구가 나오면 옥측배선. 옥외배선과 혼동시키는 것이 출제 의도."}, {"no": 9, "question": "고압 가공전선로의 지지물로 철탑을 사용한 경우 보안공사시 경간은 몇 [m] 이하이어야 하는가?", "choices": ["① 300", "② 400", "③ 500", "④ 600"], "answerIndex": 1, "solution": "저·고압 보안공사 시 철탑의 경간은 **400[m] 이하**이다.\n표준 경간은 A종 150m, B종 250m, 철탑 600m이고, 보안공사 시 A종 100m, B종 150m, 철탑 400m로 줄어든다.", "timestampSec": 745, "theory": "**핵심 수치**: 경간 — 표준: A종 150 / B종 250 / 철탑 600, 저·고압 보안공사: A종 100 / B종 150 / 철탑 400\n**개념**: 보안공사는 안전을 강화하는 공사이므로 표준보다 경간을 줄인다. 장경간(고 22 특 50 조건)은 A종 300, B종 500, 철탑 600(제한 없음 취급).\n**함정 포인트**: 철탑은 표준 600 → 보안공사 400으로 줄어드는 유일한 값 변화에 주의. 표준 600을 그대로 찍게 유도한다."}, {"no": 10, "question": "라이팅 덕트 공사에 의한 저압 옥내배선에서 덕트의 지지점간의 거리는 몇 [m] 이하인가?", "choices": ["① 2", "② 3", "③ 4", "④ 5"], "answerIndex": 0, "solution": "라이팅 덕트의 지지점 간 거리는 **2[m] 이하**이어야 한다.", "timestampSec": 850, "theory": "**핵심 수치**: 라이팅 덕트 지지점 간 거리 2m 이하\n**개념**: 라이팅 덕트는 조명기구를 임의 위치에 접속할 수 있는 덕트로, 처짐·탈락 방지를 위해 지지 간격을 제한한다.\n**함정 포인트**: 금속덕트·버스덕트의 지지 간격 3m(취급자 외 출입 없는 수직 6m)와 혼동 주의. 라이팅 덕트만 2m."}, {"no": 11, "question": "시가지내에 시설하는 154[kV] 가공전선로는 지락 또는 단락이 생겼을 때 몇 초 안에 자동적으로 이를 전로로부터 차단하는 장치를 시설하여야 하는가?", "choices": ["① 1", "② 3", "③ 5", "④ 10"], "answerIndex": 0, "solution": "시가지에 시설하는 사용전압 100[kV] 초과의 특고압 가공전선로는 지락·단락 시 **1초** 이내에 자동 차단하는 장치를 시설해야 한다. 154kV는 100kV 초과이므로 1초.", "timestampSec": 905, "theory": "**핵심 수치**: 시가지 특고압 가공전선로 — 100kV 초과 시 지락·단락 1초 이내 자동 차단\n**개념**: 시가지는 인구 밀집 지역이므로 고장 시 신속 차단이 요구된다. 애자장치 50% 충격섬락전압 110% 이상(130kV 초과 시 105%) 등 강화 규정과 세트.\n**함정 포인트**: 66kV(100kV 이하)는 해당 규정의 차단시간 대상이 다르다. '100kV 초과 = 1초'만 정확히 기억하면 154kV·345kV 모두 1초."}, {"no": 12, "question": "전기철도차량의 집전장치와 접촉하여 전력을 공급하기 위한 전선은 무엇인가?", "choices": ["① 전차선", "② 급전선", "③ 귀선", "④ 조가선"], "answerIndex": 0, "solution": "집전장치(팬터그래프)와 **직접 접촉**하여 전기철도차량에 전력을 공급하는 전선은 **전차선**이다.\n급전선은 변전소에서 전차선에 전력을 공급하는 선, 귀선은 전류가 되돌아가는 선, 조가선은 전차선을 매달아 지지하는 선이다.", "timestampSec": 1005, "theory": "**핵심 규정**: 전차선 — 집전장치와 접촉하여 전력 공급 / 급전선 — 변전소→전차선 공급용 / 귀선 — 귀환 전류 통로 / 조가선 — 전차선 지지(매닮)\n**개념**: 전기철도 용어 정의 문제. 전력 흐름은 변전소→급전선→전차선→차량→귀선→변전소 순.\n**함정 포인트**: '접촉'이라는 단어가 나오면 전차선, '매단다'면 조가선. 급전선을 정답으로 착각하기 쉽다."}, {"no": 13, "question": "고압 옥내배선 등의 시설에 관해 알맞은 것은?", "choices": ["① 애자사용 공사시 전선은 공칭단면적 4[mm²] 이상의 연동선일 것", "② 옥내 배선공사는 케이블공사 또는 케이블트레이공사 일 것", "③ 애자사용공사 시 전선의 지지점간의 거리는 5[m] 이하 일것", "④ 애자사용 공사시 전선과 조영재 사이의 간격은 0.06[m] 이상일 것"], "answerIndex": 1, "solution": "고압 옥내배선은 **케이블공사 또는 케이블트레이공사**(건조한 장소의 노출 장소에 한해 애자공사)로 시설한다. ②가 맞는 내용.\n①은 6mm² 이상, ③은 6m 이하(조영재 면을 따라 붙일 경우 2m), ④는 0.05m 이상이 옳다.", "timestampSec": 1110, "theory": "**핵심 수치**: 고압 애자공사 — 전선 6mm² 이상 연동선, 지지점 간 6m 이하(조영재면 2m), 전선-조영재 간격 0.05m 이상\n**개념**: 고압 옥내배선 공사방법은 케이블공사·케이블트레이공사가 원칙이고 애자공사는 건조·노출 장소에 한정된다.\n**함정 포인트**: 4↔6mm², 5↔6m, 0.06↔0.05m처럼 수치를 미세하게 바꾼 보기 3개를 배치하는 전형적 수치 변형 문제."}, {"no": 14, "question": "풍력발전선비에서 피뢰 및 접지설비로 잘못된 것은?", "choices": ["① 접지설비는 풍력발전설비 타워기초를 이용한 개별접지공사를 하여야 한다.", "② 전력기기는 금속시스케이블, 내뢰변압기 및 서지보호장치(SPD)를 적용할 것", "③ 제어기기는 광케이블 및 포토커플러를 적용할 것", "④ 설비사이의 전위차가 없도록 등전위본딩을 하여야 한다."], "answerIndex": 0, "solution": "풍력발전설비의 접지설비는 타워기초를 이용한 **통합접지공사**를 하여야 한다. 개별접지가 아니므로 ①이 잘못된 내용.\n전력기기의 금속시스케이블·내뢰변압기·SPD, 제어기기의 광케이블·포토커플러, 등전위본딩은 모두 맞는 내용.", "timestampSec": 1190, "theory": "**핵심 규정**: 풍력발전 접지 — 타워기초 이용 통합접지, 설비 간 등전위본딩\n**개념**: 낙뢰가 잦은 풍력터빈은 전체 설비를 하나의 접지계통으로 묶어 전위차를 없애는 것이 원칙. 전력기기는 SPD 등으로, 제어기기는 광케이블·포토커플러로 뇌서지를 차단한다.\n**함정 포인트**: '통합접지'를 '개별접지'로 바꿔 출제. 접지 문제에서 개별이라는 단어가 보이면 의심할 것."}, {"no": 15, "question": "전기욕기에 전기를 공급하기 위한 전원 변압기의 2차측 전로의 사용전압은 몇[V] 이하 이어야 하는가?", "choices": ["① 15", "② 10", "③ 30", "④ 20"], "answerIndex": 1, "solution": "전기욕기 전원장치(변압기) 2차측 전로의 사용전압은 **10[V] 이하**이어야 한다.", "timestampSec": 1270, "theory": "**핵심 수치(사용전압 시리즈)**: 전기욕기 10V / 풀용 수중조명등 30V / 놀이용 전차 직류 60V·교류 40V / 전기부식방지 직류 60V / 전기울타리 250V / 교통신호등 300V\n**개념**: 사람 몸이 물에 잠기는 욕기는 감전 위험이 가장 크므로 특수시설 중 최저 전압(10V)으로 제한된다.\n**함정 포인트**: 수중조명등 30V와 혼동 유도. '몸이 통째로 잠기는 욕기가 가장 낮은 10V'로 기억."}, {"no": 16, "question": "345000[V]의 전압을 변전하는 변전소가 있다. 이 변전소에 울타리를 시설하고자 하는 경우 울타리의 높이와 울타리로부터 충전부분까지의 거리의 합계는 몇 [m] 이상으로 하여야 하는가?", "choices": ["① 7.42[m]", "② 8.28[m]", "③ 10.15[m]", "④ 12.31[m]"], "answerIndex": 1, "solution": "160kV 초과이므로 합계 = 6 + (사용전압[만V] − 16, 10kV 단수 절상) × 0.12.\n(34.5 − 16) = 18.5 → 단수 19, 6 + 19 × 0.12 = 6 + 2.28 = **8.28[m]**.", "timestampSec": 1350, "theory": "**핵심 수치**: 울타리 높이+충전부까지 거리 합계 — 35kV 이하 5m / 35kV 초과 160kV 이하 6m / 160kV 초과 6m + 10kV 단수마다 0.12m 가산 (울타리 높이는 2m 이상, 지면과 하단 간격 0.15m 이하)\n**개념**: 발·변전소 울타리는 전압이 높을수록 충전부와의 이격 합계를 크게 한다. 단수 계산은 반드시 절상.\n**함정 포인트**: 18.5를 절상하지 않고 18로 계산하면 8.16으로 오답. '단수는 무조건 올림' + 154kV급이면 그냥 6m라는 것도 세트로 기억."}, {"no": 17, "question": "저압 옥내전로의 인입구에 가까운 곳으로서 쉽게 개폐할 수 있는 곳에 개폐기를 시설하여야 한다. 단, 사용전압이 400[V] 이하인 옥내전로로서 다른 옥내전로에 접속하는 길이가 몇 [m] 이하인 경우는 개폐기를 생략할 수 있는가? (단, 정격전류가 16[A] 이하인 과전류 차단기 또는 정격전류가 16[A]를 초과하고 20[A] 이하인 배선용 차단기로 보호되고 있는 것에 한한다.)", "choices": ["① 15", "② 20", "③ 25", "④ 30"], "answerIndex": 0, "solution": "사용전압 400V 이하이고 다른 옥내전로(16A 이하 과전류차단기 또는 16A 초과 20A 이하 배선용차단기로 보호)에 접속하는 길이 **15[m] 이하**의 전로는 인입구 개폐기를 생략할 수 있다.", "timestampSec": 1510, "theory": "**핵심 수치**: 개폐기 생략 조건 — 400V 이하 + 접속 길이 15m 이하 + 과전류차단기 16A 이하(배선용차단기는 16A 초과 20A 이하)\n**개념**: 짧은 분기 전로는 이미 차단기로 보호되므로 별도의 인입구 개폐기를 생략할 수 있게 한 완화 규정이다.\n**함정 포인트**: '과·차 16 / 배 20' 숫자와 15m를 서로 바꿔 출제한다. 조건 3종(전압·길이·차단기 정격)을 세트로 암기."}, {"no": 18, "question": "주택의 옥내전로(전기기계기구내의 전로를 제외)의 대지전압이 300[V] 이하 일 때 잘못된 것은?", "choices": ["① 주택의 전로 인입구에는 「전기용품 및 생활용품 안전관리법」에 적용을 받는 감전보호용 누전차단기를 시설하여야 한다.", "② 누전차단기를 자연재해대책법에 의한 자연재해위험개선지구의 지정 등에서 지정되어진 지구 안의 지하주택에 시설하는 경우에는 침수시 위험의 우려가 없도록 지하에 시설하여야 한다.", "③ 백열전등의 전구소켓은 스위치나 그 밖의 점멸기구가 없는 것이어야 한다.", "④ 전기기계기구로서 사람이 쉽게 접촉할 우려가 있는 부분이 절연성이 있는 재료로 견고하게 제작되어 있는 것을 사용해야한다."], "answerIndex": 1, "solution": "자연재해위험개선지구 안의 지하주택에 누전차단기를 시설하는 경우, 침수 시 위험이 없도록 **지상에** 시설하여야 한다. '지하에 시설'이 잘못이므로 ②가 정답.\n지하에 두면 침수 시 누전차단기 자체가 물에 잠겨 기능을 상실한다.", "timestampSec": 1565, "theory": "**핵심 규정**: 주택 옥내전로 대지전압 300V 이하 — 인입구 감전보호용 누전차단기 시설, 침수 우려 지구의 지하주택은 누전차단기를 지상에 시설\n**개념**: 백열전등 소켓은 점멸기구가 없는 키리스 소켓, 사람이 접촉하기 쉬운 부분은 절연 재료 사용 등 감전 방지 목적의 규정 모음.\n**함정 포인트**: '침수 위험이 없도록 지하에'는 문장 자체가 모순 — 법을 몰라도 상식으로 걸러낼 수 있는 유형이다."}, {"no": 19, "question": "통신설비의 식별표시에 대한 사항으로 알맞지 않은 것은?", "choices": ["① 모든 통신기기에는 식별이 용이하도록 인식용 표찰을 부착하여야 한다.", "② 통신사업자의 설비표시명판은 플라스틱 및 금속판 등 견고하고 가벼운 재질로 하고 글씨는 각인하거나 지워지지 않도록 제작된 것을 사용하여야 한다.", "③ 배전주에 시설하는 통신설비의 설비표시명판의 경우 직선주는 전주 10경간마다 시설할 것", "④ 배전주에 시설하는 통신설비의 설비표시명판의 경우 분기주, 인류주는 매 전주에 시설할 것"], "answerIndex": 2, "solution": "배전주 직선주의 설비표시명판은 전주 **5경간마다** 시설하여야 한다. 10경간이 아니므로 ③이 잘못된 내용.\n분기주·인류주는 매 전주에 시설한다.", "timestampSec": 1645, "theory": "**핵심 수치**: 통신설비 설비표시명판 — 직선주 5경간마다(배전주), 분기주·인류주 매 전주 (참고: 가공지선 지지 철탑 등 송전 시설은 직선주 10경간마다)\n**개념**: 통신설비 식별표시는 명판을 견고하고 지워지지 않게 만들어 부착하는 규정이다.\n**함정 포인트**: 법문형 문제에서 보기 중 숫자가 하나뿐이면 그 숫자를 바꾼 것이 정답인 경우가 많다 — 5를 10으로 변형한 전형 문제."}, {"no": 20, "question": "가공전선로의 지지물에 하중이 가하여지는 경우에 그 하중을 받는 지지물의 기초 안전율은 얼마 이상이어야 하는가? (단, 이상 시 상정 하중은 무관)", "choices": ["① 1.5", "② 2.0", "③ 2.5", "④ 3.0"], "answerIndex": 1, "solution": "가공전선로 지지물의 기초 안전율은 **2 이상**이어야 한다.\n단서의 '이상 시 상정하중 무관'은 철탑의 이상 시 상정하중에 대한 안전율 1.33을 배제한다는 뜻이다.", "timestampSec": 1722, "theory": "**핵심 수치(안전율 시리즈)**: 지지물 기초 2 / 철탑 이상 시 상정하중 1.33 / 지선 2.5 / 목주(저압) 1.2·(고압) 1.3·(특고압) 1.5 / 케이블트레이 1.5\n**개념**: 기초 안전율은 지지물이 넘어지지 않기 위한 기초 강도의 여유율이다.\n**함정 포인트**: 단서가 '이상 시 상정하중에 대한 철탑'으로 바뀌면 정답이 1.33이 된다. 단서 문구를 반드시 확인할 것."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
