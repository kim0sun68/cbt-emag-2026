모두 1차측 직렬 임피던스로 감압 기동, 가속 후 단락.\n**함정 포인트**: 권선형의 '2차 저항 기동(비례추이)'과 혼동 유도. 문제가 '전원측 직렬 저항' → 1차 저항 기동."}, {"no": 7, "question": "유도전동기의 원선도에 대한 설명으로 옳은 것은?", "choices": ["① 원선도의 지름은 전압에 비례하고 리액턴스에 반비례한다.", "② 원선도를 작성하기 위해서는 슬립을 측정하여야 한다.", "③ 원선도를 작성하기 위해서는 부하시험을 하여야 한다.", "④ 원선도상에서 직접 기계적 출력을 얻을 수 있다."], "answerIndex": 0, "solution": "원선도의 지름은 무효분(지상) 전류 성분으로 $\\dfrac{E_1}{x_1}$ → 전압에 비례, 1차 누설리액턴스에 반비례 → ① 옳음.\n원선도 작성에 필요한 시험은 **무부하시험, 구속시험, 저항측정** → 슬립 측정·부하시험 불필요(②·③ 틀림).\n원선도에서는 기계적 손실을 고려할 수 없어 기계적 출력을 직접 얻을 수 없다(④ 틀림).", "timestampSec": 593, "theory": "**핵심 공식**: 원선도 지름 $D \\propto \\dfrac{E}{x}$ (전압에 비례, 리액턴스에 반비례)\n**개념**: 원선도 3대 시험 = 무부하시험, 구속시험, 권선저항 측정. 원선도로 구할 수 있는 것: 1차 입력, 2차 입력(동기와트), 1차·2차 동손, 철손, 효율, 역률, 슬립.\n**함정 포인트**: '기계적 출력을 직접 얻을 수 있다'가 대표 오답(기계손은 원선도에 반영 안 됨). 동기기 단락비 시험(무부하 포화·3상 단락)과 이름 혼동 주의."}, {"no": 8, "question": "전부하에 있어서 2차 전압이 120[V]이고 전압 변동률이 2[%]인 단상 변압기가 있다. 1차 단자전압을 구하시오. (단, 1차 권선과 2차 권선의 권수비는 20 : 1이다.)", "choices": ["① 1457[V]", "② 1864[V]", "③ 2448[V]", "④ 2963[V]"], "answerIndex": 2, "solution": "전압변동률 $\\varepsilon = \\dfrac{V_{20}-V_{2n}}{V_{2n}}\\times 100$ → 무부하 2차 전압 $V_{20} = V_{2n}(1+\\varepsilon) = 120\\times 1.02 = 122.4$[V]\n1차 단자전압 $V_1 = a\\,V_{20} = 20\\times 122.4 = 2448$[V]. 따라서 ③.\n(강의: $20\\times120 = 2400$의 2%인 48V를 더한 값)", "timestampSec": 745, "theory": "**핵심 공식**: $V_1 = a(1+\\varepsilon)V_{2n}$, $\\varepsilon = \\dfrac{V_{20}-V_{2n}}{V_{2n}}\\times100 = p\\cos\\theta + q\\sin\\theta$\n**개념**: 1차 단자전압은 무부하 2차 전압에 권수비를 곱한 값. 무부하 시 2차 전압이 정격보다 올라간다.\n**함정 포인트**: 2400에서 48을 '빼면' 2352 — 무부하 전압은 항상 전부하보다 크므로 더해야 한다."}, {"no": 9, "question": "정격용량 100[kVA]인 단상 변압기 3대를 △-△결선하여 300[kVA]의 3상 출력을 얻고 있다. 한 상에 고장이 발생하여 결선을 V결선으로 하는 경우 각 변압기의 출력[kVA]은?", "choices": ["① 126.5", "② 100", "③ 86.6", "④ 75.6"], "answerIndex": 2, "solution": "V결선 출력 $P_V = \\sqrt{3}P = \\sqrt{3}\\times 100 = 173.2$[kVA]\n변압기 2대가 이를 나눠 부담하므로 각 변압기 출력 = $\\dfrac{P_V}{2} = \\dfrac{100\\sqrt{3}}{2} = 86.6$[kVA]. 따라서 ③.", "timestampSec": 878, "theory": "**핵심 공식**: $P_V = \\sqrt{3}P$, 이용률 $\\dfrac{\\sqrt3}{2} = 86.6\\%$, 출력비 $\\dfrac{P_V}{P_\\triangle} = \\dfrac{1}{\\sqrt3} = 57.7\\%$\n**개념**: '각 변압기의 출력' = V결선 총출력을 2로 나눈 값 = 정격 × 이용률 0.866.\n**함정 포인트**: 총출력(173.2)·이용률(86.6%)·출력비(57.7%)를 묻는 문제를 서로 바꿔 출제. '각 변압기' → 86.6."}, {"no": 10, "question": "외분권 차동 복권발전기의 단자전압 $V$는? ($\\phi_s$: 직권 계자 권선에 의한 자속, $\\phi_f$: 분권 계자의 자속, $R_a$: 전기자의 저항, $R_s$: 직권 계자저항, $I_a$: 전기자의 전류, $I$[A]: 부하전류, $n$[rps]: 속도, $k=PZ/a$이며, 자기회로의 포화현상과 전기자 반작용은 무시한다.)", "choices": ["① $V = k(\\phi_f+\\phi_s)n - I_aR_a - IR_s$[V]", "② $V = k(\\phi_f-\\phi_s)n - I_aR_a - IR_s$[V]", "③ $V = k(\\phi_f+\\phi_s)n - I_a(R_a+R_s)$[V]", "④ $V = k(\\phi_f-\\phi_s)n - I_a(R_a+R_s)$[V]"], "answerIndex": 3, "solution": "차동 복권 → 직권 자속이 분권 자속을 상쇄하므로 유기기전력 $E = k(\\phi_f - \\phi_s)n$.\n외분권 → 직권 계자권선은 전기자와 직렬이므로 전기자 전류 $I_a$가 $R_a$와 $R_s$를 모두 흐른다 → 전압강하 $I_a(R_a+R_s)$.\n$V = E - I_a(R_a+R_s) = k(\\phi_f-\\phi_s)n - I_a(R_a+R_s)$. 따라서 ④.", "timestampSec": 945, "theory": "**핵심 공식**: $E = k\\phi n$, 발전기 $V = E - I_aR_a$(복권은 $R_s$ 추가)\n**개념**: 가동복권 $\\phi_f+\\phi_s$, 차동복권 $\\phi_f-\\phi_s$. 외분권은 직권권선에 $I_a$, 내분권은 직권권선에 부하전류 $I$가 흐른다.\n**함정 포인트**: 부호(±)와 직권저항 전류($I_a$ vs $I$) 두 가지를 조합해 4보기 구성. '차동 = 빼기', '외분권 = $I_a$'."}, {"no": 11, "question": "직류 직권 전동기에서 벨트(belt)를 걸고 운전하면 안 되는 이유는?", "choices": ["① 손실이 많아진다.", "② 직결하지 않으면 속도 제어가 곤란하다.", "③ 벨트가 벗겨지면 위험 속도에 도달한다.", "④ 벨트가 마모하여 보수가 곤란하다."], "answerIndex": 2, "solution": "직권 전동기는 $N \\propto \\dfrac{V}{\\phi} \\propto \\dfrac{V}{I_a}$ 이므로 무부하가 되면 자속이 급감하여 속도가 무한대로 상승(위험속도)한다.\n벨트가 벗겨지면 무부하 상태가 되므로 벨트 운전을 금지하고 반드시 직결한다. 따라서 ③.", "timestampSec": 1145, "theory": "**핵심 공식**: $N = k\\dfrac{V - I_a(R_a+R_s)}{\\phi}$, 직권기는 $\\phi \\propto I_a$ → 무부하 시 $\\phi \\to 0$, $N \\to \\infty$\n**개념**: 직권 전동기는 무부하 운전 금지, 벨트 운전 금지, 기어·직결 사용. 기동토크가 커서 전차·크레인용.\n**함정 포인트**: 분권 전동기의 '계자 회로 개방 금지'와 짝으로 출제. 둘 다 원리는 자속 감소 → 위험속도."}, {"no": 12, "question": "A, B 2대의 동기 발전기를 병렬운전 중 계통 주파수를 바꾸지 않고 B기의 역률을 좋게 하는 것은?", "choices": ["① A기의 여자전류를 증대", "② A기의 원동기 출력을 증대", "③ B기의 여자전류를 증대", "④ B기의 원동기 출력을 증대"], "answerIndex": 0, "solution": "병렬운전 중 한 발전기의 여자를 증가시키면 그 발전기의 기전력이 커져 무효순환전류가 흐르고, 여자를 늘린 쪽은 역률이 저하, 상대 쪽은 역률이 향상된다.\nB기의 역률을 좋게 하려면 **A기의 여자전류를 증대**시키면 된다(주파수는 원동기 출력과 관계되므로 불변). 따라서 ①.", "timestampSec": 1195, "theory": "**핵심 개념**: 여자전류 조정 → 무효전력(역률) 분담 변경, 원동기 출력(조속기) 조정 → 유효전력·주파수 변경\n**개념**: 여자를 증대한 발전기 = 기전력 상승 = 지상 무효전류 부담 증가 = 역률 저하. 상대 발전기는 역률 향상.\n**함정 포인트**: 'B기의 역률을 좋게' → B기가 아니라 A기의 여자를 올린다. 원동기 출력 보기는 주파수를 바꾸므로 조건 위배."}, {"no": 13, "question": "단상 반파의 정류 효율은?", "choices": ["① $\\dfrac{4}{\\pi^2}\\times 100$[%]", "② $\\dfrac{\\pi^2}{4}\\times 100$[%]", "③ $\\dfrac{8}{\\pi^2}\\times 100$[%]", "④ $\\dfrac{\\pi^2}{8}\\times 100$[%]"], "answerIndex": 0, "solution": "단상 반파 정류효율 $\\eta = \\dfrac{4}{\\pi^2}\\times 100 = 40.53$[%]\n단상 전파 정류효율 $\\eta = \\dfrac{8}{\\pi^2}\\times 100 = 81.05$[%]\n반파를 물었으므로 ①.", "timestampSec": 1335, "theory": "**핵심 공식**: 반파 $\\dfrac{4}{\\pi^2}=40.5\\%$, 전파 $\\dfrac{8}{\\pi^2}=81.1\\%$ (전파 = 반파의 2배)\n**개념**: 정류효율 = 직류출력/교류입력. 맥동률은 반파 121%, 전파 48%.\n**함정 포인트**: 분자·분모를 뒤집은 $\\pi^2/4$, $\\pi^2/8$은 100%를 넘으므로 효율이 될 수 없다 — 즉시 배제."}, {"no": 14, "question": "변압기의 전일효율을 최대로 하기 위한 조건은?", "choices": ["① 전부하 시간이 짧을수록 무부하손을 적게 한다.", "② 전부하 시간이 짧을수록 철손을 크게 한다.", "③ 부하시간에 관계없이 전부하 동손과 철손을 같게 한다.", "④ 전부하 시간이 길수록 철손을 적게 한다."], "answerIndex": 0, "solution": "전일효율 최대 조건: $24P_i = \\sum h\\,P_c$ (하루 철손량 = 하루 동손량)\n전부하 시간이 짧으면 하루 동손량이 작으므로 철손(무부하손)도 그만큼 작게 설계해야 한다. 따라서 ①.\n②는 반대, ④는 시간이 길면 철손을 크게 해도 되므로 틀림, ③은 부하시간을 반드시 고려해야 하므로 틀림.", "timestampSec": 1405, "theory": "**핵심 공식**: 전일효율 최대 조건 $24P_i = \\sum h P_c$ (24시간 철손 = 사용시간 동손)\n**개념**: 철손은 24시간 발생, 동손은 부하 시간에만 발생. 사용시간이 짧을수록 철손을 작게(무부하손 小) 설계.\n**함정 포인트**: 일반 최대효율 조건 '철손 = 동손'을 부하시간과 무관하다고 착각하게 하는 ③이 대표 오답."}, {"no": 15, "question": "변압기 내부고장 보호에 사용되는 계전기가 아닌 것은?", "choices": ["① 과전압 계전기", "② 차동전류 계전기", "③ 부흐홀쯔 계전기", "④ 비율차동 계전기"], "answerIndex": 0, "solution": "변압기 내부고장 보호용 계전기: **차동(전류차동·비율차동) 계전기, 부흐홀쯔 계전기**(+ 압력·온도 계전기).\n과전압       <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
</html>
