 이하 4.0mm 이상, 400V 초과 5.0mm 이상\n**개념**: 보안공사는 도로 횡단 등 위험 장소에서 전선 강도·경간 기준을 강화한 공사다.\n**함정 포인트**: 일반 저압 가공전선 기준(절연 2.6mm, 나전선 3.2mm)이 보기로 함께 나와 혼동을 유도한다. '보안공사' 키워드가 보이면 4.0/5.0."}, {"no": 8, "question": "백열전등 또는 방전등에 전기를 공급하는 옥내 전로(주택의 옥내 전로를 제외한다)의 대지전압은 몇 [V] 이하여야 하는가?", "choices": ["① 250", "② 300", "③ 350", "④ 400"], "answerIndex": 1, "solution": "백열전등·방전등 옥내 전로의 대지전압은 **300[V] 이하**이어야 한다.", "timestampSec": 629, "theory": "**핵심 수치**: 옥내 전로(백열전등·방전등) 대지전압 300V 이하\n**개념**: 조명용 옥내 전로는 감전 위험을 낮추기 위해 대지전압을 제한한다. 주택 옥내 전로는 별도 규정(300V 이하, 조건부)이 있다.\n**함정 포인트**: 사람이 쉽게 접촉하는 장소의 시설 조건과 함께 출제되기도 한다. 300이라는 숫자를 기억."}, {"no": 9, "question": "통신설비의 식별표시에 대한 사항으로 알맞지 않은 것은?", "choices": ["① 모든 통신기기에는 식별이 용이하도록 인식용 표찰을 부착하여야 한다.", "② 통신사업자의 설비표시명판은 플라스틱 및 금속판 등 견고하고 가벼운 재질로 하고 글씨는 각인하거나 지워지지 않도록 제작된 것을 사용하여야 한다.", "③ 배전주에 시설하는 통신설비의 설비표시명판의 경우 직선주는 전주 10경간마다 시설할 것", "④ 배전주에 시설하는 통신설비의 설비표시명판의 경우 분기주, 인류주는 매 전주에 시설할 것"], "answerIndex": 2, "solution": "배전주 직선주의 설비표시명판은 10경간이 아니라 **전주 5경간마다** 시설해야 한다. 따라서 ③이 틀린 내용이다.\n분기주·인류주는 매 전주에 시설(④ 맞음).", "timestampSec": 670, "theory": "**핵심 수치**: 통신설비 설비표시명판 — 직선주: 5경간마다 / 분기주·인류주: 매 전주 (지중은 관로 맨홀마다 등)\n**개념**: 통신설비는 소유자 식별이 쉽도록 표찰·명판을 부착한다.\n**함정 포인트**: 5경간을 10경간으로 바꾸는 수치 변형이 단골. '직선주 5 / 분기·인류 매 전주' 세트 암기."}, {"no": 10, "question": "소세력 회로의 전선을 조영재에 붙여 시설하는 경우 전선은 공칭단면적 몇 [mm²] 이상의 연동선 또는 이와 동등 이상의 세기 및 굵기의 것일 것이어야 하는가? (단, 케이블(통신용 케이블을 포함한다)인 경우 이외)", "choices": ["① 0.75", "② 1", "③ 1.5", "④ 2.5"], "answerIndex": 1, "solution": "소세력 회로의 전선을 조영재에 붙여 시설하는 경우 **공칭단면적 1[mm²] 이상의 연동선**을 사용해야 한다.\n(참고: 저압 옥내배선 2.5mm², 제어·전광표시장치 등 1.5mm²와 구분할 것)", "timestampSec": 740, "theory": "**핵심 수치**: 소세력 회로 조영재 붙임 시설 전선 1mm² 이상 연동선\n**개념**: 소세력 회로(초인종·경보 등 60V 이하)는 위험이 작아 일반 배선(2.5mm²)보다 가는 전선이 허용된다.\n**함정 포인트**: 저압 옥내배선 2.5mm², 전광표시·제어회로 1.5mm², 소세력 조영재 붙임 1mm² — 세 수치가 보기로 함께 나온다."}, {"no": 11, "question": "지중 전선로를 직접 매설식에 의하여 시설하는 경우에 차량 및 기타 중량물의 압력을 받을 우려가 있는 장소의 매설 깊이는 몇 [m] 이상인가?", "choices": ["① 1.0", "② 1.2", "③ 1.5", "④ 1.8"], "answerIndex": 0, "solution": "직접 매설식 지중 전선로의 매설 깊이는 차량 등 중량물의 압력을 받을 우려가 있는 장소에서 **1.0[m] 이상**, 기타 장소에서는 0.6[m] 이상이다.", "timestampSec": 846, "theory": "**핵심 수치**: 직접 매설식 깊이 — 중량물 압력 우려 있는 장소 1.0m 이상 / 없는 장소 0.6m 이상\n**개념**: 지중 전선로는 직접 매설식·관로식·암거식으로 시설하며, 매설 깊이는 외력으로부터 케이블을 보호하기 위한 기준이다.\n**함정 포인트**: 과거 기준 1.2m로 헷갈리기 쉽다(개정됨). '우려 있음 1.0 / 없음 0.6' 현행 수치로 암기."}, {"no": 12, "question": "수소냉각식 발전기의 시설 중 발전기, 조상기 안의 수소 순도가 몇 [%] 이하로 저하한 경우 경보장치를 시설하는가?", "choices": ["① 75", "② 80", "③ 85", "④ 90"], "answerIndex": 2, "solution": "수소냉각식 발전기·조상기는 수소 순도가 **85[%] 이하**로 저하하면 경보하는 장치를 시설해야 한다.", "timestampSec": 900, "theory": "**핵심 수치**: 수소 순도 85% 이하 → 경보장치 동작\n**개념**: 수소 순도가 낮아지면(공기 혼입) 폭발성 혼합기체가 될 수 있어 경보로 관리한다. 수소 압력·온도 계측장치도 함께 시설한다.\n**함정 포인트**: 85 대신 90·80이 보기로 나온다. '수소 순도 85' 고정 암기."}, {"no": 13, "question": "고압 가공전선이 가공약전류 전선과 접근하여 시설될 때 고압 가공전선과 가공약전류 전선 사이의 이격거리는 몇 [m] 이상이어야 하는가?", "choices": ["① 0.4", "② 0.5", "③ 0.6", "④ 0.8"], "answerIndex": 3, "solution": "가공약전류전선과의 이격거리는 저압 가공전선은 0.6[m], **고압 가공전선은 0.8[m] 이상**이다.\n(케이블 사용 시 저압 0.3m, 고압 0.4m로 완화)", "timestampSec": 975, "theory": "**핵심 수치**: 가공약전류전선과의 이격 — 저압 0.6m(케이블 0.3m) / 고압 0.8m(케이블 0.4m)\n**개념**: 전력선과 통신선(약전류전선)은 유도장해·접촉 방지를 위해 이격거리를 확보한다.\n**함정 포인트**: 저압 0.6과 고압 0.8이 뒤바뀌어 출제된다. '고압이면 한 단계 큰 값'으로 기억."}, {"no": 14, "question": "시가지에 설치시 사용전압 170[kV] 초과일 경우 전선의 굵기는 얼마 이상이어야 하는가?", "choices": ["① 22", "② 150", "③ 50", "④ 240"], "answerIndex": 3, "solution": "시가지 특고압 가공전선의 단면적 기준: 100[kV] 미만은 55[mm²] 이상, 100[kV] 이상 170[kV] 이하는 150[mm²] 이상, **170[kV] 초과는 240[mm²] 이상**이다.", "timestampSec": 1061, "theory": "**핵심 수치**: 시가지 특고압 전선 굵기 — 100kV 미만 55mm² / 100~170kV 150mm² / 170kV 초과 240mm²\n**개념**: 시가지는 인구 밀집 지역이므로 전선 단선 사고 방지를 위해 굵은 전선을 요구한다.\n**함정 포인트**: 66kV→55mm², 154kV→150mm² 같은 실계통 전압으로 연결해 기억하면 편하다."}, {"no": 15, "question": "22.9[kV] 특고압 가공전선로가 도로를 횡단시에 높이로 알맞은 것은? (단위: m)", "choices": ["① 4", "② 5", "③ 5.5", "④ 6"], "answerIndex": 3, "solution": "특고압(35kV 이하) 가공전선의 도로 횡단 시 지표상 높이는 **6[m] 이상**이다.\n(도로 횡단: 저압·고압·특고압 모두 6m 이상 / 철도 횡     <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
</html>
