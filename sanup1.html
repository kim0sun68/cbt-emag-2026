<script id="data" type="application/json">{"title": "2026 전기산업기사 회로이론 1회 기출 핵심풀이", "videoId": "_JibgV0GPQ8", "questions": [{"no": 1, "question": "$R-L$ 직렬 회로에 $i = I_1\\sin\\omega t + I_3\\sin 3\\omega t$인 전류를 흘리는 데 필요한 단자전압 $e$[V]는?", "choices": ["① $(R\\sin\\omega t + \\omega L\\cos\\omega t)I_1 + (R\\sin 3\\omega t + 3\\omega L\\cos 3\\omega t)I_3$", "② $(R\\sin\\omega t + \\omega L\\cos 3\\omega t)I_1 + (R\\sin 3\\omega t + 3\\omega L\\cos\\omega t)I_3$", "③ $(R\\sin 3\\omega t + \\omega L\\cos 3\\omega t)I_1 + (R\\sin\\omega t + 3\\omega L\\cos 3\\omega t)I_3$", "④ $(R\\sin 3\\omega t + \\omega L\\cos\\omega 3t)I_1 + (R\\sin\\omega t + 3\\omega L\\cos 3\\omega t)I_3$"], "answerIndex": 0, "solution": "$e = Ri + L\\dfrac{di}{dt}$\n\n저항 성분: $R(I_1\\sin\\omega t + I_3\\sin 3\\omega t)$\n인덕턴스 성분: $L\\dfrac{d}{dt}(I_1\\sin\\omega t + I_3\\sin 3\\omega t) = \\omega L\\cos\\omega t\\,I_1 + 3\\omega L\\cos 3\\omega t\\,I_3$\n\n$I_1$으로 묶으면 기본파끼리, $I_3$로 묶으면 3고조파끼리 정리되어\n$e = (R\\sin\\omega t + \\omega L\\cos\\omega t)I_1 + (R\\sin 3\\omega t + 3\\omega L\\cos 3\\omega t)I_3$", "timestampSec": 14, "theory": "**핵심 공식**: $e = Ri + L\\dfrac{di}{dt}$, $\\dfrac{d}{dt}\\sin n\\omega t = n\\omega\\cos n\\omega t$\n**개념**: 고조파 전류가 흐르는 R-L 회로의 단자전압은 각 주파수 성분별로 독립적으로 계산해 합성한다. 미분 시 각주파수 $n\\omega$가 앞으로 나오고 sin이 cos으로 바뀐다.\n**함정 포인트**: 기본파 항에는 $\\omega L$, 3고조파 항에는 $3\\omega L$이 붙어야 한다. 보기에서 $I_1$ 묶음에 기본파, $I_3$ 묶음에 3고조파가 이쁘게 정리된 것은 ①뿐이다."}, {"no": 2, "question": "어떤 교류 회로에 $v = 100\\sin\\omega t + 20\\sin\\left(3\\omega t + \\dfrac{\\pi}{3}\\right)$[V]인 전압을 가했을 때 이것에 의해 회로에 흐르는 전류가 $i = 40\\sin\\left(\\omega t - \\dfrac{\\pi}{6}\\right) + 5\\sin\\left(3\\omega t + \\dfrac{\\pi}{12}\\right)$[A]라 한다. 이 회로에서 소비전력은 약 몇 [kW]인가?", "choices": ["① 1.27", "② 1.77", "③ 1.97", "④ 2.27"], "answerIndex": 1, "solution": "같은 주파수 성분끼리만 전력이 발생한다(최댓값 사용 시 $\\frac{1}{2}$ 계수).\n\n기본파: $P_1 = \\dfrac{1}{2}\\times 100\\times 40\\times\\cos(0-(-30°)) = 2000\\cos 30° = 1732$[W]\n3고조파: $P_3 = \\dfrac{1}{2}\\times 20\\times 5\\times\\cos(60°-15°) = 50\\cos 45° = 35.4$[W]\n\n$P = 1732 + 35.4 = 1767$[W] $\\approx 1.77$[kW]", "timestampSec": 302, "theory": "**핵심 공식**: $P = \\sum \\dfrac{1}{2}V_{mn}I_{mn}\\cos\\theta_n$ (비정현파 소비전력)\n**개념**: 비정현파 전력은 같은 차수의 고조파끼리만 유효전력을 만든다. 최댓값을 그대로 쓰면 각 항에 $\\frac{1}{2}$을 곱한다.\n**함정 포인트**: 위상차는 전압각−전류각으로 계산($0-(-30°)=30°$, $60°-15°=45°$). 마지막 단위가 kW이므로 $\\times 10^{-3}$을 잊지 말 것."}, {"no": 3, "question": "$i = I_m\\sin(\\omega t - 15°)$[A]인 정현파에 있어서 $\\omega t$가 다음 중 어느 값일 때 순시값이 실효값과 같은가?", "choices": ["① $30°$", "② $45°$", "③ $60°$", "④ $90°$"], "answerIndex": 2, "solution": "순시값 = 실효값 조건:\n$I_m\\sin(\\omega t - 15°) = \\dfrac{I_m}{\\sqrt{2}}$\n\n$\\sin(\\omega t - 15°) = \\dfrac{1}{\\sqrt{2}}$ 이므로 $\\omega t - 15° = 45°$\n\n$\\therefore \\omega t = 15° + 45° = 60°$", "timestampSec": 457, "theory": "**핵심 공식**: 정현파 실효값 $I = \\dfrac{I_m}{\\sqrt{2}}$, $\\sin 45° = \\dfrac{1}{\\sqrt{2}}$\n**개념**: 순시값이 실효값과 같아지는 순간은 위상각 전체가 $45°$가 되는 시점이다.\n**함정 포인트**: $-15°$의 위상 지연을 빼먹고 $\\omega t = 45°$(②)로 답하지 않도록 주의."}, {"no": 4, "question": "그림의 회로에서 단자 $a-b$에 나타나는 전압은 몇 [V]인가? (2Ω·12V, 4Ω·4V, 8Ω·24V, 16Ω·112V 지로가 병렬 연결)", "choices": ["① 10", "② 12", "③ 14", "④ 16"], "answerIndex": 3, "solution": "밀만의 정리 적용 (4V 전원은 극성이 반대):\n\n$V_{ab} = \\dfrac{\\dfrac{12}{2} - \\dfrac{4}{4} + \\dfrac{24}{8} + \\dfrac{112}{16}}{\\dfrac{1}{2} + \\dfrac{1}{4} + \\dfrac{1}{8} + \\dfrac{1}{16}} = \\dfrac{6 - 1 + 3 + 7}{\\dfrac{15}{16}} = \\dfrac{15\\times 16}{15} = 16$[V]", "timestampSec": 595, "theory": "**핵심 공식**: 밀만의 정리 $V_{ab} = \\dfrac{\\sum E_k/R_k}{\\sum 1/R_k}$\n**개념**: 여러 전압원+직렬저항 지로가 병렬로 연결된 회로의 단자전압은 각 지로의 단락전류 합을 합성 컨덕턴스로 나눈 값이다.\n**함정 포인트**: 전원의 극성을 확인해 부호를 결정할 것 — 이 문제에서는 4[V] 전원만 반대 방향이라 $-\\frac{4}{4}$로 계산한다."}, {"no": 5, "question": "그림과 같은 회로에서 $t=0$인 순간 $S$를 열었을 때 $L$의 양단에 발생하는 역기전력은 인가전압의 몇 배가 발생하는가? (전원 $E$–스위치 $S$–병렬 $r_1$–직렬 $r$–$L$ 회로)", "choices": ["① $\\dfrac{r}{r+r_1}$", "② $\\dfrac{r_1 r}{r+r_1}$", "③ $\\dfrac{r+r_1}{r_1 r}$", "④ $\\dfrac{r+r_1}{r}$"], "answerIndex": 3, "solution": "$S$가 닫혀 있던 정상상태에서 $L$은 단락으로 보고 $L$에 흐르는 전류는 $i = \\dfrac{E}{r}$\n\n$S$를 여는 순간 인덕터 전류는 연속이므로 이 전류가 $r \\to r_1$ 폐회로로 흐른다.\n$L$ 양단 전압 $= i(r + r_1) = \\dfrac{E}{r}(r+r_1)$\n\n$\\therefore \\dfrac{e_L}{E} = \\dfrac{r+r_1}{r}$배", "timestampSec": 699, "theory": "**핵심 공식**: $e_L = -L\\dfrac{di}{dt}$, 인덕터 전류는 순간적으로 변할 수 없다.\n**개념**: 스위치 개방 직후 인덕터는 직전 전류 $E/r$를 유지하며, 이 전류가 $r+r_1$ 경로에 흐르므로 큰 역기전력이 발생한다.\n**함정 포인트**: 개방 직전 전류를 구할 때 정상상태에서 $L$은 단락 취급($r$만으로 결정), $r_1$에는 전류가 흐르지 않는다."}, {"no": 6, "question": "$i(t) = \\dfrac{4I_m}{\\pi}\\left(\\sin\\omega t + \\dfrac{1}{3}\\sin 3\\omega t + \\dfrac{1}{5}\\sin 5\\omega t + \\cdots\\right)$를 표시하는 파형은?", "choices": ["① 반파 구형파 (0~T/2 구간만 $+I_m$)", "② 원점 대칭 구형파 ($+I_m$, $-I_m$ 교번)", "③ 한쪽으로 치우친 구형파", "④ 삼각파"], "answerIndex": 1, "solution": "$\\dfrac{4I_m}{\\pi}$ 계수와 홀수 고조파($1, 3, 5, \\cdots$차)의 $\\dfrac{1}{n}$ 감쇠 sin 급수는 구형파(사각파)의 푸리에 급수이다.\n\nsin 항만 존재 → 원점 대칭(기함수), 홀수 고조파만 존재 → 반파 대칭.\n따라서 $+I_m$과 $-I_m$을 교번하는 원점 대칭 구형파인 ②가 된다.", "timestampSec": 805, "theory": "**핵심 공식**: 구형파 푸리에 급수 $\\dfrac{4I_m}{\\pi}\\sum_{n=1,3,5\\cdots}\\dfrac{1}{n}\\sin n\\omega t$\n**개념**: sin 항만 → 기함수(원점 대칭), 홀수 차수만 → 반파 대칭. 두 조건을 만족하는 대표 파형이 대칭 구형파다.\n**함정 포인트**: 삼각파는 $\\dfrac{8I_m}{\\pi^2}$ 계수에 $\\dfrac{1}{n^2}$ 감쇠이므로 ④와 혼동하지 말 것."}, {"no": 7, "question": "3상 불평형 전압에서 불평형률은?", "choices": ["① $\\dfrac{영상전압}{정상전압}\\times 100$[%]", "② $\\dfrac{역상전압}{정상전압}\\times 100$[%]", "③ $\\dfrac{정상전압}{역상전압}\\times 100$[%]", "④ $\\dfrac{정상전압}{영상전압}\\times 100$[%]"], "answerIndex": 1, "solution": "불평형률 $= \\dfrac{역상분\\ V_2}{정상분\\ V_1}\\times 100$[%]\n\n여기서 정상분 $V_1 = \\dfrac{1}{3}(V_a + aV_b + a^2V_c)$, 역상분 $V_2 = \\dfrac{1}{3}(V_a + a^2V_b + aV_c)$", "timestampSec": 956, "theory": "**핵심 공식**: 불평형률 $= \\dfrac{V_2(역상)}{V_1(정상)}\\times 100$[%]\n**개념**: 대칭좌표법에서 불평형의 정도는 정상분 대비 역상분의 비율로 정의한다.\n**함정 포인트**: 분자가 역상, 분모가 정상 — 영상분(①)과 혼동하기 쉬운 대표 암기 문제."}, {"no": 8, "question": "전압 200[V], 전류 30[A]로서 4.3[kW]의 전력을 소비하는 회로의 리액턴스는 약 몇 [Ω]인가?", "choices": ["① 3.35", "② 4.65", "③ 5.35", "④ 6.65"], "answerIndex": 1, "solution": "피상전력: $P_a = VI = 200\\times 30 = 6000$[VA]\n유효전력: $P = 4300$[W]\n무효전력: $P_r = \\sqrt{6000^2 - 4300^2} = 4184$[Var]\n\n$P_r = I^2 X$이므로\n$X = \\dfrac{P_r}{I^2} = \\dfrac{4184}{30^2} = 4.65$[Ω]", "timestampSec": 1025, "theory": "**핵심 공식**: $P_a = VI$, $P_r = \\sqrt{P_a^2 - P^2}$, $X = \\dfrac{P_r}{I^2}$\n**개념**: 전력 삼각형에서 무효전력을 구한 뒤, 무효전력이 리액턴스에서 소비되는 $I^2X$임을 이용한다.\n**함정 포인트**: $R = P/I^2$(유효전력)과 $X = P_r/I^2$(무효전력)을 혼동하지 말 것. kW→W 단위 환산 주의."}, {"no": 9, "question": "코일에 단상 100[V]의 전압을 가하면 30[A]의 전류가 흐르고 1.8[kW]의 전력을 소비한다고 한다. 이 코일의 병렬로 콘덴서를 접속하여 회로의 역률을 100[%]로 하기 위한 용량 리액턴스는 약 몇 [Ω]인가?", "choices": ["① 4.2", "② 6.2", "③ 8.2", "④ 10.2"], "answerIndex": 0, "solution": "피상전력: $P_a = 100\\times 30 = 3000$[VA]\n유효전력: $P = 1800$[W]\n무효전력: $P_r = \\sqrt{3000^2 - 1800^2} = 2400$[Var]\n\n역률 100%로 만들려면 $Q_c = P_r = 2400$[Var]를 콘덴서가 공급해야 하고, $Q_c = \\dfrac{V^2}{X_c}$이므로\n$X_c = \\dfrac{V^2}{P_r} = \\dfrac{100^2}{2400} = 4.17 \\approx 4.2$[Ω]", "timestampSec": 1295, "theory": "**핵심 공식**: $Q_c = \\dfrac{V^2}{X_c}$, 완전 역률 보상 조건 $Q_c = P_r$\n**개념**: 병렬 콘덴서는 부하의 지상 무효전력을 상쇄한다. 역률 100%는 콘덴서 무효전력 = 코일 무효전력일 때다.\n**함정 포인트**: 병렬 접속이므로 $Q_c = V^2/X_c$ (전압 기준)를 사용한다. $I^2X_c$로 계산하면 안 된다."}, {"no": 10, "question": "$r$[Ω]인 6개의 저항을 그림과 같이 접속하고 평형 3상 전압 $E$를 가했을 때 전류 $I$는 몇 [A]인가? (단, $r = 3$[Ω], $E = 60$[V]이다.)", "choices": ["① 8.66", "② 9.56", "③ 10.8", "④ 12.6"], "answerIndex": 0, "solution": "내부 △(각 변 $r$)를 Y로 등가변환하면 각 상 $\\dfrac{r}{3}$이 되고, 선로 저항 $r$과 직렬이 되어 1상당 임피던스는\n$Z = r + \\dfrac{r}{3} = \\dfrac{4r}{3} = 4$[Ω]\n\n상전압은 $\\dfrac{E}{\\sqrt{3}}$이므로 선전류는\n$I = \\dfrac{E/\\sqrt{3}}{4} = \\dfrac{60}{4\\sqrt{3}} = 8.66$[A]", "timestampSec": 1445, "theory": "**핵심 공식**: △→Y 변환 $R_Y = \\dfrac{R_\\Delta}{3}$, $I_l = \\dfrac{E/\\sqrt{3}}{Z_{1상}}$\n**개념**: 복잡한 3상 저항 회로는 △를 Y로 바꿔 1상 등가회로로 해석한다. 선간전압 $E$를 상전압 $E/\\sqrt{3}$으로 환산한다.\n**함정 포인트**: $E$가 선간전압임을 놓치고 $60/4 = 15$로 계산하거나, △→Y 변환($\\div 3$)을 빼먹지 않도록 주의."}, {"no": 11, "question": "어느 저항에 $v_1 = 220\\sqrt{2}\\sin(2\\pi\\cdot 60t - 30°)$[V]와 $v_2 = 100\\sqrt{2}\\sin(3\\cdot 2\\pi\\cdot 60t - 30°)$[V]의 전압이 각각 걸릴 때의 설명으로 옳은 것은?", "choices": ["① $v_1$이 $v_2$보다 위상이 $15°$ 앞선다.", "② $v_1$이 $v_2$보다 위상이 $15°$ 뒤진다.", "③ $v_1$이 $v_2$보다 위상이 $75°$ 앞선다.", "④ $v_1$과 $v_2$의 위상관계는 의미가 없다."], "answerIndex": 3, "solution": "$v_1$은 기본파(60Hz), $v_2$는 3고조파(180Hz)로 주파수가 서로 다르다.\n\n위상차 비교는 같은 주파수의 파형끼리만 의미가 있으므로, 주파수가 다른 $v_1$과 $v_2$의 위상관계는 의미가 없다.", "timestampSec": 1615, "theory": "**핵심 공식**: 위상차 비교 조건 — 동일 주파수($\\omega$ 동일)\n**개념**: 위상각은 같은 각주파수 $\\omega t$ 기준의 상대적 시간차다. 주파수가 다르면 두 파형의 상대 위상이 시시각각 변하므로 위상차 자체가 정의되지 않는다.\n**함정 포인트**: 겉보기에 둘 다 $-30°$라 위상차 $0°$ 또는 $15°$류로 헷갈리기 쉽지만, $\\omega$가 1:3이므로 비교 불가가 정답."}, {"no": 12, "question": "그림과 같은 4단자 회로망에서 출력 측을 개방하니 $V_1 = 12$[V], $I_1 = 2$[A], $V_2 = 4$[V]이고, 출력 측을 단락하니 $V_1 = 16$[V], $I_1 = 4$[A], $I_2 = 2$[A]이었다. 4단자 정수 $A$, $B$, $C$, $D$는 얼마인가?", "choices": ["① $A=2$, $B=3$, $C=8$, $D=0.5$", "② $A=0.5$, $B=2$, $C=3$, $D=8$", "③ $A=8$, $B=0.5$, $C=2$, $D=3$", "④ $A=3$, $B=8$, $C=0.5$, $D=2$"], "answerIndex": 3, "solution": "$V_1 = AV_2 + BI_2$, $I_1 = CV_2 + DI_2$\n\n출력 개방($I_2=0$): $A = \\dfrac{V_1}{V_2} = \\dfrac{12}{4} = 3$, $C = \\dfrac{I_1}{V_2} = \\dfrac{2}{4} = 0.5$\n\n출력 단락($V_2=0$): $B = \\dfrac{V_1}{I_2} = \\dfrac{16}{2} = 8$, $D = \\dfrac{I_1}{I_2} = \\dfrac{4}{2} = 2$", "timestampSec": 1685, "theory": "**핵심 공식**: $A = \\dfrac{V_1}{V_2}\\Big|_{I_2=0}$, $B = \\dfrac{V_1}{I_2}\\Big|_{V_2=0}$, $C = \\dfrac{I_1}{V_2}\\Big|_{I_2=0}$, $D = \\dfrac{I_1}{I_2}\\Big|_{V_2=0}$\n**개념**: 개방 시험에서 $A$, $C$, 단락 시험에서 $B$, $D$를 구한다.\n**함정 포인트**: 개방/단락 조건에 맞는 측정값 세트를 짝지어 사용해야 한다. 검산: $AD - BC = 6 - 4 = 2$ (비대칭 회로 가능)."}, {"no": 13, "question": "$e_i(t) = Ri(t) + L\\dfrac{di(t)}{dt} + \\dfrac{1}{C}\\int i(t)dt$에서 모든 초기값을 0으로 하고 라플라스 변환했을 때 $I(s)$는? (단, $I(s)$, $E_i(s)$는 각각 $i(t)$, $e_i(t)$를 라플라스 변환한 것이다.)", "choices": ["① $\\dfrac{Cs}{LCs^2 + RCs + 1}E_i(s)$", "② $\\dfrac{1}{R + Ls + \\dfrac{1}{C}}E_i(s)$", "③ $\\dfrac{1}{s^2 + \\dfrac{L}{R}s + \\dfrac{1}{LC}}E_i(s)$", "④ $\\left(R + Ls + \\dfrac{1}{C}\\right)E_i(s)$"], "answerIndex": 0, "solution": "미분 → $s$, 적분 → $\\dfrac{1}{s}$ 이므로\n$E_i(s) = RI(s) + LsI(s) + \\dfrac{1}{Cs}I(s)$\n\n$I(s) = \\dfrac{E_i(s)}{R + Ls + \\dfrac{1}{Cs}}$\n\n분모·분자에 $Cs$를 곱하면\n$I(s) = \\dfrac{Cs}{LCs^2 + RCs + 1}E_i(s)$", "timestampSec": 1826, "theory": "**핵심 공식**: $\\mathcal{L}\\left[\\dfrac{di}{dt}\\right] = sI(s)$, $\\mathcal{L}\\left[\\int i\\,dt\\right] = \\dfrac{I(s)}{s}$ (초기값 0)\n**개념**: R-L-C 직렬회로의 라플라스 영역 임피던스는 $R + Ls + \\frac{1}{Cs}$이고, $I(s) = E_i(s)/Z(s)$이다.\n**함정 포인트**: ②는 적분항을 $\\frac{1}{C}$로 잘못 변환한 오답. 반드시 $\\frac{1}{Cs}$로 변환한 뒤 $Cs$를 곱해 정리한 ①이 정답."}, {"no": 14, "question": "어떤 회로에 흐르는 전류가 $i = 5 + 14.1\\sin\\omega t$인 경우 실효값은 약 몇 [A]인가?", "choices": ["① 11.2[A]", "② 12.5[A]", "③ 14.4[A]", "④ 16.1[A]"], "answerIndex": 0, "solution": "비정현파 실효값 = 각 성분 실효값 제곱합의 제곱근\n\n$I = \\sqrt{5^2 + \\left(\\dfrac{14.1}{\\sqrt{2}}\\right)^2} = \\sqrt{25 + 99.7} = \\sqrt{124.7} \\approx 11.2$[A]", "timestampSec": 1985, "theory": "**핵심 공식**: $I = \\sqrt{I_0^2 + \\left(\\dfrac{I_{m1}}{\\sqrt{2}}\\right)^2 + \\cdots}$\n**개념**: 직류분은 그 자체가 실효값, 교류분은 최댓값을 $\\sqrt{2}$로 나눈 후 제곱합한다. $14.1/\\sqrt{2} \\approx 10$이 되도록 출제된 전형 문제.\n**함정 포인트**: 교류 최댓값 14.1을 그대로 제곱($\\sqrt{25+198.8}\\approx 15$)하면 오답. 반드시 실효값으로 환산 후 합성."}, {"no": 15, "question": "$T$형 4단자 회로망에서 영상 임피던스가 $Z_{01} = 50$[Ω], $Z_{02} = 2$[Ω]이고, 전달 정수가 0일 때 이 회로의 4단자 정수 $D$의 값은?", "choices": ["① 10", "② 5", "③ 0.2", "④ 0.1"], "answerIndex": 2, "solution": "영상 파라미터에 의한 4단자 정수:\n$A = \\sqrt{\\dfrac{Z_{01}}{Z_{02}}}\\cosh\\theta$, $D = \\sqrt{\\dfrac{Z_{02}}{Z_{01}}}\\cosh\\theta$\n\n전달 정수 $\\theta = 0$이므로 $\\cosh 0 = 1$\n\n$D = \\sqrt{\\dfrac{2}{50}} = \\sqrt{\\dfrac{1}{25}} = 0.2$", "timestampSec": 2035, "theory": "**핵심 공식**: $A = \\sqrt{\\dfrac{Z_{01}}{Z_{02}}}\\cosh\\theta$, $D = \\sqrt{\\dfrac{Z_{02}}{Z_{01}}}\\cosh\\theta$, $B = \\sqrt{Z_{01}Z_{02}}\\sinh\\theta$, $C = \\dfrac{\\sinh\\theta}{\\sqrt{Z_{01}Z_{02}}}$\n**개념**: $A$와 $D$는 근호 안 분자·분모가 서로 반대다. $A$는 1차측($Z_{01}$)이 위, $D$는 2차측($Z_{02}$)이 위.\n**함정 포인트**: $A$ 공식으로 계산하면 $\\sqrt{50/2} = 5$(②)가 나온다. 문제가 $D$를 물었으므로 뒤집어서 0.2가 정답."}, {"no": 16, "question": "$RLC$ 직렬회로에서 공진 시의 전류는 공급 전압에 대하여 어떤 위상차를 갖는가?", "choices": ["① $0°$", "② $90°$", "③ $180°$", "④ $270°$"], "answerIndex": 0, "solution": "직렬 공진 시 $\\omega L = \\dfrac{1}{\\omega C}$가 되어 허수부(리액턴스)가 0이 된다.\n\n$Z = R + j\\left(\\omega L - \\dfrac{1}{\\omega C}\\right) = R$ (순저항)\n\n임피던스가 순저항이므로 전류와 전압은 동상, 위상차 $0°$이다.", "timestampSec": 2175, "theory": "**핵심 공식**: 공진 조건 $\\omega L = \\dfrac{1}{\\omega C}$, $f_0 = \\dfrac{1}{2\\pi\\sqrt{LC}}$\n**개념**: 공진이란 허수부가 0이 되는 상태로, 임피던스는 최소($=R$), 전류는 최대, 역률은 1이 된다.\n**함정 포인트**: 공진 시 '위상차 없음(동상)'이 핵심. 전류 최대·임피던스 최소·역률 1이 모두 같은 말이다."}, {"no": 17, "question": "시정수가 $\\tau$를 갖는 $R-L$ 직렬 회로에 직류 전압을 가할 때 $t = 3\\tau$가 되는 시간에 회로에 흐르는 전류는 최종값의 몇 [%]가 되는가?", "choices": ["① 63", "② 86", "③ 95", "④ 98"], "answerIndex": 2, "solution": "$i(t) = \\dfrac{E}{R}\\left(1 - e^{-\\frac{R}{L}t}\\right)$\n\n$t = 3\\tau = \\dfrac{3L}{R}$ 대입:\n$i(3\\tau) = \\dfrac{E}{R}(1 - e^{-3}) = \\dfrac{E}{R}(1 - 0.0498) = 0.95\\dfrac{E}{R}$\n\n최종값의 약 95[%]", "timestampSec": 2205, "theory": "**핵심 공식**: $i(t) = \\dfrac{E}{R}(1 - e^{-t/\\tau})$, $\\tau = \\dfrac{L}{R}$\n**개념**: $1\\tau$: 63.2%, $2\\tau$: 86.5%, $3\\tau$: 95%, $4\\tau$: 98.2%, $5\\tau$: 99.3% — 시정수 배수별 도달률은 암기 사항.\n**함정 포인트**: $1\\tau = 63\\%$(①)와 혼동 주의. $3\\tau$는 $1 - e^{-3} = 0.95$."}, {"no": 18, "question": "파형률과 파고율의 값이 옳게 연결된 것은?", "choices": ["① 사각파 : 파형률 1, 파고율 2", "② 정현파 : 파형률 1.11, 파고율 1.41", "③ 삼각파 : 파형률 1.15, 파고율 1.23", "④ 정현반파 : 파형률 1.5, 파고율 1.73"], "answerIndex": 1, "solution": "파형률 $= \\dfrac{실효값}{평균값}$, 파고율 $= \\dfrac{최댓값}{실효값}$\n\n정현파: 파형률 $= \\dfrac{I_m/\\sqrt{2}}{2I_m/\\pi} = \\dfrac{\\pi}{2\\sqrt{2}} = 1.11$, 파고율 $= \\dfrac{I_m}{I_m/\\sqrt{2}} = \\sqrt{2} = 1.41$ → 옳음\n\n① 사각파는 파형률 1, 파고율 1 (파고율 2가 틀림)\n③ 삼각파는 파형률 1.15, 파고율 $\\sqrt{3} = 1.73$\n④ 정현반파는 파형률 1.57, 파고율 2", "timestampSec": 2345, "theory": "**핵심 공식**: 파형률 $= \\dfrac{실효값}{평균값}$, 파고율 $= \\dfrac{최댓값}{실효값}$\n**개념**: 사각파 (1, 1) / 정현파 (1.11, 1.41) / 삼각파 (1.15, 1.73) / 정현반파 (1.57, 2) 조합 암기.\n**함정 포인트**: 삼각파 파고율은 1.23이 아니라 $\\sqrt{3}=1.73$, 사각파 파고율은 2가 아니라 1 — 오답 보기의 단골 수법."}, {"no": 19, "question": "상순이 $abc$인 3상 회로에 있어서 대칭분 전압이 $V_0 = -8 + j3$[V], $V_1 = 6 - j8$[V], $V_2 = 8 + j12$[V]일 때 $a$상의 전압 $V_a$[V]는?", "choices": ["① $6 + j7$", "② $8 + j12$", "③ $6 + j14$", "④ $16 + j4$"], "answerIndex": 0, "solution": "$a$상 전압은 대칭분의 합:\n$V_a = V_0 + V_1 + V_2$\n$= (-8 + j3) + (6 - j8) + (8 + j12)$\n$= (-8 + 6 + 8) + j(3 - 8 + 12)$\n$= 6 + j7$[V]", "timestampSec": 2555, "theory": "**핵심 공식**: $V_a = V_0 + V_1 + V_2$, $V_b = V_0 + a^2V_1 + aV_2$, $V_c = V_0 + aV_1 + a^2V_2$\n**개념**: 대칭좌표법의 역변환 — $a$상은 연산자 없이 세 대칭분을 그대로 더한다.\n**함정 포인트**: $b$, $c$상을 물으면 $a = 1\\angle 120°$ 연산자가 붙지만, $a$상은 단순 합산이라 계산이 가장 쉽다."}, {"no": 20, "question": "$F(s) = \\dfrac{s+1}{s^2 + 2s}$의 역라플라스 변환은?", "choices": ["① $\\dfrac{1}{2}(1 - e^{-t})$", "② $\\dfrac{1}{2}(1 - e^{-2t})$", "③ $\\dfrac{1}{2}(1 + e^{-t})$", "④ $\\dfrac{1}{2}(1 + e^{-2t})$"], "answerIndex": 3, "solution": "$F(s) = \\dfrac{s+1}{s(s+2)}$ 부분분수 전개:\n\n$\\dfrac{s+1}{s(s+2)} = \\dfrac{1}{2}\\cdot\\dfrac{2s+2}{s(s+2)} = \\dfrac{1}{2}\\left(\\dfrac{1}{s} + \\dfrac{1}{s+2}\\right)$\n\n(검산: $K_1 = \\dfrac{s+1}{s+2}\\Big|_{s=0} = \\dfrac{1}{2}$, $K_2 = \\dfrac{s+1}{s}\\Big|_{s=-2} = \\dfrac{1}{2}$)\n\n$\\therefore f(t) = \\dfrac{1}{2}(1 + e^{-2t})$", "timestampSec": 2655, "theory": "**핵심 공식**: $\\mathcal{L}^{-1}\\left[\\dfrac{1}{s}\\right] = 1$, $\\mathcal{L}^{-1}\\left[\\dfrac{1}{s+a}\\right] = e^{-at}$, 유수법 $K = (s-p)F(s)\\big|_{s=p}$\n**개념**: 분모를 인수분해($s(s+2)$)하고 부분분수로 나눈 뒤 항별로 역변환한다.\n**함정 포인트**: 극점이 $s=0, -2$이므로 지수는 $e^{-2t}$ — $e^{-t}$ 보기(①③)에 속지 말 것. 부호도 $+$가 정답."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
