식**: RC 충전 $v_C(t) = E(1-e^{-t/RC})$\n**개념**: 정상상태에서 커패시터는 개방으로 취급되어 전원전압 전체가 걸린다.\n**함정 포인트**: 6.32[V]는 $t = RC$(시정수) 시점의 값(63.2%)이지 최대값이 아니다."}, {"no": 11, "question": "그림과 같은 회로의 영상 임피던스 $Z_{01}$, $Z_{02}[\\Omega]$은 각각 얼마인가? (직렬 $4[\\Omega]$, 병렬 $5[\\Omega]$의 L형 회로)", "choices": ["① $9,\\ 5$", "② $6,\\ \\dfrac{10}{3}$", "③ $4,\\ 5$", "④ $4,\\ \\dfrac{20}{9}$"], "answerIndex": 1, "solution": "4단자 정수: $A = 1 + \\dfrac{4}{5} = \\dfrac{9}{5}$, $B = 4$, $C = \\dfrac{1}{5}$, $D = 1$\n$Z_{01} = \\sqrt{\\dfrac{AB}{CD}} = \\sqrt{\\dfrac{\\frac{9}{5} \\times 4}{\\frac{1}{5} \\times 1}} = \\sqrt{36} = 6[\\Omega]$\n$Z_{02} = \\sqrt{\\dfrac{DB}{CA}} = \\sqrt{\\dfrac{1 \\times 4}{\\frac{1}{5} \\times \\frac{9}{5}}} = \\sqrt{\\dfrac{100}{9}} = \\dfrac{10}{3}[\\Omega]$", "timestampSec": 1433, "theory": "**핵심 공식**: $Z_{01} = \\sqrt{\\dfrac{AB}{CD}}$, $Z_{02} = \\sqrt{\\dfrac{DB}{CA}}$\n**개념**: 비대칭 회로($A \\neq D$)는 좌우 영상 임피던스가 다르다.\n**함정 포인트**: $Z_{01}$과 $Z_{02}$ 공식에서 $A$와 $D$의 위치가 서로 바뀐다."}, {"no": 12, "question": "$RC$회로에 비정현파 전압을 가하여 흐른 전류가 다음과 같을 때 이 회로의 역률은 약 $[\\%]$인가?\n$v = 20 + 220\\sqrt{2}\\sin 120\\pi t + 40\\sqrt{2}\\sin 360\\pi t[\\mathrm{V}]$\n$i = 2.2\\sqrt{2}\\sin(120\\pi t + 36.87°) + 0.49\\sqrt{2}\\sin(360\\pi t + 14.04°)[\\mathrm{A}]$", "choices": ["① 75.8", "② 80.4", "③ 86.3", "④ 89.7"], "answerIndex": 1, "solution": "유효전력: $P = 220 \\times 2.2 \\times \\cos 36.87° + 40 \\times 0.49 \\times \\cos 14.04°$\n$= 484 \\times 0.8 + 19.6 \\times 0.97 \\approx 387.2 + 19.0 = 406.2[\\mathrm{W}]$\n피상전력: $P_a = \\sqrt{20^2 + 220^2 + 40^2} \\times \\sqrt{2.2^2 + 0.49^2} \\approx 224.5 \\times 2.25 \\approx 505.6[\\mathrm{VA}]$\n역률 $= \\dfrac{406.2}{505.6} \\times 100 \\approx 80.4[\\%]$", "timestampSec": 1581, "theory": "**핵심 공식**: 비정현파 역률 $= \\dfrac{P}{P_a} \\times 100$, $P_a = V_{rms} \\cdot I_{rms}$\n**개념**: 실효값은 직류분 포함 전 성분의 제곱합 제곱근, 유효전력은 동일 주파수끼리만 계산한다.\n**함정 포인트**: 전압의 직류분 20[V]는 피상전력에는 포함되지만 전류에 직류분이 없어 유효전력에는 기여하지 않는다."}, {"no": 13, "question": "각 상의 전류가 $i_a = 30\ V}]$와 $1.5[\\mathrm{V}]$ 서로 반대 극성 후 가극성", "② $1.5[\\mathrm{V}]$와 $1.5[\\mathrm{V}]$ 서로 반대 극성(감극성)", "③ $1.5[\\mathrm{V}]$와 $3[\\mathrm{V}]$ 가극성", "④ $1.5[\\mathrm{V}]$와 $3[\\mathrm{V}]$ 감극성"], "answerIndex": 1, "solution": "②는 같은 크기 1.5[V] 두 전지가 서로 반대 방향으로 연결되어\n$I = \\dfrac{1.5 - 1.5}{R} = \\dfrac{0}{R} = 0$\n전류가 흐르지 않아 전구에 불이 들어오지 않는다.\n④는 $\\dfrac{3-1.5}{R} \\neq 0$이므로 불이 켜진다.", "timestampSec": 2284, "theory": "**핵심 공식**: 직렬 전원 합성 $E = E_1 \\pm E_2$ (극성에 따라)\n**개념**: 기전력이 반대 방향이면 차가 되고, 크기가 같으면 합성 기전력이 0이다.\n**함정 포인트**: 반대 극성이라도 크기가 다르면(1.5 vs 3) 전류는 흐른다."}, {"no": 17, "question": "다음 회로의 단자 $a, b$에 나타나는 전압$[\\mathrm{V}]$은 얼마인가? ($3[\\Omega]$ 직렬 $9[\\mathrm{V}]$ 가지와 $6[\\Omega]$ 직렬 $12[\\mathrm{V}]$ 가지가 병렬)", "choices": ["① 9", "② 10", "③ 12", "④ 3"], "answerIndex": 1, "solution": "밀만의 정리:\n$V_{ab} = \\dfrac{\\dfrac{9}{3} + \\dfrac{12}{6}}{\\dfrac{1}{3} + \\dfrac{1}{6}} = \\dfrac{3+2}{\\dfrac{1}{2}} = 10[\\mathrm{V}]$", "timestampSec": 2392, "theory": "**핵심 공식**: 밀만의 정리 $V_{ab} = \\dfrac{\\sum E_i/R_i}{\\sum 1/R_i}$\n**개념**: 여러 전압원 가지가 병렬일 때 개방 단자전압을 한 번에 구한다.\n**함정 포인트**: 분자는 전압/저항(전류), 분모는 컨덕턴스 합이다."}, {"no": 18, "question": "라플라스변환 중 옳은 것은?", "choices": ["① $\\mathcal{L}[\\delta(t)] = \\dfrac{1}{s}$", "② $\\mathcal{L}[t^n] = \\dfrac{n!}{s^{n-1}}$", "③ $\\mathcal{L}[e^{-at}] = \\dfrac{1}{s+a}$", "④ $\\mathcal{L}[f(t-a)] = e^{as}F(s)$"], "answerIndex": 2, "solution": "① 단위임펄스 $\\mathcal{L}[\\delta(t)] = 1$ (오답)\n② $\\mathcal{L}[t^n] = \\dfrac{n!}{s^{n+1}}$ (오답)\n③ $\\mathcal{L}[e^{-at}] = \\dfrac{1}{s+a}$ (정답)\n④ 시간추이 정리 $\\mathcal{L}[f(t-a)] = e^{-as}F(s)$ (부호 오답)", "timestampSec": 2439, "theory": "**핵심 공식**: $\\mathcal{L}[e^{-at}] = \\dfrac{1}{s+a}$, $\\mathcal{L}[t^n] = \\dfrac{n!}{s^{n+1}}$, $\\mathcal{L}[\\delta(t)]=1$\n**개념**: 시간추이 정리는 $e^{-as}$(음의 지수)를 곱한다.\n**함정 포인트**: 지수부 부호와 $s$의 차수를 바꾼 보기들이 함정이다."}, {"no": 19, "question": "$R, L, C$ 직렬공진회로에서 $R = 100[\\Omega]$, $L = 314[\\mathrm{mH}]$, $C = 125.6[\\mathrm{pF}]$일 때, 선택도(전압 확대율) $Q$는?", "choices": ["① $2\\times 10^3$", "② $3\\times 10^3$", "③ $4\\times 10^2$", "④ $5\\times 10^2$"], "answerIndex": 3, "solution": "$Q = \\dfrac{1}{R}\\sqrt{\\dfrac{L}{C}} = \\dfrac{1}{100}\\sqrt{\\dfrac{314\\times 10^{-3}}{125.6\\times 10^{-12}}}$\n$= \\dfrac{1}{100}\\sqrt{2.5\\times 10^9} = \\dfrac{5\\times 10^4}{100} = 500 = 5\\times 10^2$", "timestampSec": 2504, "theory": "**핵심 공식**: 직렬공진 선택도 $Q = \\dfrac{\\omega_0 L}{R} = \\dfrac{1}{\\omega_0 CR} = \\dfrac{1}{R}\\sqrt{\\dfrac{L}{C}}$\n**개념**: 공진 주파수를 몰라도 $Q = \\frac{1}{R}\\sqrt{L/C}$로 바로 계산할 수 있다.\n**함정 포인트**: mH($10^{-3}$)와 pF($10^{-12}$)의 지수 처리 실수에 주의한다."}, {"no": 20, "question": "변압비 $\\dfrac{n_1}{n_2} = 30$인 단상 변압기 3대를 1차 $\\Delta$, 2차 Y로 결선하고 1차에 선간 전압 $3300[\\mathrm{V}]$를 가했을 때의 무부하 2차 선간 전압$[\\mathrm{V}]$은?", "choices": ["① $250[\\mathrm{V}]$", "② $220[\\mathrm{V}]$", "③ $210[\\mathrm{V}]$", "④ $190[\\mathrm{V}]$"], "answerIndex": 3, "solution": "1차 $\\Delta$결선이므로 1차 상전압 = 선간전압 = 3300[V]\n2차 상전압 $V_{2p} = \\dfrac{3300}{30} = 110[\\mathrm{V}]$\n2차 Y결선이므로 선간전압 $V_{2l} = \\sqrt{3} \\times 110 \\approx 190[\\mathrm{V}]$", "timestampSec": 2663, "theory": "**핵심 공식**: $\\Delta$: $V_p = V_l$, Y: $V_l = \\sqrt{3}V_p$, 권수비 $a = V_{1p}/V_{2p}$\n**개념**: 권수비는 상전압끼리의 비율이므로 결선 방식에 따라 선간전압 환산이 달라진다.\n**함정 포인트**: 110[V]에서 멈추거나 $\\sqrt{3}$를 빼먹으면 오답 보기에 걸린다."}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const marks = ['①','②','③','④'];
let answered = 0, correct = 0;

function updateScore(){
  document.getElementById('score').textContent =
    `정답 ${correct} / 푼 문제 ${answered} / 전체 ${DATA.questions.length}`;
}

function mdBold(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

const app = document.getElementById('app');
DATA.questions.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  const ts = q.timestampSec;
  card.innerHTML = `
    <div class="qno">문제 ${q.no}</div>
    <div class="qtext">${mdBold(q.question)}</div>
    <div class="choices"></div>
    <button class="toggle">해설 보기</button>
    <div class="expl">
      <div class="answer-line">정답: ${marks[q.answerIndex]}</div>
      <div class="sol">${mdBold(q.solution)}</div>
      <div class="theory">${mdBold(q.theory)}</div>
      <a class="ytlink" href="https://youtu.be/${DATA.videoId}?t=${ts}" target="_blank" rel="noopener">▶ 영상 해설 바로가기 (${Math.floor(ts/60)}:${String(ts%60).padStart(2,'0')})</a>
    </div>`;
  const choicesBox = card.querySelector('.choices');
  const expl = card.querySelector('.expl');
  let done = false;
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = mdBold(c);
    b.addEventListener('click', () => {
      if (done) return;
      done = true;
      answered++;
      const btns = choicesBox.querySelectorAll('.choice');
      btns.forEach(x => x.disabled = true);
      if (i === q.answerIndex) {
        correct++;
        b.classList.add('correct');
        b.insertAdjacentHTML('beforeend','<span class="mark ok">✓</span>');
      } else {
        b.classList.add('wrong');
        b.insertAdjacentHTML('beforeend','<span class="mark no">✗</span>');
        btns[q.answerIndex].classList.add('correct');
      }
      expl.classList.add('open');
      updateScore();
    });
    choicesBox.appendChild(b);
  });
  card.querySelector('.toggle').addEventListener('click', () => {
    expl.classList.toggle('open');
  });
  app.appendChild(card);
});
updateScore();

document.addEventListener('DOMContentLoaded', () => {
  const tryRender = () => {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError: false
      });
    } else setTimeout(tryRender, 100);
  };
  tryRender();
});
</script>
</body>
